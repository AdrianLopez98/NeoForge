lblExample2=4 Darksteel Citadel (M15) 242
nlExample2=4 نسخ من «Darksteel Citadel» من «M15»، رقم التجميع «242».\n\n هذا مثال لسطر بصيغة MTGArena كما يصدّره TappedOut.
