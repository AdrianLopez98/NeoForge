nlExample3=18 بطاقة «Forest» لامعة من «THB»، رقم التجميع «254».\n\n هذا مثال لسطر بصيغة رزم MTGArena كما يصدّره MTGGoldfish. تدل «(F)» في النهاية على بطاقة لامعة، ويُستخدم رقم التجميع بين القوسين الزاويين لاختيار رسم معيّن للبطاقة.
lblExample4=4x TMP|Counterspell
nlExample4=4 نسخ من «Counterspell» من «Tempest».\n\n في هذا السطر يُحدَّد رمز الإصدار قبل اسم البطاقة باستخدام الفاصل «|» (اختياري). ومن الفواصل الصالحة الأخرى لرموز الإصدارات: الأقواس المعقوصة والمعقوفة والهلالية.
lblExample5=SB: 2 [M19:28] Mighty Leap
nlExample5=نسختان من «Mighty Leap» من «M19»، رقم التجميع «28»، تُضافان إلى «الاحتياط».\n\n هذا مثال لسطر بصيغة رزم XMage. في هذه الصيغة يُفصل رمز الإصدار عن رقم التجميع بنقطتين، ويُكتبان بين قوسين معقوفين قبل اسم البطاقة مباشرة. كما تُستخدم بادئة اختيارية (أي SB:) للدلالة على قسم الرزمة الذي تُضاف إليه البطاقة. ويوسّع مستورد الرزم في Forge هذه الفكرة بدعم بادئتين إضافيتين، هما «MB:» و«CM:»، لقسمي «الرئيسية» و«القائد» على التوالي.
