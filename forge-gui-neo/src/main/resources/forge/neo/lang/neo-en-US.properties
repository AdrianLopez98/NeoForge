ascent.event.res.noCards = There is nothing left to learn here.
ascent.event.toll.title = THE TOLL BRIDGE
ascent.event.toll.text = A big man charges to cross. Below there is a hundred metres of nothing, and he does not look like a haggler.
ascent.event.armory.title = THE ABANDONED ARMORY
ascent.event.armory.text = The doors stand wide open and nobody is left. Whatever is inside belongs to whoever walks by.
ascent.event.smith.title = THE SMITH
ascent.event.smith.text = He works the metal of things people no longer need. He sells little, dear, and he knows what it is worth.
ascent.event.nest.title = THE NEST
ascent.event.nest.text = Eggs the size of your head, and something big circling above. Nobody said this would be free.
ascent.event.crossroads.title = THE CROSSROADS
ascent.event.crossroads.text = A quiet spot to stop, and a heap of junk someone left by the road. There is no time for both.
ascent.event.mirage.title = THE MIRAGE
ascent.event.mirage.text = The road crosses something that is there and then is not. It will go well or it will not, and there is no telling beforehand.
ascent.event.pact.title = THE PACT
ascent.event.pact.text = It offers you something genuinely good. The price is neither money nor blood: it is how much you can take from now on.
ascent.event.lender.title = THE MONEYLENDER
ascent.event.lender.text = He lends whatever you ask and collects on the spot. Never in money.
ascent.event.statue.title = THE STATUE
ascent.event.statue.text = Someone raised it here a long time ago. It still has inlays, and it still listens.
ascent.event.wanderer.title = THE WANDERER
ascent.event.wanderer.text = Days without eating, weeks on the road. He asks for nothing, but he keeps looking at your pack.
ascent.event.well.title = THE WISHING WELL
ascent.event.well.text = It is full of coins from people who passed before. Once in a while someone pulled out more than they threw in.
ascent.event.hermit.title = THE HERMIT
ascent.event.hermit.text = He has lived here since before the road did. He says you travel heavy, and he does not mean the pack.
ascent.event.teacher.title = THE TEACHER
ascent.event.teacher.text = Two steps of watching you walk and she knows everything you do wrong. She offers to fix it, her way.
