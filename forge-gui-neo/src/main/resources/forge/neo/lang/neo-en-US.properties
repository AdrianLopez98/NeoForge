# =====================================================================
#  TUTORIAL - the controls of a game
# =====================================================================
app.preparingTutorial = Getting the lesson ready...

menu.tutorial = Tutorial
menu.tutorial.desc = The controls of a real game, by playing: reading cards, casting, attacking and activating abilities
menu.tutorial.note = needed to know the controls inside a game
menu.tutorial.done = all three lessons done - you can replay them

tutorial.title = Tutorial
tutorial.welcome = Welcome. Before playing for real, three short lessons on the controls of a game. You do not need to know Magic: this only teaches you to handle the table.
tutorial.progress = {0} of {1} lessons done
tutorial.play = Play: {0}
tutorial.reset = Start over
tutorial.lessonDone = done - you can replay it
tutorial.lessonSteps = {0} steps
tutorial.counter = TUTORIAL  -  {0}  -  step {1} of {2}
tutorial.next = Next
tutorial.skip = Skip this step
tutorial.quit = Leave the tutorial
tutorial.waiting = Do what it says up here and the step moves on by itself.
tutorial.done = Done.

tutorial.mesa.title = The table and your turn
tutorial.mesa.summary = Who is who, how to read a card, how to zoom the table in, and a whole turn: land, spell and stack.
tutorial.combate.title = Combat
tutorial.combate.summary = Attacking, blocking and reading the arrows. And what to do when the engine will not let you finish.
tutorial.trucos.title = Abilities, instants and commander
tutorial.trucos.summary = Activating an ability, choosing targets, stopping during the enemy turn, and the command zone.

tutorial.mesa.welcome.title = This is a practice game
tutorial.mesa.welcome.body = You are on a table set up for practice: nothing that happens here is saved. Read along and do what each step asks; an action step moves on by itself as soon as you do it. You can leave whenever you like with "Leave the tutorial", up here.
tutorial.mesa.you.title = You are the one at the bottom
tutorial.mesa.you.body = Your bar: name, life, any floating mana, and a counter for each zone (hand, library, graveyard, exile, command). When it lights up, the turn is yours.
tutorial.mesa.rival.title = Your opponent, on top
tutorial.mesa.rival.body = The same bar on the other side. Their hand shows as a number, not as cards. In a three or four player game, tabs appear on top to look at each opponent.
tutorial.mesa.zoom.title = Reading a card: RIGHT click
tutorial.mesa.zoom.body = Cards on the table are small on purpose, so they all fit. To read one, right click it: it comes up large, along with what the picture does not tell you (its power right now, counters, what is attached to it). A left click anywhere closes it. Try it on any card.
tutorial.mesa.board.title = Zooming the table: Ctrl + wheel
tutorial.mesa.board.body = With a full table the cards shrink. Ctrl + mouse wheel zooms in and out, keeping whatever is under the pointer still. Zoomed in, the middle mouse button (or Ctrl + drag) moves the table, and the badge in the corner takes you back to the whole table. Give the wheel a turn with Ctrl held down.
tutorial.mesa.phases.title = A turn runs in phases
tutorial.mesa.phases.body = The rail on the right is the steps of the turn, top to bottom: untap, upkeep, draw, first main, combat, second main and end. The lit one is where you are now. Later you will see they can also be clicked.
tutorial.mesa.button.title = What the game is asking of you
tutorial.mesa.button.body = Below the rail there is a line of text and a big button. The text says what is expected of you; the button says what will happen if you press it ("Pass", "End turn", "No blocks"...). The space bar presses it. It is the only place on screen with buttons that touch the game: everything else only tells you things.
tutorial.mesa.land.title = Play a land
tutorial.mesa.land.body = There is a Forest in your hand. Drag it from your hand onto the table, or just click it. Lands are where mana comes from, and you can only play ONE per turn. Careful: playing a land is one of the few things that cannot be undone.
tutorial.mesa.mana.title = Now you have mana
tutorial.mesa.mana.body = There it is, in your back row. Paying for a spell taps lands, and the game does that for you when you cast (you can change it in Settings). They untap again at the start of your turn.
tutorial.mesa.cast.title = Cast a creature
tutorial.mesa.cast.body = Drag the Runeclaw Bear from your hand onto the table, or click it. The mana is paid automatically. If a card cannot be cast right now, clicking it simply does nothing.
tutorial.mesa.stack.title = The stack
tutorial.mesa.stack.body = What you cast does not hit the table straight away: it goes on the stack first - the list on the right - and both players get to respond there. When nobody does anything, the top one resolves. The big banner in the middle mirrors the stack: if there is something, you see it; when it empties, it goes away. And a click pushes it aside.
tutorial.mesa.sick.title = Summoning sickness
tutorial.mesa.sick.body = The creature that just arrived looks dimmed: this turn it cannot attack or use abilities that need it tapped. From your next turn, it can. Lands do not have that problem.
tutorial.mesa.zones.title = Looking inside a zone
tutorial.mesa.zones.body = The counters on your bar (hand, library, graveyard, exile, command) can be clicked to open what is inside; the big piles on the table do the same. The library comes up face down: it is hidden information and the viewer does not reveal it. Open any zone.
tutorial.mesa.log.title = What just happened
tutorial.mesa.log.body = Bottom left there is a log button: what each player did, turn by turn, with yours in bold. It is where you look when the opponent does something and you did not get to read it. Open it.
tutorial.mesa.end.title = First lesson done
tutorial.mesa.end.body = You can read the table, move around it and play your turn. Next up: combat - attacking, blocking and the arrows.

tutorial.combate.intro.title = Two creatures ready
tutorial.combate.intro.body = The Runeclaw Bear and the Llanowar Elves have been out a turn, so they can attack. Across the table there is a 2/2 Wind Drake that can block.
tutorial.combate.go.title = Go to combat
tutorial.combate.go.body = Attacks are declared in their own step. Press the big button (or space) until the rail reaches "Declare attackers".
tutorial.combate.declare.title = Pick who attacks
tutorial.combate.declare.body = Click your creatures: attackers step forward towards the middle line and get an arrow pointing at your opponent. You can also drag a creature onto their portrait. When you are happy, press the big button to confirm.
tutorial.combate.arrows.title = The arrows tell the whole story
tutorial.combate.arrows.body = An arrow goes from each attacker to what it is attacking. When the other side blocks, another arrow goes from each blocker to the attacker it is standing in front of.
tutorial.combate.blocks.title = Now the opponent blocks
tutorial.combate.blocks.body = Press the big button and let them decide. Whatever they block does not hit the player: those creatures fight each other instead.
tutorial.combate.damage.title = Damage
tutorial.combate.damage.body = Anything unblocked lowers the enemy life total, and you will see it change on their bar. Damage on creatures stays marked until end of turn; if it reaches their toughness, they die. Right click shows how much a creature is carrying.
tutorial.combate.blocking.title = When they attack you
tutorial.combate.blocking.body = Blocking takes two clicks and the ORDER matters: first the attacker you want to stand in front of, then your creature. To remove a blocker, the same two clicks again.
tutorial.combate.why.title = If you press and nothing happens
tutorial.combate.why.body = Sometimes the engine refuses what you declared (a creature forced to attack, one that needs two blockers...). When that happens the reason appears BELOW the button you just pressed, naming the card that is in the way. If the button does not react, look there.
tutorial.combate.end.title = Second lesson done
tutorial.combate.end.body = Attacking, blocking and reading the arrows. What is left is what decides games: abilities and instants.

tutorial.trucos.intro.title = Cards that do things
tutorial.trucos.intro.body = You have a Prodigal Pyromancer on the table. As well as being a creature, it has an ability you can activate: tap it to deal 1 damage to anything.
tutorial.trucos.activate.title = Activate its ability
tutorial.trucos.activate.body = Click the Prodigal Pyromancer. When a card has several things to do, a menu shows all of them, with the ones you cannot pay for marked. Pick the ability, then click the enemy portrait to point it at them.
tutorial.trucos.targets.title = Choosing targets
tutorial.trucos.targets.body = When something needs a target, everything you can pick is highlighted and a curved arrow is drawn from source to target. Targets can be anywhere: the table, a graveyard or exile. If they are in a closed zone, the game opens it so you can click inside.
tutorial.trucos.instant.title = Cast an instant
tutorial.trucos.instant.body = There is a Lightning Bolt in your hand. An instant can be cast any time you have priority: on your turn, on the enemy turn, even with something waiting on the stack. Cast it at whatever you like.
tutorial.trucos.stops.title = Stopping during the enemy turn
tutorial.trucos.stops.body = So you do not have to press OK a thousand times, the game passes priority for you when there is nothing you could do. If you want to wait for a particular moment, CLICK A PHASE on the rail: that sets a stop and the game will give you priority there. Click one to try it (and click it again to remove it).
tutorial.trucos.commander.title = The command zone
tutorial.trucos.commander.body = To the right of your hand is the command zone, where your commander lives. You cast it from there, and every time you recast it costs {2} more: the tax shows next to it. In Commander you also lose if ONE commander deals you 21 damage in total, and that counter is on your bar.
tutorial.trucos.undo.title = Undo
tutorial.trucos.undo.body = Ctrl+Z undoes the last thing as long as the engine allows it, which means anything that went through the stack. Playing a land can NOT be undone, because it never goes there. Which is why it pays to look before you drop a land.
tutorial.trucos.pause.title = Escape and Settings
tutorial.trucos.pause.body = Escape opens the pause menu: resume, settings, restart and quit. Press it and go into SETTINGS: there is quite a lot in there that changes how the game plays and that nobody finds on their own, because the game works fine without touching any of it. Have a look, and come back to the game with Escape whenever you want.
tutorial.trucos.settings.title = What you can change in there
tutorial.trucos.settings.body = Settings is where you decide: whether mana is paid for you, whether priority is passed for you when you have nothing to do, when to stop during the enemy turn, how much to slow the AI down - it resolves its turn in milliseconds, and without slowing it you miss what it does -, whether to ask before you leave your main phase, interface size, language and volume. The same settings are there outside a game, also with Escape.
tutorial.trucos.end.title = You know how to play now
tutorial.trucos.end.body = Reading a card with right click, zooming with Ctrl+wheel, playing and attacking by clicking or dragging, activating abilities, responding with instants and stopping wherever you want. That is all of the controls. The rest is on the cards, which come with their text written on them. Enjoy.

