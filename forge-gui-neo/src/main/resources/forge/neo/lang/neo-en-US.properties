# El tutorial en Android: los pasos que hablan de gestos (decision 478 de Android)
tutorial.mesa.you.body.android = Your plate, bottom left next to your hand: name, life and any floating mana. Your piles (library, graveyard and exile) sit on the left edge of your half of the table, each with its count. When your plate lights up, it's your turn.
tutorial.mesa.rival.body.android = Your opponent's plate, top centre. Their hand shows as a number, not as cards. In a three- or four-player game, the other opponents appear as small tokens on the left of the top strip: tap them to look at each one.
tutorial.mesa.zoom.body.android = Cards on the table are small so they all fit. To read one, PRESS AND HOLD it: it opens large, with what the picture doesn't tell you (its current power, counters, what's attached to it). Swipe to go to the next one and tap outside to close it. In your hand, double-tap the card. Try it with any card on the table.
tutorial.mesa.board.body.android = When the table fills up, cards shrink. PINCH with two fingers to zoom in on the table, and move both fingers to pan around it. The «Reset zoom» button at the bottom left takes you back to the whole table. Pinch to zoom in.
tutorial.mesa.phases.body.android = At the top right is the rail with the steps of the turn: untap, upkeep, draw, main phase, combat, second main and end. The lit one is the current one. Later you'll see that tapping it lets you set stops.
tutorial.mesa.button.body.android = At the bottom right, above your hand, there's a line of text and a big button. The text says what's expected of you; the button says what will happen when you press it («Pass», «End turn», «No blocks»...). It's the only place with buttons that act on the game: everything else just informs.
tutorial.mesa.land.body.android = There's a Forest in your hand. DRAG IT from your hand onto the table: put your finger on it, slide it up above your hand and let go over the table. Tapping a card in your hand only shows it. Lands give you mana and you can only play ONE per turn. Careful: playing a land is one of the few things you can't undo.
tutorial.mesa.cast.body.android = Drag the Runeclaw Bear from your hand onto the table. The mana is paid automatically. If a card can't be cast right now, it goes back to your hand when you let go.
tutorial.mesa.stack.body.android = What you cast doesn't hit the table straight away: first it goes on the stack, where both players can respond. When nobody does anything, the top item resolves. While there's something on the stack, a pill shows on the right edge of the table: tap it to see what's there.
tutorial.mesa.zones.body.android = Your piles (library, graveyard and exile) are on the left edge of your half of the table: tap one and its contents open. Your opponent's work the same on their half. The library shows face down: it's hidden information and the viewer won't reveal it. Open any zone.
tutorial.mesa.log.body.android = At the top right, the ≡ button opens the table menu, and the Log is in there: what each player did, turn by turn. It's where you look when your opponent does something and you didn't have time to read it. Open it.
tutorial.combate.go.body.android = Attacks are declared in their own step. Press the big button until the rail at the top reaches «Declare attackers».
tutorial.combate.declare.body.android = Tap your creatures: the ones attacking move forward and get an arrow pointing at your opponent. You can also drag a creature onto your opponent's plate. When you're ready, press the big button to confirm; the first time it asks for a second tap, so you don't attack by accident.
tutorial.combate.damage.body.android = Whatever wasn't blocked lowers your opponent's life, and you'll see it change on their plate. Damage dealt to creatures stays marked until the end of the turn; if it reaches their toughness, they die. Press and hold a card to see how much it has taken.
tutorial.combate.blocking.body.android = To block, first tap the attacker you want to stand in front of and then your creature, or drag your creature onto the attacker. The ORDER matters. To remove a blocker, do the same again.
tutorial.trucos.activate.body.android = Tap the Prodigal Pyromancer. If a card can do several things a menu shows them all, and the ones you can't pay for are marked. Choose the ability and then tap your opponent's plate to target them.
tutorial.trucos.targets.body.android = When something needs a target, whatever you can choose is highlighted and an arrow goes from source to destination. Targets can be anywhere: the table, a graveyard or exile. If they're in a closed zone, the game opens it for you to tap inside.
tutorial.trucos.aura.body.android = In your hand there's a Curse of the Pierced Heart: an AURA that doesn't go on a creature but on a PLAYER («Enchant player»). Drag it onto the table and, when it asks for a target, tap your opponent's PLATE (top centre), not a card. From then on it deals them 1 damage at the start of each of their turns. Cast it on your opponent.
tutorial.trucos.instant.body.android = There's a Lightning Bolt in your hand. An instant can be cast any time you have priority: on your turn, on your opponent's, even with something waiting on the stack. Drag it onto the table and choose what to throw it at.
tutorial.trucos.stops.body.android = So you don't have to press OK a thousand times, the game passes priority for you when you can't do anything. If you want to wait for a specific moment, TAP THE RAIL at the top: the steps of the turn open, for your turns and your opponents'. Tap a step to set a stop and press Accept: the game will give you priority there. Try it (and remove it the same way).
tutorial.trucos.commander.body.android = On the left edge of your half of the table, next to your piles, is the command zone, where your commander lives. You cast it by tapping it, and every time you recast it, it costs {2} more: the tax shows next to it. In Commander you also lose if ONE commander deals you 21 damage in total, and that counter shows on your plate.
tutorial.trucos.undo.body.android = When the last action can be undone, the second button, next to the big one, reads «Undo»: it undoes what went through the stack. Playing a land can NOT be undone, because it doesn't go through there. That's why it's worth looking before you drop a land.
tutorial.trucos.pause.body.android = The ≡ button at the top right opens the table menu: log, settings and leave. While it's open, the game pauses. Tap it and go into SETTINGS: in there are things that change how you play and that you won't discover on your own, because the game works the same without touching them. Look around and go back to the game whenever you like.
tutorial.trucos.settings.body.android = In Settings you decide whether mana is paid automatically, whether priority passes on its own when you have nothing to do, when to stop on your opponent's turn, how much to slow the AI down (it resolves its turn in milliseconds, and without slowing it you miss what it does), whether to ask before leaving your main phase, card size, language and volume. The same settings are also in the main menu.
tutorial.trucos.end.body.android = Read a card by pressing and holding it, zoom the table by pinching, play by dragging from your hand, attack by tapping or dragging, activate abilities, respond with instants and stop wherever you like. Those are all the controls. The rest is told by the cards, which carry their own text. Enjoy.
tutorial.mesa.zoom.title.android = Read a card: press and hold
tutorial.mesa.board.title.android = Zoom the table: pinch
tutorial.trucos.pause.title.android = The ≡ menu and Settings

