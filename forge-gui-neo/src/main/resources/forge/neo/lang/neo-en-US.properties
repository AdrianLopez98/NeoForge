ascent.event.shrine.title = THE CRACKED SHRINE
ascent.event.shrine.text = A split stone with something shining inside. The crack is just wide enough for an arm, and the edges do not look friendly.
ascent.event.gambler.title = THE GAMBLER
ascent.event.gambler.text = He has set up his table in the middle of the road and shuffles without looking at the cards. He says the house always loses. He smiles as he says it.
ascent.event.chest.title = THE TRAPPED CHEST
ascent.event.chest.text = Locked with a mechanism you will not figure out in time. Something rattles inside, and the metal carries the marks of others who tried.
ascent.event.collector.title = THE COLLECTOR
ascent.event.collector.text = He wants neither your money nor your blood: he wants a card, any card, and he pays well for it. He insists that you pick.
ascent.event.campfire.title = THE FORGOTTEN CAMPFIRE
ascent.event.campfire.text = Someone left it burning and walked away. Enough to warm yourself for a while, or to burn something you no longer need.
ascent.event.echo.title = THE ECHO OF THE PLANE
ascent.event.echo.text = The air repeats your thoughts half a second late. Let it, and it teaches you something — but it charges for the lesson.
ascent.event.fountain.title = THE FOUNTAIN
ascent.event.fountain.text = Still water, no bottom in sight. The owner charges for a drink and explains nothing.
