ascent.event.campfire.title = ЗАБЫТЫЙ КОСТЁР
ascent.event.campfire.text = Кто-то оставил его гореть и ушёл. Хватит, чтобы согреться — или сжечь то, что больше не нужно.
ascent.event.echo.title = ЭХО ПЛАНА
ascent.event.echo.text = Воздух повторяет твои мысли с задержкой. Если позволишь — чему-то научит, но возьмёт своё.
