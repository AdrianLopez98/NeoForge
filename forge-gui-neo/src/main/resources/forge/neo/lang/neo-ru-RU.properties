ascent.event.armory.title = БРОШЕННЫЙ АРСЕНАЛ
ascent.event.armory.text = Ворота настежь, и никого не осталось. Что внутри — тому, кто мимо идёт.
ascent.event.smith.title = КУЗНЕЦ
ascent.event.smith.text = Он куёт из металла вещей, которые больше никому не нужны. Продаёт мало и дорого.
ascent.event.nest.title = ГНЕЗДО
ascent.event.nest.text = Яйца размером с твою голову, и наверху кружит что-то большое. Никто не обещал, что будет даром.
ascent.event.crossroads.title = ПЕРЕКРЁСТОК
ascent.event.crossroads.text = Тихое место, чтобы передохнуть, и куча хлама у дороги. На два дела времени нет.
ascent.event.mirage.title = МИРАЖ
ascent.event.mirage.text = Дорога идёт сквозь то, что то есть, то нет. Либо повезёт, либо нет, и заранее не узнать.
ascent.event.pact.title = ДОГОВОР
ascent.event.pact.text = Тебе предлагают что-то действительно хорошее. Цена не деньги и не кровь: цена — сколько ты выдержишь дальше.
ascent.event.lender.title = РОСТОВЩИК
ascent.event.lender.text = Даёт в долг сколько попросишь и берёт плату сразу. Никогда деньгами.
ascent.event.statue.title = СТАТУЯ
ascent.event.statue.text = Её поставили здесь очень давно. Инкрустация ещё на месте, и она всё ещё слушает.
ascent.event.wanderer.title = СТРАННИК
ascent.event.wanderer.text = Дни без еды, недели в пути. Он ничего не просит, но всё смотрит на твою сумку.
ascent.event.well.title = КОЛОДЕЦ ЖЕЛАНИЙ
ascent.event.well.text = Он полон монет тех, кто шёл раньше. Иногда кто-то доставал больше, чем бросал.
ascent.event.hermit.title = ОТШЕЛЬНИК
ascent.event.hermit.text = Он живёт здесь дольше, чем есть дорога. Говорит, ты идёшь с тяжёлой ношей — и это не про мешок.
ascent.event.teacher.title = НАСТАВНИЦА
ascent.event.teacher.text = Два шага — и она видит всё, что ты делаешь не так. Предлагает исправить. По-своему.
