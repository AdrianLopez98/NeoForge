# Тексты НАШЕГО интерфейса, на русском.
#
# То, что говорит ДВИЖОК (подсказки, фазы, диалоги, рождённые в forge-gui) уже
# переведено Forge и здесь не хранится. Здесь только наш собственный интерфейс.
#
# Это файл-перевод, а не резервный: если ключа здесь не хватает, используется
# английский (neo-en-US.properties), а если нет и там - показывается сам ключ.

