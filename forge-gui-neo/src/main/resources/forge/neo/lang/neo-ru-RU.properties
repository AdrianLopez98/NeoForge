# Общее распределение (какую ману даёт фильтрующая земля, щиты,
# урон или жетоны, распределённые между несколькими целями)
# ---------------------------------------------------------------------
amount.title = Распредели {0} {1}
amount.thing = маны
amount.help = Кликай по каждому, чтобы добавить, используй + и - или введи число.
