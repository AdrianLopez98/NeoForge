menu.tutorial = Обучение
menu.tutorial.desc = Управление в настоящей партии через игру: чтение карт, розыгрыш, атака и активация способностей
menu.tutorial.note = нужно, чтобы разобраться в управлении партией
menu.tutorial.done = все три урока пройдены - можно повторить

tutorial.title = Обучение
tutorial.welcome = Добро пожаловать. Перед тем как играть по-настоящему, три коротких урока об управлении партией. Знать Magic не обязательно: здесь учат только обращаться со столом.
tutorial.progress = Пройдено уроков: {0} из {1}
tutorial.play = Играть: {0}
tutorial.reset = Начать заново
tutorial.lessonDone = пройден - можно повторить
tutorial.lessonSteps = Шагов: {0}
tutorial.counter = ОБУЧЕНИЕ  -  {0}  -  шаг {1} из {2}
tutorial.next = Далее
tutorial.skip = Пропустить этот шаг
tutorial.quit = Выйти из обучения
tutorial.waiting = Сделай то, что написано выше, и шаг перейдёт сам.
tutorial.done = Готово.

tutorial.mesa.title = Стол и твой ход
tutorial.mesa.summary = Кто есть кто, как читать карту, как приближать стол, и целый ход: земля, заклинание и стек.
tutorial.combate.title = Бой
tutorial.combate.summary = Атака, блок и чтение стрелок. И что делать, когда движок не даёт закончить.
tutorial.trucos.title = Способности, мгновенные заклинания и командир
tutorial.trucos.summary = Активация способности, выбор целей, остановка в ход соперника и командная зона.

tutorial.mesa.welcome.title = Это тренировочная партия
tutorial.mesa.welcome.body = Ты за столом, подготовленным для тренировки: ничего из происходящего здесь не сохраняется. Читай и делай то, что просит каждый шаг; шаг-действие переходит сам, как только ты его выполнишь. Уйти можно в любой момент через "Выйти из обучения" вверху.
tutorial.mesa.you.title = Снизу - это ты
tutorial.mesa.you.body = Твоя панель: имя, жизни, свободная мана и счётчик для каждой зоны (рука, библиотека, кладбище, изгнание, командная зона). Когда она подсвечена - ход твой.
tutorial.mesa.rival.title = Сверху - соперник
tutorial.mesa.rival.body = Такая же панель с другой стороны. Его рука показана числом, а не картами. В партии на троих или четверых сверху появляются вкладки, чтобы смотреть на каждого соперника.
tutorial.mesa.zoom.title = Читаем карту: ПРАВЫЙ клик
tutorial.mesa.zoom.body = Карты на столе маленькие специально, чтобы все помещались. Чтобы прочитать карту, кликни по ней правой кнопкой: она увеличится, а с ней покажется и то, чего не видно на картинке (текущая сила, жетоны, что к ней прикреплено). Левый клик в любом месте закрывает окно. Попробуй на любой карте.
tutorial.mesa.board.title = Приближаем стол: Ctrl + колесо
tutorial.mesa.board.body = Когда стол заполнен, карты сжимаются. Ctrl + колесо мыши приближает и отдаляет, оставляя на месте то, что под курсором. При приближении стол двигается средней кнопкой мыши (или Ctrl + перетаскивание), а значок в углу возвращает к столу целиком. Прокрути колесо, удерживая Ctrl.
tutorial.mesa.phases.title = Ход идёт по фазам
tutorial.mesa.phases.body = Рейл справа - это шаги хода сверху вниз: разворот, содержание, взятие карты, первая основная, бой, вторая основная и конец. Подсвеченный - тот, в котором ты сейчас. Позже увидишь, что по ним можно ещё и кликать.
tutorial.mesa.button.title = Чего от тебя хочет игра
tutorial.mesa.button.body = Под рейлом есть строка текста и большая кнопка. Текст говорит, чего от тебя ждут; кнопка - что произойдёт, если её нажать ("Передать ход", "Закончить ход", "Не блокировать"...). Пробел нажимает её. Это единственное место на экране с кнопками, которые влияют на партию: всё остальное только информирует.
tutorial.mesa.land.title = Разыграй землю
tutorial.mesa.land.body = У тебя в руке Лес. Перетащи его из руки на стол или просто кликни по нему. Земли - источник маны, и за ход можно разыграть только ОДНУ. Осторожно: розыгрыш земли - одно из немногих действий, которые нельзя отменить.
tutorial.mesa.mana.title = Теперь у тебя есть мана
tutorial.mesa.mana.body = Вот она, в твоём заднем ряду. Чтобы оплатить заклинание, земли поворачиваются - игра делает это сама, когда ты разыгрываешь карту (это можно поменять в Настройках). В начале твоего хода они снова разворачиваются.
tutorial.mesa.cast.title = Разыграй существо
tutorial.mesa.cast.body = Перетащи Runeclaw Bear из руки на стол или кликни по нему. Мана оплатится сама. Если карту нельзя разыграть прямо сейчас, клик по ней просто ничего не сделает.
tutorial.mesa.stack.title = Стек
tutorial.mesa.stack.body = То, что ты разыгрываешь, попадает на стол не сразу: сначала оно идёт в стек - список справа, - и там оба игрока могут ответить. Когда никто ничего не делает, разрешается то, что сверху. Большой баннер в центре - зеркало стека: если там что-то есть, ты это видишь; когда стек опустеет, баннер исчезнет. А клик убирает его в сторону.
tutorial.mesa.sick.title = Болезнь призывания
tutorial.mesa.sick.body = Существо, которое только что вышло на поле, выглядит потускневшим: в этот ход оно не может атаковать и использовать способности, которые требуют его поворота. Со следующего твоего хода - сможет. У земель такой проблемы нет.
tutorial.mesa.zones.title = Загляни внутрь зоны
tutorial.mesa.zones.body = Счётчики на твоей панели (рука, библиотека, кладбище, изгнание, командная зона) можно кликнуть, чтобы открыть содержимое; большие стопки на столе делают то же самое. Библиотека открывается рубашкой вверх: это скрытая информация, и просмотрщик её не раскрывает. Открой любую зону.
tutorial.mesa.log.title = Что только что случилось
tutorial.mesa.log.body = Внизу слева есть кнопка журнала: что делал каждый игрок, ход за ходом, а твои действия выделены жирным. Туда стоит заглянуть, когда соперник что-то делает, а ты не успел прочитать. Открой его.
tutorial.mesa.end.title = Первый урок пройден
tutorial.mesa.end.body = Теперь ты умеешь читать стол, перемещаться по нему и разыгрывать свой ход. Дальше - бой: атака, блок и стрелки.

tutorial.combate.intro.title = Два существа готовы
tutorial.combate.intro.body = Runeclaw Bear и Llanowar Elves на поле уже ход, так что могут атаковать. На другой стороне стола - Wind Drake 2/2, который может блокировать.
tutorial.combate.go.title = Переходи к бою
tutorial.combate.go.body = Атаки объявляются в своём шаге. Нажимай большую кнопку (или пробел), пока рейл не дойдёт до "Атакующие".
tutorial.combate.declare.title = Выбери, кто атакует
tutorial.combate.declare.body = Кликай по своим существам: атакующие выходят вперёд к средней линии, и от них тянется стрелка к сопернику. Можно и перетащить существо на его портрет. Когда всё готово, нажми большую кнопку, чтобы подтвердить.
tutorial.combate.arrows.title = Стрелки рассказывают всё
tutorial.combate.arrows.body = От каждого атакующего идёт стрелка к тому, кого он атакует. Когда соперник блокирует, от каждого блокирующего пойдёт ещё одна стрелка к атакующему, перед которым он встал.
tutorial.combate.blocks.title = Теперь блокирует соперник
tutorial.combate.blocks.body = Нажми большую кнопку и дай ему решить. Всё, что он заблокирует, не заденет игрока: вместо этого существа будут драться друг с другом.
tutorial.combate.damage.title = Урон
tutorial.combate.damage.body = Всё, что осталось незаблокированным, снижает жизни соперника - изменение видно на его панели. Урон на существах остаётся помеченным до конца хода; если он достигает их выносливости, они умирают. Правый клик покажет, сколько урона на существе.
tutorial.combate.blocking.title = Когда атакуют тебя
tutorial.combate.blocking.body = Блок делается двумя кликами, и ПОРЯДОК важен: сначала атакующий, перед которым хочешь встать, потом твоё существо. Чтобы убрать блокирующего, те же два клика ещё раз.
tutorial.combate.why.title = Если нажимаешь, а ничего не происходит
tutorial.combate.why.body = Иногда движок отказывается принять то, что ты объявил (существо обязано атаковать, другому нужно два блокирующих...). Когда так происходит, причина появляется ПОД кнопкой, которую ты только что нажал, и называет карту, которая мешает. Если кнопка не реагирует, смотри туда.
tutorial.combate.end.title = Второй урок пройден
tutorial.combate.end.body = Атака, блок и чтение стрелок. Осталось то, что решает партии: способности и мгновенные заклинания.

tutorial.trucos.intro.title = Карты, которые что-то делают
tutorial.trucos.intro.body = У тебя на столе Prodigal Pyromancer. Помимо того, что это существо, у него есть способность, которую можно активировать: поверни его, чтобы нанести 1 урон чему угодно.
tutorial.trucos.activate.title = Активируй его способность
tutorial.trucos.activate.body = Кликни по Prodigal Pyromancer. Когда у карты есть несколько вариантов действий, появляется меню со всеми ними, а те, что нечем оплатить, помечены. Выбери способность, а затем кликни по портрету соперника, чтобы направить её на него.
tutorial.trucos.targets.title = Выбор целей
tutorial.trucos.targets.body = Когда чему-то нужна цель, всё, что можно выбрать, подсвечивается, а от источника к цели тянется изогнутая стрелка. Цели могут быть где угодно: на столе, на кладбище или в изгнании. Если они в закрытой зоне, игра сама её откроет, чтобы ты мог кликнуть внутри.
tutorial.trucos.instant.title = Разыграй мгновенное заклинание
tutorial.trucos.instant.body = У тебя в руке Lightning Bolt. Мгновенное заклинание можно разыграть в любой момент, когда у тебя есть приоритет: в свой ход, в ход соперника и даже когда что-то ждёт в стеке. Разыграй его на что хочешь.
tutorial.trucos.stops.title = Останавливаемся в ход соперника
tutorial.trucos.stops.body = Чтобы не нажимать ОК тысячу раз, игра сама передаёт приоритет, когда ты ничего не можешь сделать. Если хочешь дождаться конкретного момента, КЛИКНИ ПО ФАЗЕ на рейле: так ставится остановка, и игра даст тебе приоритет именно там. Кликни по одной, чтобы попробовать (и кликни ещё раз, чтобы убрать). Две вкладки над полосой, "Вы" и "Соперники", выбирают, к чьим ходам относятся эти остановки.
tutorial.trucos.commander.title = Командная зона
tutorial.trucos.commander.body = Справа от твоей руки - командная зона, где живёт твой командир. Ты разыгрываешь его оттуда, и каждый повторный розыгрыш стоит на {2} больше: налог показан рядом. В формате Командир ты также проигрываешь, если ОДИН командир нанёс тебе суммарно 21 урон, и этот счётчик есть на твоей панели.
tutorial.trucos.undo.title = Отмена
tutorial.trucos.undo.body = Ctrl+Z отменяет последнее действие, если движок это позволяет - то есть всё, что прошло через стек. Розыгрыш земли отменить НЕЛЬЗЯ, потому что он через стек не проходит. Поэтому стоит подумать, прежде чем разыгрывать землю.
tutorial.trucos.pause.title = Escape и настройки
tutorial.trucos.pause.body = Escape открывает меню паузы: продолжить, настройки, начать заново и выйти. Нажми его и зайди в НАСТРОЙКИ: там немало того, что меняет саму игру и что сам никогда не найдёшь, потому что без этого всё и так работает. Посмотри, а вернуться в партию можно по Escape в любой момент.
tutorial.trucos.settings.title = Что можно там поменять
tutorial.trucos.settings.body = В настройках ты решаешь: платится ли мана сама, передаётся ли приоритет сам, когда тебе нечего делать, в какие моменты останавливаться в ходе соперника, насколько замедлять ИИ - он разрешает свой ход за миллисекунды, и без замедления ты не увидишь, что он делает -, спрашивать ли перед выходом из твоей главной фазы, размер интерфейса, язык и громкость. Те же настройки есть и вне партии, тоже по Escape. Они разложены по вкладкам: почти всё это — в «Партии», размер — в «Экране», язык — в «Общих», громкость — в «Звуке».
tutorial.trucos.end.title = Теперь ты умеешь играть
tutorial.trucos.end.body = Читать карту правым кликом, приближаться Ctrl+колесом, разыгрывать и атаковать кликом или перетаскиванием, активировать способности, отвечать мгновенными заклинаниями и останавливаться где захочешь. Это всё управление. Остальное написано на самих картах. Приятной игры.

