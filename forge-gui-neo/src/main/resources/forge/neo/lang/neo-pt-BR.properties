tutorial.combate.title = O combate
tutorial.combate.summary = Atacar, bloquear e entender as flechas. E o que fazer quando o motor não deixa você terminar.
tutorial.trucos.title = Habilidades, mágicas instantâneas e comandante
tutorial.trucos.summary = Ativar uma habilidade, escolher alvo, parar no turno do rival e a zona de comando.

tutorial.mesa.welcome.title = Esta é uma partida de treino
tutorial.mesa.welcome.body = Você está numa mesa preparada para praticar: nada do que acontece aqui é salvo. Vá lendo e fazendo o que cada passo pede; um passo de ação avança sozinho assim que você o completa. Você pode sair quando quiser com "Sair do tutorial", aqui em cima.
tutorial.mesa.you.title = Você é o de baixo
tutorial.mesa.you.body = Sua barra: nome, vida, qualquer mana flutuante e um contador para cada zona (mão, grimório, cemitério, exílio, comando). Quando ela acende, o turno é seu.
tutorial.mesa.rival.title = Seu oponente, em cima
tutorial.mesa.rival.body = A mesma barra do outro lado. A mão dele aparece como um número, não como cartas. Numa partida de três ou quatro jogadores, aparecem abas em cima para olhar cada oponente.
tutorial.mesa.zoom.title = Ler uma carta: clique com o botão DIREITO
tutorial.mesa.zoom.body = As cartas na mesa são pequenas de propósito, para todas caberem. Para ler uma, clique nela com o botão direito: ela aparece grande, junto com o que a imagem não conta (o poder dela agora, contadores, o que está anexado a ela). Um clique com o botão esquerdo em qualquer lugar fecha. Tente com qualquer carta.
tutorial.mesa.board.title = Aproximando a mesa: Ctrl + roda do mouse
tutorial.mesa.board.body = Com a mesa cheia as cartas encolhem. Ctrl + roda do mouse aproxima e afasta, mantendo parado o que está sob o ponteiro. Aproximado, o botão do meio do mouse (ou Ctrl + arrastar) move a mesa, e o selo no canto te leva de volta à mesa inteira. Dê uma volta na roda com Ctrl pressionado.
tutorial.mesa.phases.title = Um turno passa por fases
tutorial.mesa.phases.body = O trilho à direita são os passos do turno, de cima para baixo: desvirar, manutenção, compra, primeira principal, combate, segunda principal e final. O aceso é onde você está agora. Mais adiante você verá que também dá para clicar neles.
tutorial.mesa.button.title = O que o jogo está pedindo de você
tutorial.mesa.button.body = Abaixo do trilho há uma linha de texto e um botão grande. O texto diz o que se espera de você; o botão diz o que vai acontecer se você apertá-lo ("Passar", "Terminar turno", "Não bloquear"...). A barra de espaço o aperta. É o único lugar na tela com botões que mexem na partida: todo o resto só informa.
tutorial.mesa.land.title = Jogue um terreno
tutorial.mesa.land.body = Há uma Floresta na sua mão. Arraste-a da mão para a mesa, ou simplesmente clique nela. Terrenos são de onde vem o mana, e você só pode jogar UM por turno. Cuidado: jogar um terreno é uma das poucas coisas que não podem ser desfeitas.
tutorial.mesa.mana.title = Agora você tem mana
tutorial.mesa.mana.body = Aí está, na sua fileira de trás. Pagar por uma mágica vira os terrenos, e o jogo faz isso por você ao conjurar (você pode mudar isso em Configurações). Eles desviram de novo no começo do seu turno.
tutorial.mesa.cast.title = Conjure uma criatura
tutorial.mesa.cast.body = Arraste o Runeclaw Bear da mão para a mesa, ou clique nele. O mana é pago automaticamente. Se uma carta não pode ser conjurada agora, clicar nela simplesmente não faz nada.
tutorial.mesa.stack.title = A pilha
tutorial.mesa.stack.body = O que você conjura não chega na mesa direto: primeiro vai para a pilha - a lista à direita - e os dois jogadores podem responder ali. Quando ninguém faz nada, o do topo resolve. O grande aviso no meio é um espelho da pilha: se há algo, você vê; quando ela esvazia, ele some. E um clique o afasta.
tutorial.mesa.sick.title = Doença de invocação
tutorial.mesa.sick.body = A criatura que acabou de chegar aparece apagada: neste turno ela não pode atacar nem usar habilidades que peçam para virá-la. A partir do seu próximo turno, pode. Terrenos não têm esse problema.
tutorial.mesa.zones.title = Olhando dentro de uma zona
tutorial.mesa.zones.body = Os contadores da sua barra (mão, grimório, cemitério, exílio, comando) podem ser clicados para abrir o que há dentro; as pilhas grandes na mesa fazem o mesmo. O grimório aparece virado para baixo: é informação oculta e o visualizador não revela isso. Abra qualquer zona.
tutorial.mesa.log.title = O que acabou de acontecer
tutorial.mesa.log.body = No canto inferior esquerdo há um botão de registro: o que cada jogador fez, turno por turno, com o seu em negrito. É onde você olha quando o oponente faz algo e você não teve tempo de ler. Abra-o.
tutorial.mesa.end.title = Primeira lição concluída
tutorial.mesa.end.body = Você já sabe ler a mesa, se mover por ela e jogar seu turno. A seguir: combate - atacar, bloquear e as flechas.

tutorial.combate.intro.title = Duas criaturas prontas
tutorial.combate.intro.body = O Runeclaw Bear e os Llanowar Elves estão na mesa há um turno, então já podem atacar. Do outro lado há um Wind Drake 2/2 que pode bloquear.
tutorial.combate.go.title = Vá para o combate
tutorial.combate.go.body = Os ataques são declarados na etapa deles. Aperte o botão grande (ou espaço) até o trilho chegar em "Atacantes".
tutorial.combate.declare.title = Escolha quem ataca
tutorial.combate.declare.body = Clique nas suas criaturas: as que atacam avançam em direção à linha do meio e ganham uma flecha apontando para o seu oponente. Você também pode arrastar uma criatura sobre o retrato dele. Quando estiver satisfeito, aperte o botão grande para confirmar.
tutorial.combate.arrows.title = As flechas contam tudo
tutorial.combate.arrows.body = Uma flecha vai de cada atacante até o que ele está atacando. Quando o outro lado bloquear, sai outra flecha de cada bloqueador até o atacante que ele está enfrentando.
tutorial.combate.blocks.title = Agora o oponente bloqueia
tutorial.combate.blocks.body = Aperte o botão grande e deixe ele decidir. O que ele bloquear não atinge o jogador: essas criaturas lutam entre si.
tutorial.combate.damage.title = O dano
tutorial.combate.damage.body = Qualquer coisa não bloqueada reduz a vida do inimigo, e você vai ver isso mudar na barra dele. O dano nas criaturas fica marcado até o final do turno; se atingir a resistência delas, elas morrem. O clique com o botão direito mostra quanto uma criatura está carregando.
tutorial.combate.blocking.title = Quando te atacarem
tutorial.combate.blocking.body = Bloquear leva dois cliques e a ORDEM importa: primeiro o atacante que você quer enfrentar, depois sua criatura. Para remover um bloqueador, os mesmos dois cliques de novo.
tutorial.combate.why.title = Se você aperta e nada acontece
tutorial.combate.why.body = Às vezes o motor recusa o que você declarou (uma criatura obrigada a atacar, uma que precisa de dois bloqueadores...). Quando isso acontece, o motivo aparece ABAIXO do botão que você acabou de apertar, citando a carta que está no caminho. Se o botão não reage, olhe ali.
tutorial.combate.end.title = Segunda lição concluída
tutorial.combate.end.body = Atacar, bloquear e ler as flechas. O que falta é o que decide as partidas: habilidades e mágicas instantâneas.

tutorial.trucos.intro.title = Cartas que fazem coisas
tutorial.trucos.intro.body = Você tem um Prodigal Pyromancer na mesa. Além de ser uma criatura, ele tem uma habilidade que você pode ativar: vire-o para causar 1 de dano a qualquer coisa.
tutorial.trucos.activate.title = Ative a habilidade dele
tutorial.trucos.activate.body = Clique no Prodigal Pyromancer. Quando uma carta tem várias coisas para fazer, um menu mostra todas, com as que você não pode pagar marcadas. Escolha a habilidade e depois clique no retrato do inimigo para apontar nele.
tutorial.trucos.targets.title = Escolhendo alvos
tutorial.trucos.targets.body = Quando algo precisa de um alvo, tudo que você pode escolher fica destacado e uma flecha curva é desenhada da origem até o alvo. Os alvos podem estar em qualquer lugar: a mesa, um cemitério ou o exílio. Se estiverem numa zona fechada, o jogo a abre para você clicar dentro.
tutorial.trucos.instant.title = Conjure uma mágica instantânea
tutorial.trucos.instant.body = Há um Lightning Bolt na sua mão. Uma mágica instantânea pode ser conjurada a qualquer momento em que você tenha prioridade: no seu turno, no turno do inimigo, até com algo esperando na pilha. Conjure-a em quem você quiser.
tutorial.trucos.stops.title = Parando no turno do inimigo
tutorial.trucos.stops.body = Para você não precisar apertar OK mil vezes, o jogo passa a prioridade sozinho quando não há nada que você possa fazer. Se quiser esperar por um momento específico, CLIQUE NUMA FASE no trilho: isso define uma parada e o jogo vai te dar a prioridade ali. Clique numa para testar (e clique de novo para remover).
tutorial.trucos.commander.title = A zona de comando
tutorial.trucos.commander.body = À direita da sua mão está a zona de comando, onde vive seu comandante. Você o conjura de lá, e toda vez que o reconjura custa {2} a mais: o imposto aparece ao lado. No Commander você também perde se UM comandante te causar 21 de dano no total, e esse contador está na sua barra.
tutorial.trucos.undo.title = Desfazer
tutorial.trucos.undo.body = Ctrl+Z desfaz a última coisa desde que o motor permita, ou seja, qualquer coisa que passou pela pilha. Jogar um terreno NÃO pode ser desfeito, porque nunca passa por ali. Por isso vale a pena pensar antes de soltar um terreno.
tutorial.trucos.pause.title = Escape e configurações
tutorial.trucos.pause.body = Escape abre o menu de pausa: continuar, configurações, reiniciar e sair. Aperte e entre em CONFIGURAÇÕES: tem bastante coisa ali que muda o jeito de jogar e que ninguém descobre sozinho, porque o jogo funciona igual sem mexer em nada disso. Dê uma olhada e volte para a partida com Escape quando quiser.
tutorial.trucos.settings.title = O que dá para mudar ali
tutorial.trucos.settings.body = Em Configurações você decide: se o mana é pago sozinho, se a prioridade passa sozinha quando você não tem nada a fazer, em que momentos parar no turno do inimigo, o quanto desacelerar a IA - ela resolve o turno dela em milissegundos, e sem desacelerar você perde o que ela faz -, se perguntar antes de deixar sua fase principal, o tamanho da interface, o idioma e o volume. As mesmas configurações estão fora da partida, também com Escape.
tutorial.trucos.end.title = Agora você sabe jogar
tutorial.trucos.end.body = Ler uma carta com o botão direito, aproximar com Ctrl+roda, jogar e atacar clicando ou arrastando, ativar habilidades, responder com mágicas instantâneas e parar onde quiser. Esses são todos os controles. O resto está nas cartas, que trazem o texto delas escrito. Aproveite.

