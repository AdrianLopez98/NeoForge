# El tutorial en Android: los pasos que hablan de gestos (decision 478 de Android)
tutorial.mesa.you.body.android = 自分のプレートは左下、手札の横だよ：名前、ライフ、浮いてるマナ。自分の山（ライブラリー、墓地、追放領域）は自分側のテーブルの左端にあって、それぞれ枚数が出てる。プレートが光ったら自分のターンだよ。
tutorial.mesa.rival.body.android = 相手のプレートは上の真ん中。相手の手札はカードじゃなくて枚数で見えるよ。3人や4人のゲームでは、ほかの相手は上の帯の左側に小さなチップで出る：タップするとそれぞれを見られるよ。
tutorial.mesa.zoom.body.android = テーブルのカードは全部収まるように小さくなってる。読みたいときはカードを【長押し】しよう：大きく開いて、絵からは分からないこと（今のパワー、カウンター、ついているもの）も見られるよ。スワイプで次のカードへ、外側をタップで閉じる。手札ではカードをダブルタップ。テーブルのどれかのカードで試してみて。
tutorial.mesa.board.body.android = テーブルがいっぱいになるとカードは小さくなる。2本指で【ピンチ】するとテーブルを拡大できて、2本指を動かすと移動できるよ。左下の「ズーム解除」ボタンでテーブル全体に戻る。ピンチして拡大してみて。
tutorial.mesa.phases.body.android = 右上にあるのがターンのステップのレール：アンタップ、アップキープ、ドロー、メイン、戦闘、第2メイン、終了。光ってるのが今のステップ。後で、タップすると停止ポイントを置けることが分かるよ。
tutorial.mesa.button.body.android = 右下、手札の上に文章と大きなボタンがある。文章は何をすればいいかを、ボタンは押すと何が起きるかを教えてくれる（「パス」「ターン終了」「ブロックしない」…）。ゲームに作用するボタンがあるのはここだけ：ほかは全部、情報を見せるだけだよ。
tutorial.mesa.land.body.android = 手札に森があるよ。手札からテーブルへ【ドラッグ】しよう：指を乗せて、手札より上まで持ち上げて、テーブルの上で離す。手札のカードをタップしても見せるだけだよ。土地はマナを出してくれて、1ターンに【1枚】しかプレイできない。注意：土地のプレイは取り消せない数少ない行動のひとつだよ。
tutorial.mesa.cast.body.android = Runeclaw Bearを手札からテーブルへドラッグしよう。マナは自動で支払われるよ。今唱えられないカードは、離すと手札に戻るよ。
tutorial.mesa.stack.body.android = 唱えたものはすぐテーブルに出るわけじゃない：まずスタックに乗って、そこで両方のプレイヤーが対応できる。誰も何もしなければ、一番上のものが解決される。スタックに何かある間は、テーブルの右端に小さなタブが出る：タップすると中身が見られるよ。
tutorial.mesa.zones.body.android = 自分の山（ライブラリー、墓地、追放領域）は自分側のテーブルの左端にある：タップすると中身が開くよ。相手のも、相手側で同じ。ライブラリーは裏向きで出る：非公開情報だから、ビューアーでも表にはならないよ。どれかのゾーンを開いてみて。
tutorial.mesa.log.body.android = 右上の≡ボタンでテーブルのメニューが開いて、そこにログがある：誰が何をしたか、ターンごとに分かるよ。相手が何かして、読む暇がなかったときに見る場所だよ。開いてみて。
tutorial.combate.go.body.android = 攻撃は専用のステップで宣言する。上のレールが「攻撃クリーチャー指定」に来るまで、大きなボタンを押してね。
tutorial.combate.declare.body.android = 自分のクリーチャーをタップしよう：攻撃するものは前に出て、相手に向かって矢印が出る。クリーチャーを相手のプレートにドラッグしてもいいよ。準備ができたら大きなボタンで確定；最初は間違えて攻撃しないように、もう一回タップを求められるよ。
tutorial.combate.damage.body.android = ブロックされなかった分は相手のライフを減らして、相手のプレートで変わるのが見えるよ。クリーチャーが受けたダメージはターン終了まで残り、タフネスに達すると死ぬ。カードを長押しすると、どれだけ受けているか分かるよ。
tutorial.combate.blocking.body.android = ブロックするには、まず立ちはだかりたい攻撃クリーチャーをタップして、それから自分のクリーチャーをタップ。または自分のクリーチャーを攻撃クリーチャーの上にドラッグ。【順番】が大事だよ。ブロッカーを外すには、同じことをもう一度。
tutorial.trucos.activate.body.android = Prodigal Pyromancerをタップしよう。カードにできることが複数あると全部のメニューが出て、支払えないものには印がつく。能力を選んでから、相手のプレートをタップして対象にしよう。
tutorial.trucos.targets.body.android = 何かが対象を求めると、選べるものが強調されて、発生源から対象へ矢印が出る。対象はどこにでもありうる：テーブル、墓地、追放領域。閉じたゾーンにあるときは、中をタップできるようにゲームが開いてくれるよ。
tutorial.trucos.aura.body.android = 手札にCurse of the Pierced Heartがあります。クリーチャーではなくプレイヤーにつけるオーラ（「エンチャント（プレイヤー）」）です。場へドラッグし、対象を求められたらカードではなく相手のプレート（上中央）をタップします。以後、相手のターンの開始時ごとに1点のダメージを与えます。相手に唱えてください。
tutorial.trucos.instant.body.android = 手札にLightning Boltがあるよ。インスタントは優先権があればいつでも唱えられる：自分のターンでも、相手のターンでも、スタックで何かが待っているときでも。テーブルへドラッグして、何に撃つか選ぼう。
tutorial.trucos.stops.body.android = OKを何千回も押さなくていいように、何もできないときはゲームが自動で優先権を渡してくれる。特定のタイミングで待ちたいなら、上の【レールをタップ】しよう：自分のターンと相手のターンの各ステップが開くよ。ステップをタップして停止ポイントを置き、「OK」を押す：そこでゲームが優先権をくれる。試してみて（外すときも同じやり方で）。
tutorial.trucos.commander.body.android = 自分側のテーブルの左端、山の横に統率領域があって、そこに統率者がいる。タップすると唱えられて、唱え直すたびに{2}ずつ高くなる：その税は横に出るよ。Commanderでは、【1体の】統率者から合計21点のダメージを受けても負け。そのカウンターは自分のプレートに出るよ。
tutorial.trucos.undo.body.android = 直前の行動を取り消せるときは、大きなボタンの隣の2つ目のボタンに「元に戻す」と出る：スタックを通ったものを取り消せるよ。土地のプレイはそこを通らないから【取り消せない】。だから土地を離す前によく見ておこう。
tutorial.trucos.pause.body.android = 右上の≡ボタンでテーブルのメニューが開く：ログ、設定、退出。開いている間、ゲームは一時停止するよ。タップして【設定】に入ってみよう：遊び方が変わるけど自分では気づかないものがある。触らなくてもゲームは普通に動くからね。中を見て、好きなときにゲームに戻ってね。
tutorial.trucos.settings.body.android = 設定では、マナを自動で支払うか、何もすることがないとき優先権を自動で渡すか、相手のターンのどこで止まるか、AIをどれだけ遅くするか（AIはミリ秒でターンを終えるから、遅くしないと何をしたか見逃す）、メインフェイズを離れる前に確認するか、カードの大きさ、言語、音量を決められるよ。同じ設定はメインメニューにもあるよ。
tutorial.trucos.end.body.android = 長押しでカードを読む、ピンチでテーブルを拡大、手札からドラッグしてプレイ、タップかドラッグで攻撃、能力の起動、インスタントで対応、好きなところで止まる。これで操作は全部。あとはカードが教えてくれる。テキストが書いてあるからね。楽しんでね。
tutorial.mesa.zoom.title.android = カードを読む：長押し
tutorial.mesa.board.title.android = 盤面を拡大：ピンチ
tutorial.trucos.pause.title.android = ≡メニューと設定

