menu.tutorial = チュートリアル
menu.tutorial.desc = 実際にプレイしながら覚える操作方法：カードを読む、唱える、攻撃する、能力を起動する
menu.tutorial.note = ゲーム内の操作を知るのに必要
menu.tutorial.done = 3つのレッスン全部完了 - 繰り返しプレイできるよ

tutorial.title = チュートリアル
tutorial.welcome = ようこそ。本番の前に、ゲームの操作を覚える短いレッスンが3つあるよ。Magicを知らなくても大丈夫：ここではテーブルの操作だけを教えるよ。
