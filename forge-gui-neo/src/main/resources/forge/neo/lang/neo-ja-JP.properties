tutorial.title = チュートリアル
tutorial.welcome = ようこそ。本番の前に、ゲームの操作を覚える短いレッスンが3つあるよ。Magicを知らなくても大丈夫：ここではテーブルの操作だけを教えるよ。
tutorial.progress = {1}個中{0}個完了
tutorial.play = プレイ：{0}
tutorial.reset = 最初からやり直す
tutorial.lessonDone = 完了 - 繰り返しプレイできる
tutorial.lessonSteps = {0}ステップ
tutorial.counter = チュートリアル - {0} - {2}ステップ中{1}ステップ目
tutorial.next = 次へ
tutorial.skip = このステップを飛ばす
tutorial.quit = チュートリアルを抜ける
tutorial.waiting = 上に書いてあることをやれば、ステップは自動で進むよ。
tutorial.done = 完了。

tutorial.mesa.title = テーブルと自分のターン
tutorial.mesa.summary = 誰が誰か、カードの読み方、テーブルの拡大方法、そしてターン丸ごと：土地・呪文・スタック。
tutorial.combate.title = 戦闘
tutorial.combate.summary = 攻撃、ブロック、矢印の読み方。そしてゲームが先に進めてくれない時にどうするか。
tutorial.trucos.title = 能力・インスタント・統率者
tutorial.trucos.summary = 能力の起動、対象の選択、相手のターンで止まる方法、統率者領域。

tutorial.mesa.welcome.title = これは練習用のゲームだよ
tutorial.mesa.welcome.body = 練習用に用意されたテーブルにいるよ：ここで起きることは何も保存されない。読みながら書いてある通りにやってみよう。行動を求めるステップは、やった瞬間に自動で先に進むよ。上にある「チュートリアルを抜ける」でいつでもやめられるよ。
tutorial.mesa.you.title = 下にいるのが自分
tutorial.mesa.you.body = 自分のバー：名前、ライフ、浮いてるマナ、各ゾーンのカウンター（手札、ライブラリー、墓地、追放領域、統率者領域）。光ってる時が自分のターンだよ。
tutorial.mesa.rival.title = 上にいるのが相手
tutorial.mesa.rival.body = 反対側にも同じバーがあるよ。相手の手札はカードじゃなく枚数で表示される。3人か4人のゲームでは、上にタブが出て各相手を見られるよ。
tutorial.mesa.zoom.title = カードを読む：右クリック
tutorial.mesa.zoom.body = テーブルの上のカードは全部収まるようにわざと小さくしてある。読むには右クリックしよう：大きく表示されて、画像だけでは分からないこと（今のパワー、カウンター、装備してるもの）も見える。左クリックでどこでも閉じられるよ。どれかのカードで試してみて。
tutorial.mesa.board.title = テーブルを拡大：Ctrl+ホイール
tutorial.mesa.board.body = テーブルがいっぱいだとカードが小さくなる。Ctrl+マウスホイールで、ポインターの下を動かさずに拡大・縮小できるよ。拡大中はマウスの中央ボタン（またはCtrl+ドラッグ）でテーブルを動かせて、隅のバッジでテーブル全体表示に戻せるよ。Ctrlを押しながらホイールを回してみよう。
tutorial.mesa.phases.title = ターンはフェイズで進む
tutorial.mesa.phases.body = 右のレールはターンの各ステップだよ、上から順に：アンタップ、アップキープ、ドロー、第1メイン、戦闘、第2メイン、終了。光ってるのが今の段階。後でこれらもクリックできることが分かるよ。
tutorial.mesa.button.title = ゲームが求めてること
tutorial.mesa.button.body = レールの下にテキストと大きなボタンがあるよ。テキストは何が求められてるかを、ボタンは押した時に何が起きるかを表す（「パス」「ターン終了」「ブロックなし」...）。スペースキーでも押せるよ。ここが画面の中でゲームに影響するボタンがある唯一の場所で、他は全部ただの情報だよ。
tutorial.mesa.land.title = 土地をプレイしよう
tutorial.mesa.land.body = 手札に森があるよ。手札からテーブルにドラッグするか、クリックしてみよう。土地はマナの出所で、1ターンに1枚しかプレイできないよ。注意：土地のプレイは、数少ない取り消せない行動の1つだよ。
tutorial.mesa.mana.title = もうマナがあるね
tutorial.mesa.mana.body = 後ろの列にあるよ。呪文を唱えるときに土地がタップされて、これはゲームが自動でやってくれる（設定で変更できるよ）。自分のターンの始めにまたアンタップするよ。
tutorial.mesa.cast.title = クリーチャーを唱えよう
tutorial.mesa.cast.body = 手札のRuneclaw Bearをテーブルにドラッグするか、クリックしてみよう。マナは自動で支払われるよ。今唱えられないカードは、クリックしても何も起きないだけだよ。
tutorial.mesa.stack.title = スタック
tutorial.mesa.stack.body = 唱えたものはすぐテーブルに出るわけじゃない：まずスタック、つまり右にあるリストに乗って、両方のプレイヤーがそこで応答できるよ。誰も何もしなければ、一番上のものが解決される。真ん中の大きなバナーはスタックの鏡：何かあれば見える、空になれば消える。クリックで脇に寄せられるよ。
tutorial.mesa.sick.title = 召喚酔い
tutorial.mesa.sick.body = 今出たばかりのクリーチャーは薄く表示されてる：このターンは攻撃も、タップが必要な能力も使えないよ。次の自分のターンからは使えるようになる。土地にはその制限はないよ。
tutorial.mesa.zones.title = ゾーンの中を見る
tutorial.mesa.zones.body = 自分のバーのカウンター（手札、ライブラリー、墓地、追放領域、統率者領域）をクリックすると中身が開けるよ。テーブルの上の大きな山も同じだよ。ライブラリーは裏向きで表示される：これは隠された情報で、ビューアーでも見えるようにはならないよ。どれかのゾーンを開いてみよう。
tutorial.mesa.log.title = 何が起きたか
tutorial.mesa.log.body = 左下に記録のボタンがあるよ：各プレイヤーがやったことをターンごとに、自分のは太字で表示。相手が何かして読む暇がなかった時に見る場所だよ。開いてみよう。
tutorial.mesa.end.title = 最初のレッスン完了
tutorial.mesa.end.body = これでテーブルを読んで、動き回って、自分のターンをプレイできるようになったね。次は戦闘 - 攻撃、ブロック、矢印だよ。

tutorial.combate.intro.title = 準備できたクリーチャーが2体
tutorial.combate.intro.body = Runeclaw BearとLlanowar Elvesは1ターン経ってるから攻撃できるよ。テーブルの向こうには2/2のWind Drakeがいて、ブロックできる。
tutorial.combate.go.title = 戦闘に進もう
tutorial.combate.go.body = 攻撃は専用のステップで宣言するよ。大きなボタン（またはスペースキー）を押して、レールが「攻撃宣言」に着くまで進めよう。
tutorial.combate.declare.title = 誰が攻撃するか選ぼう
tutorial.combate.declare.body = 自分のクリーチャーをクリックしよう：攻撃するクリーチャーは中央のラインに前進して、相手を指す矢印が出るよ。クリーチャーを相手の肖像にドラッグしてもいいよ。決まったら大きなボタンを押して確定しよう。
tutorial.combate.arrows.title = 矢印が全部を物語る
tutorial.combate.arrows.body = 各アタッカーから攻撃対象へ矢印が伸びるよ。相手がブロックすると、各ブロッカーから、その前に立ったアタッカーへも矢印が出るよ。
tutorial.combate.blocks.title = 今度は相手がブロックするよ
tutorial.combate.blocks.body = 大きなボタンを押して、相手に決めさせよう。ブロックされたものはプレイヤーにダメージを与えない：代わりにクリーチャー同士が戦うよ。
tutorial.combate.damage.title = ダメージ
tutorial.combate.damage.body = ブロックされなかったものは相手のライフを減らして、バーで変化が見えるよ。クリーチャーが受けたダメージはターン終了までマークされたまま残る：タフネスに達すると死ぬよ。右クリックでどれだけ受けてるか見られるよ。
tutorial.combate.blocking.title = 自分が攻撃されたら
tutorial.combate.blocking.body = ブロックは2回のクリックで、順番が大事：まず前に立ちたいアタッカー、それから自分のクリーチャー。ブロッカーを外すのも同じ2回のクリックだよ。
tutorial.combate.why.title = 押しても何も起きない時は
tutorial.combate.why.body = ゲームが宣言を受け付けないことがあるよ（攻撃を強制されてるクリーチャー、2体のブロッカーが必要なクリーチャーなど）。そうなったら、今押したボタンの下に理由が出て、原因のカードの名前も分かるよ。ボタンが反応しない時はそこを見てね。
tutorial.combate.end.title = 2つ目のレッスン完了
tutorial.combate.end.body = 攻撃、ブロック、矢印の読み方が分かったね。残るはゲームを左右するもの：能力とインスタントだよ。

tutorial.trucos.intro.title = 何かをするカード
tutorial.trucos.intro.body = テーブルにProdigal Pyromancerがあるよ。クリーチャーであると同時に、起動できる能力もある：タップして、好きな対象に1点のダメージを与えられるよ。
tutorial.trucos.activate.title = 能力を起動しよう
tutorial.trucos.activate.body = Prodigal Pyromancerをクリックしよう。カードにできることが複数ある時は、全部を表示するメニューが出て、支払えないものには印が付くよ。能力を選んで、相手の肖像をクリックして狙いを定めよう。
tutorial.trucos.targets.title = 対象を選ぶ
tutorial.trucos.targets.body = 対象が必要な時は、選べるものが強調表示されて、発生源から対象へ曲がった矢印が引かれるよ。対象はどこにでもありうる：テーブル、墓地、追放領域。閉じたゾーンにある場合は、ゲームがそのゾーンを開いてくれるからクリックできるよ。
tutorial.trucos.instant.title = インスタントを唱えよう
tutorial.trucos.instant.body = 手札にLightning Boltがあるよ。インスタントは優先権を持っている間ならいつでも唱えられる：自分のターン、相手のターン、スタックに何か乗ってる時でも。好きな対象に唱えてみよう。
tutorial.trucos.aura.title = プレイヤーにつけるオーラ
tutorial.trucos.aura.body = 手札にCurse of the Pierced Heartがあります。クリーチャーではなくプレイヤーにつけるオーラ（「エンチャント（プレイヤー）」）です。他の呪文と同じように唱え、対象を求められたらカードではなく相手の肖像（上のバー）をクリックします。以後、相手のターンの開始時ごとに1点のダメージを与えます。相手に唱えてください。
tutorial.trucos.stops.title = 相手のターンで止まる
tutorial.trucos.stops.body = OKを何度も押さなくて済むように、できることが何もない時はゲームが自動で優先権をパスしてくれる。特定の瞬間を待ちたいなら、レールのフェイズをクリックしよう：それでそこに停止ポイントが設定されて、その段階で優先権が渡されるよ。試しに1つクリックしてみて（もう一度クリックすれば解除できるよ）。 フェイズの上にある「自分」と「対戦相手」のタブで、どちらのターンの停止かを選べます。
tutorial.trucos.commander.title = 統率者領域
tutorial.trucos.commander.body = 手札の右側が統率者領域で、統率者はそこにいるよ。そこから唱えられて、唱え直すたびに{2}コストが増える：その税は横に表示されるよ。統率者戦では、1体の統率者から合計21点のダメージを受けても負けになる。そのカウンターは自分のバーにあるよ。
tutorial.trucos.undo.title = 元に戻す
tutorial.trucos.undo.body = Ctrl+Zは、ゲームが許す限り直前の行動を取り消せる：つまりスタックを通ったものだよ。土地のプレイはスタックを通らないから取り消せないよ。だから土地を置く前によく見ておく価値があるんだ。
tutorial.trucos.pause.title = Escapeと設定
tutorial.trucos.pause.body = Escapeで一時停止メニューが開くよ：再開、設定、再開始、終了。押して「設定」に入ってみて。遊び方そのものが変わる項目がけっこうあるんだけど、触らなくてもゲームは普通に動くから、自分ではなかなか気づけないんだ。中を見たら、Escapeでいつでも対戦に戻れるよ。
tutorial.trucos.settings.title = 設定で変えられること
tutorial.trucos.settings.body = 設定では、マナを自動で支払うか、やることがないときに優先権を自動で渡すか、相手のターンのどこで止まるか、AIをどれだけ遅くするか（AIは自分のターンをミリ秒で処理するから、遅くしないと何をしたのか見えないよ）、メイン・フェイズを離れる前に確認するか、それにインターフェースの大きさ、言語、音量を決められるよ。同じ設定は対戦外でもEscapeで開けるよ。 設定はタブに分かれています。ほとんどは「ゲーム」に、サイズは「表示」、言語は「一般」、音量は「サウンド」にあります。
tutorial.trucos.end.title = もう遊び方は分かったね
tutorial.trucos.end.body = 右クリックでカードを読む、Ctrl+ホイールで拡大、クリックやドラッグでプレイと攻撃、能力の起動、インスタントでの応答、好きな場所で止まること。操作はこれで全部だよ。あとはカードに書いてあるテキストが教えてくれる。楽しんでね。

