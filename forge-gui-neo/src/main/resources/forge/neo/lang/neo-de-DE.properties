tutorial.title = Tutorial
tutorial.welcome = Willkommen. Bevor du richtig spielst, drei kurze Lektionen zur Bedienung einer Partie. Du musst Magic dafür nicht können: Hier lernst du nur, den Tisch zu bedienen.
tutorial.progress = {0} von {1} Lektionen erledigt
tutorial.play = Spielen: {0}
tutorial.reset = Von vorn anfangen
tutorial.lessonDone = erledigt - du kannst sie wiederholen
tutorial.lessonSteps = {0} Schritte
tutorial.counter = TUTORIAL  -  {0}  -  Schritt {1} von {2}
tutorial.next = Weiter
tutorial.skip = Diesen Schritt überspringen
tutorial.quit = Tutorial verlassen
tutorial.waiting = Tu, was hier oben steht, und der Schritt geht von selbst weiter.
tutorial.done = Erledigt.

tutorial.mesa.title = Der Tisch und dein Zug
tutorial.mesa.summary = Wer wer ist, wie man eine Karte liest, wie man den Tisch heranzoomt, und ein ganzer Zug: Land, Zauberspruch und Stapel.
tutorial.combate.title = Der Kampf
tutorial.combate.summary = Angreifen, blocken und die Pfeile lesen. Und was zu tun ist, wenn die Engine dich nicht fertig machen lässt.
tutorial.trucos.title = Fähigkeiten, Spontanzauber und Commander
tutorial.trucos.summary = Eine Fähigkeit aktivieren, ein Ziel wählen, im Zug des Gegners anhalten und die Kommandozone.

tutorial.mesa.welcome.title = Das hier ist eine Übungspartie
tutorial.mesa.welcome.body = Du bist an einem Tisch, der zum Üben vorbereitet ist: Was auch passiert, es wird nichts gespeichert. Lies mit und tu, worum jeder Schritt bittet; ein Handlungsschritt geht von selbst weiter, sobald du ihn erledigst. Du kannst jederzeit mit "Tutorial verlassen" hier oben gehen.
tutorial.mesa.you.title = Der unten bist du
tutorial.mesa.you.body = Deine Leiste: Name, Leben, alles Mana, das gerade frei ist, und der Zähler jeder Zone (Hand, Bibliothek, Friedhof, Exil, Kommandozone). Wenn sie aufleuchtet, bist du am Zug.
tutorial.mesa.rival.title = Dein Gegner, oben
tutorial.mesa.rival.body = Die gleiche Leiste auf der anderen Seite. Seine Hand zeigt eine Zahl, keine Karten. Bei einer Partie zu dritt oder viert erscheinen oben Reiter, um jeden Gegner anzusehen.
tutorial.mesa.zoom.title = Eine Karte lesen: RECHTSKLICK
tutorial.mesa.zoom.body = Die Karten auf dem Tisch sind absichtlich klein, damit alle Platz haben. Um eine zu lesen, klick sie mit rechts an: Sie erscheint groß, zusammen mit dem, was das Bild nicht verrät (ihre aktuelle Stärke, Marken, was an ihr befestigt ist). Ein Linksklick irgendwo schließt sie. Probier es an einer beliebigen Karte.
tutorial.mesa.board.title = Den Tisch heranzoomen: Strg + Mausrad
tutorial.mesa.board.body = Bei einem vollen Tisch schrumpfen die Karten. Strg + Mausrad zoomt hinein und hinaus, wobei die Stelle unter dem Mauszeiger stehen bleibt. Herangezoomt bewegt die mittlere Maustaste (oder Strg + Ziehen) den Tisch, und die Marke in der Ecke bringt dich zum ganzen Tisch zurück. Dreh das Rad einmal bei gedrückter Strg-Taste.
tutorial.mesa.phases.title = Ein Zug läuft in Phasen ab
tutorial.mesa.phases.body = Die Leiste rechts sind die Schritte des Zuges, von oben nach unten: Enttappen, Versorgung, Ziehen, erste Hauptphase, Kampf, zweite Hauptphase und Ende. Die leuchtende ist die aktuelle. Später siehst du, dass man sie auch anklicken kann.
tutorial.mesa.button.title = Was das Spiel von dir will
tutorial.mesa.button.body = Unter der Leiste stehen ein Text und ein großer Knopf. Der Text sagt, was von dir erwartet wird; der Knopf sagt, was passiert, wenn du ihn drückst ("Passen", "Zug beenden", "Nicht blocken"...). Die Leertaste drückt ihn. Es ist der einzige Ort auf dem Bildschirm mit Knöpfen, die die Partie beeinflussen: alles andere informiert nur.
tutorial.mesa.land.title = Spiel ein Land
tutorial.mesa.land.body = In deiner Hand ist ein Wald. Zieh ihn von der Hand auf den Tisch, oder klick ihn einfach an. Länder sind die Manaquelle, und du darfst nur EINES pro Zug spielen. Vorsicht: Ein Land zu spielen lässt sich fast nie rückgängig machen.
tutorial.mesa.mana.title = Jetzt hast du Mana
tutorial.mesa.mana.body = Da ist es, in deiner hinteren Reihe. Um einen Zauberspruch zu bezahlen, werden Länder getappt, und das macht das Spiel für dich beim Wirken (du kannst es in den Einstellungen ändern). Sie enttappen wieder zu Beginn deines Zuges.
tutorial.mesa.cast.title = Wirke eine Kreatur
tutorial.mesa.cast.body = Zieh den Runeclaw Bear von der Hand auf den Tisch, oder klick ihn an. Das Mana wird automatisch bezahlt. Kann eine Karte gerade nicht gewirkt werden, passiert beim Anklicken einfach nichts.
tutorial.mesa.stack.title = Der Stapel
tutorial.mesa.stack.body = Was du wirkst, landet nicht sofort auf dem Tisch: Es geht erst auf den Stapel - die Liste rechts -, und dort können beide Spieler reagieren. Wenn niemand etwas tut, löst sich das oberste auf. Das große Banner in der Mitte ist ein Spiegel des Stapels: Ist etwas da, siehst du es; leert er sich, verschwindet es. Und ein Klick schiebt es beiseite.
tutorial.mesa.sick.title = Beschworenenkrankheit
tutorial.mesa.sick.body = Die Kreatur, die gerade angekommen ist, wirkt abgedunkelt: Diesen Zug kann sie nicht angreifen oder Fähigkeiten nutzen, die sie tappen müssen. Ab deinem nächsten Zug kann sie das. Länder haben dieses Problem nicht.
tutorial.mesa.zones.title = In eine Zone hineinschauen
tutorial.mesa.zones.body = Die Zähler auf deiner Leiste (Hand, Bibliothek, Friedhof, Exil, Kommandozone) lassen sich anklicken, um zu öffnen, was drin ist; die großen Stapel auf dem Tisch machen dasselbe. Die Bibliothek erscheint verdeckt: Das ist verborgene Information, und der Betrachter deckt sie nicht auf. Öffne eine beliebige Zone.
tutorial.mesa.log.title = Was gerade passiert ist
tutorial.mesa.log.body = Unten links gibt es einen Verlauf-Knopf: was jeder gemacht hat, Zug für Zug, deins fett gedruckt. Da schaust du nach, wenn der Gegner etwas macht und du keine Zeit hattest, es zu lesen. Öffne ihn.
tutorial.mesa.end.title = Erste Lektion erledigt
tutorial.mesa.end.body = Du kannst jetzt den Tisch lesen, dich darauf bewegen und deinen Zug spielen. Als Nächstes: der Kampf - angreifen, blocken und die Pfeile.

tutorial.combate.intro.title = Zwei Kreaturen bereit
tutorial.combate.intro.body = Der Runeclaw Bear und die Llanowar Elves sind schon einen Zug auf dem Tisch, also können sie angreifen. Gegenüber steht ein Wind Drake 2/2, der blocken kann.
tutorial.combate.go.title = Geh zum Kampf
tutorial.combate.go.body = Angriffe werden in ihrem eigenen Schritt deklariert. Drück den großen Knopf (oder die Leertaste), bis die Leiste bei "Angreifer" ankommt.
tutorial.combate.declare.title = Wähle, wer angreift
tutorial.combate.declare.body = Klick deine Kreaturen an: Die Angreifer rücken zur Mittellinie vor und bekommen einen Pfeil, der auf deinen Gegner zeigt. Du kannst eine Kreatur auch auf sein Porträt ziehen. Wenn du fertig bist, drück den großen Knopf zum Bestätigen.
tutorial.combate.arrows.title = Die Pfeile erzählen alles
tutorial.combate.arrows.body = Ein Pfeil geht von jedem Angreifer zu dem, was er angreift. Wenn die Gegenseite blockt, geht ein weiterer Pfeil von jedem Blocker zum Angreifer, vor dem er steht.
tutorial.combate.blocks.title = Jetzt blockt der Gegner
tutorial.combate.blocks.body = Drück den großen Knopf und lass ihn entscheiden. Was er blockt, trifft nicht den Spieler: Diese Kreaturen kämpfen stattdessen gegeneinander.
tutorial.combate.damage.title = Der Schaden
tutorial.combate.damage.body = Alles Ungeblockte senkt die Lebenspunkte des Gegners, und du siehst es sich auf seiner Leiste ändern. Schaden an Kreaturen bleibt bis zum Ende des Zuges markiert; erreicht er ihre Widerstandskraft, sterben sie. Rechtsklick zeigt, wie viel eine Kreatur trägt.
tutorial.combate.blocking.title = Wenn sie dich angreifen
tutorial.combate.blocking.body = Blocken braucht zwei Klicks, und die REIHENFOLGE zählt: zuerst der Angreifer, vor den du dich stellen willst, dann deine Kreatur. Um einen Blocker zu entfernen, dieselben zwei Klicks noch einmal.
tutorial.combate.why.title = Wenn du drückst und nichts passiert
tutorial.combate.why.body = Manchmal lehnt die Engine ab, was du deklariert hast (eine Kreatur, die angreifen muss, eine, die zwei Blocker braucht...). Dann erscheint der Grund UNTER dem Knopf, den du gerade gedrückt hast, mit dem Namen der Karte, die im Weg steht. Reagiert der Knopf nicht, schau dort nach.
tutorial.combate.end.title = Zweite Lektion erledigt
tutorial.combate.end.body = Angreifen, blocken und die Pfeile lesen. Was noch fehlt, entscheidet über Partien: Fähigkeiten und Spontanzauber.

tutorial.trucos.intro.title = Karten, die etwas tun
tutorial.trucos.intro.body = Auf dem Tisch hast du einen Prodigal Pyromancer. Er ist nicht nur eine Kreatur, sondern hat auch eine Fähigkeit, die du aktivieren kannst: ihn tappen, um irgendetwas 1 Schaden zuzufügen.
tutorial.trucos.activate.title = Aktiviere seine Fähigkeit
tutorial.trucos.activate.body = Klick den Prodigal Pyromancer an. Hat eine Karte mehrere Dinge, die sie tun kann, zeigt ein Menü sie alle, mit denen markiert, die du dir nicht leisten kannst. Wähl die Fähigkeit, dann klick das Porträt des Gegners an, um sie auf ihn zu richten.
tutorial.trucos.targets.title = Ziele wählen
tutorial.trucos.targets.body = Wenn etwas ein Ziel braucht, wird alles, was du wählen kannst, hervorgehoben, und ein gebogener Pfeil zeigt von der Quelle zum Ziel. Ziele können überall sein: auf dem Tisch, in einem Friedhof oder im Exil. Sind sie in einer geschlossenen Zone, öffnet das Spiel sie, damit du hineinklicken kannst.
tutorial.trucos.instant.title = Wirke einen Spontanzauber
tutorial.trucos.instant.body = In deiner Hand ist ein Lightning Bolt. Ein Spontanzauber kann jederzeit gewirkt werden, wenn du Priorität hast: in deinem Zug, im Zug des Gegners, sogar mit etwas, das auf dem Stapel wartet. Wirke ihn auf was du willst.
tutorial.trucos.stops.title = Im Zug des Gegners anhalten
tutorial.trucos.stops.body = Damit du nicht tausendmal OK drücken musst, gibt dir das Spiel die Priorität automatisch weiter, wenn du nichts tun könntest. Willst du auf einen bestimmten Moment warten, KLICK EINE PHASE auf der Leiste an: Damit ist ein Halt gesetzt, und das Spiel gibt dir dort die Priorität. Klick eine an, um es zu probieren (und klick sie noch mal an, um ihn zu entfernen).
tutorial.trucos.commander.title = Die Kommandozone
tutorial.trucos.commander.body = Rechts von deiner Hand ist die Kommandozone, wo dein Commander lebt. Du wirkst ihn von dort, und jedes Mal, wenn du ihn erneut wirkst, kostet er {2} mehr: Die Steuer steht daneben. In Commander verlierst du auch, wenn EIN Commander dir insgesamt 21 Schaden zufügt, und dieser Zähler steht auf deiner Leiste.
tutorial.trucos.undo.title = Rückgängig machen
tutorial.trucos.undo.body = Strg+Z macht das Letzte rückgängig, solange die Engine es erlaubt, also alles, was über den Stapel gegangen ist. Ein Land zu spielen lässt sich NICHT rückgängig machen, weil es nie dort landet. Deshalb lohnt es sich, vor dem Ablegen eines Landes nachzudenken.
tutorial.trucos.pause.title = Escape und Einstellungen
tutorial.trucos.pause.body = Escape öffnet das Pausemenü: fortsetzen, Einstellungen, neu starten und verlassen. Drück es und geh in die EINSTELLUNGEN: dort steckt einiges, was das Spielgefühl verändert und was von allein niemand findet, weil das Spiel auch ohne das alles funktioniert. Schau es dir an und komm mit Escape zurück ins Spiel, wann du willst.
tutorial.trucos.settings.title = Was du dort ändern kannst
tutorial.trucos.settings.body = In den Einstellungen entscheidest du: ob Mana automatisch bezahlt wird, ob die Priorität für dich weitergegeben wird, wenn du nichts tun kannst, wann im Zug des Gegners angehalten wird, wie sehr die KI gebremst wird - sie löst ihren Zug in Millisekunden auf, und ohne Bremse verpasst du, was sie tut -, ob vor dem Verlassen deiner Hauptphase gefragt wird, Größe der Oberfläche, Sprache und Lautstärke. Dieselben Einstellungen gibt es außerhalb einer Partie, ebenfalls mit Escape.
tutorial.trucos.end.title = Jetzt weißt du, wie man spielt
tutorial.trucos.end.body = Eine Karte mit Rechtsklick lesen, mit Strg+Rad heranzoomen, spielen und angreifen durch Klicken oder Ziehen, Fähigkeiten aktivieren, mit Spontanzaubern reagieren und anhalten, wo du willst. Das sind alle Bedienelemente. Der Rest steht auf den Karten, die ihren Text mitbringen. Viel Spaß.

