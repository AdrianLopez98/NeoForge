# Die Texte UNSERER Oberfläche, auf Deutsch.
#
# Was der MOTOR sagt (Prompts, Phasen, Dialoge aus forge-gui) ist bereits von
# Forge übersetzt und steht nicht hier. Diese Datei ist nur unser eigenes Drumherum.
#
# Regeln dieser Datei:
#   - UTF-8, ohne BOM.
#   - Die Platzhalter sind {0}, {1}... Es wird kein MessageFormat verwendet,
#     einfache Anführungszeichen werden also ganz normal geschrieben.
#   - Fehlt ein Schlüssel, greift die Oberfläche auf Englisch zurück
#     (neo-en-US.properties); fehlt er auch dort, erscheint der Schlüssel selbst.

