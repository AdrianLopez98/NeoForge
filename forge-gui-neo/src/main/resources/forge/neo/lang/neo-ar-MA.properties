ascent.event.smith.text = يشكّل معدن أشياء لم يعد الناس بحاجة إليها. يبيع القليل وبثمن غالٍ، ويعرف قيمة ما يبيع.
ascent.event.nest.title = العُشّ
ascent.event.nest.text = بيض بحجم رأسك، وشيء ضخم يحوم في الأعلى. لم يقل أحد إن هذا سيكون بالمجان.
ascent.event.crossroads.title = مفترق الطرق
ascent.event.crossroads.text = مكان هادئ للتوقف، وكومة خردة تركها أحدهم على جانب الطريق. لا وقت لكليهما.
ascent.event.mirage.title = السراب
ascent.event.mirage.text = يعبر الطريق شيئًا يكون هناك ثم لا يكون. إما أن تسير الأمور على ما يرام وإما لا، ولا سبيل لمعرفة ذلك مسبقًا.
ascent.event.pact.title = الميثاق
ascent.event.pact.text = يعرض عليك شيئًا جيدًا حقًا. الثمن ليس مالًا ولا دمًا: بل مقدار ما يمكنك تحمّله من الآن فصاعدًا.
ascent.event.lender.title = المُرابي
ascent.event.lender.text = يُقرضك ما تطلب ويستوفي دينه في الحال. لكن ليس بالمال أبدًا.
ascent.event.statue.title = التمثال
ascent.event.statue.text = أقامه أحدهم هنا منذ زمن بعيد. لا تزال فيه ترصيعاته، ولا يزال يُصغي.
ascent.event.wanderer.title = المتجوّل
ascent.event.wanderer.text = أيام بلا طعام، وأسابيع على الطريق. لا يطلب شيئًا، لكنه لا يكفّ عن النظر إلى حقيبتك.
ascent.event.well.title = بئر الأمنيات
ascent.event.well.text = إنها مليئة بقطع نقدية ألقاها من مرّوا قبلك. بين حين وآخر، أخرج أحدهم منها أكثر مما ألقى.
