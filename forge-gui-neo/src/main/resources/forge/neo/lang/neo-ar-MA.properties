ascent.event.gambler.title = المقامر
ascent.event.gambler.text = نصب طاولته في منتصف الطريق ويخلط دون أن ينظر إلى البطاقات. يقول إن صاحب الطاولة يخسر دائمًا. ويبتسم وهو يقولها.
ascent.event.chest.title = الصندوق المفخّخ
ascent.event.chest.text = مقفل بآلية لن تفكّ سرها في الوقت المناسب. شيء ما يخشخش في الداخل، والمعدن يحمل آثار آخرين حاولوا قبلك.
ascent.event.collector.title = جامع البطاقات
ascent.event.collector.text = لا يريد مالك ولا دمك: يريد بطاقة، أي بطاقة، ويدفع ثمنها جيدًا. ويصرّ على أن تختار أنت.
ascent.event.campfire.title = نار المخيم المنسية
ascent.event.campfire.text = تركها أحدهم مشتعلة ومضى. تكفي لتتدفأ قليلًا، أو لتحرق شيئًا لم تعد بحاجة إليه.
ascent.event.echo.title = صدى العالم
ascent.event.echo.text = يكرر الهواء أفكارك متأخرًا نصف ثانية. دعه، وسيعلّمك شيئًا — لكنه يتقاضى ثمن الدرس.
ascent.event.fountain.title = النافورة
ascent.event.fountain.text = ماء ساكن، بلا قاع يُرى. صاحبها يتقاضى ثمن الشربة ولا يشرح شيئًا.
