tutorial.skip = تخطَّ هذه الخطوة
tutorial.quit = الخروج من الدرس التعليمي
tutorial.waiting = نفّذ ما هو مكتوب هنا في الأعلى وستنتقل الخطوة وحدها.
tutorial.done = تم.

tutorial.mesa.title = الطاولة ودورك
tutorial.mesa.summary = من هو من، وكيف تقرأ بطاقة، وكيف تقرّب الطاولة، ودور كامل: أرض وتعويذة ومكدّس.
tutorial.combate.title = القتال
tutorial.combate.summary = الهجوم والصدّ وقراءة الأسهم. وما تفعله حين لا يسمح لك المحرك بالإنهاء.
tutorial.trucos.title = القدرات والفوريات والقائد
tutorial.trucos.summary = تفعيل قدرة، واختيار الأهداف، والتوقف خلال دور الخصم، ومنطقة القيادة.

tutorial.mesa.welcome.title = هذه مباراة تدريبية
tutorial.mesa.welcome.body = أنت على طاولة مُعدّة للتدريب: لا يُحفظ شيء مما يحدث هنا. اقرأ ونفّذ ما تطلبه كل خطوة؛ خطوة الفعل تنتقل وحدها بمجرد أن تنفّذه. يمكنك المغادرة متى شئت بزر «الخروج من الدرس التعليمي» هنا في الأعلى.
tutorial.mesa.you.title = أنت في الأسفل
tutorial.mesa.you.body = شريطك: الاسم، ونقاط الحياة، وأي مانا عائمة، وعدّاد لكل منطقة (اليد، المكتبة، المقبرة، المنفى، القيادة). حين يضيء، يكون الدور دورك.
tutorial.mesa.rival.title = خصمك في الأعلى
tutorial.mesa.rival.body = الشريط نفسه في الجهة الأخرى. تظهر يده رقمًا لا بطاقات. في مباراة من ثلاثة أو أربعة لاعبين، تظهر تبويبات في الأعلى لرؤية كل خصم.
tutorial.mesa.zoom.title = قراءة بطاقة: النقر الأيمن
tutorial.mesa.zoom.body = البطاقات على الطاولة صغيرة عن قصد، كي تتسع كلها. لقراءة إحداها انقر عليها بالزر الأيمن: تظهر كبيرة، مع ما لا تخبرك به الصورة (قوتها الآن، وعداداتها، وما هو مُلحق بها). نقرة يسرى في أي مكان تغلقها. جرّب ذلك على أي بطاقة.
tutorial.mesa.board.title = تقريب الطاولة: Ctrl + العجلة
tutorial.mesa.board.body = حين تمتلئ الطاولة تصغر البطاقات. Ctrl + عجلة الفأرة يقرّب ويبعّد، مع إبقاء ما تحت المؤشر ثابتًا. عند التقريب، يحرّك زر الفأرة الأوسط (أو Ctrl + السحب) الطاولة، والشارة في الزاوية تعيدك إلى الطاولة كاملة. أدِر العجلة قليلًا مع الضغط على Ctrl.
tutorial.mesa.phases.title = الدور يمرّ بمراحل
tutorial.mesa.phases.body = الشريط على اليمين هو خطوات الدور، من الأعلى إلى الأسفل: التقويم، الصيانة، السحب، الرئيسية الأولى، القتال، الرئيسية الثانية والنهاية. المضيئة هي حيث أنت الآن. سترى لاحقًا أنه يمكن النقر عليها أيضًا.
tutorial.mesa.button.title = ما تطلبه منك المباراة
tutorial.mesa.button.body = تحت الشريط سطر نصي وزر كبير. يقول النص ما هو متوقَّع منك؛ ويقول الزر ما سيحدث إن ضغطته («تمرير»، «إنهاء الدور»، «لا صدّ»...). مفتاح Space يضغطه. إنه المكان الوحيد على الشاشة الذي فيه أزرار تؤثر في المباراة: كل ما عداه يُعلمك بالأشياء فقط.
tutorial.mesa.land.title = العب أرضًا
tutorial.mesa.land.body = في يدك بطاقة Forest. اسحبها من يدك إلى الطاولة، أو انقر عليها فقط. الأراضي هي مصدر المانا، ولا يمكنك أن تلعب إلا أرضًا واحدة فقط في كل دور. انتبه: لعب الأرض من الأشياء القليلة التي لا يمكن التراجع عنها.
tutorial.mesa.mana.title = لديك مانا الآن
tutorial.mesa.mana.body = ها هي، في صفك الخلفي. دفع تكلفة تعويذة يُميل الأراضي، واللعبة تفعل ذلك عنك عند الإلقاء (يمكنك تغيير ذلك في الإعدادات). وتعود مُقوَّمة في بداية دورك.
tutorial.mesa.cast.title = ألقِ مخلوقًا
tutorial.mesa.cast.body = اسحب Runeclaw Bear من يدك إلى الطاولة، أو انقر عليها. تُدفع المانا تلقائيًا. إن تعذّر إلقاء بطاقة الآن، فالنقر عليها ببساطة لا يفعل شيئًا.
tutorial.mesa.stack.title = المكدّس
tutorial.mesa.stack.body = ما تلقيه لا يصل إلى الطاولة فورًا: يذهب أولًا إلى المكدّس - القائمة على اليمين - وهناك يستطيع كلا اللاعبين الرد. حين لا يفعل أحد شيئًا، يُنفَّذ العنصر الأعلى. واللافتة الكبيرة في الوسط مرآة للمكدّس: إن كان فيه شيء تراه؛ وحين يفرغ تختفي. ونقرة واحدة تُبعدها جانبًا.
tutorial.mesa.sick.title = مرض الاستدعاء
tutorial.mesa.sick.body = المخلوق الذي وصل للتو يبدو باهتًا: لا يستطيع في هذا الدور الهجوم ولا استخدام القدرات التي تتطلب إمالته. بدءًا من دورك التالي يستطيع ذلك. الأراضي لا تعاني من هذه المشكلة.
tutorial.mesa.zones.title = النظر داخل منطقة
tutorial.mesa.zones.body = يمكن النقر على العدادات في شريطك (اليد، المكتبة، المقبرة، المنفى، القيادة) لفتح ما بداخلها؛ والأكوام الكبيرة على الطاولة تفعل الشيء نفسه. تظهر المكتبة مقلوبة الوجه: إنها معلومات مخفية والعارض لا يكشفها. افتح أي منطقة.
tutorial.mesa.log.title = ما الذي حدث للتو
tutorial.mesa.log.body = في الأسفل على اليسار زر السجل: ما فعله كل لاعب، دورًا بدور، وأفعالك بخط عريض. هو المكان الذي تنظر فيه حين يفعل الخصم شيئًا ولم تلحق بقراءته. افتحه.
tutorial.mesa.end.title = انتهى الدرس الأول
tutorial.mesa.end.body = أصبحت تستطيع قراءة الطاولة والتنقل فيها ولعب دورك. التالي: القتال - الهجوم والصدّ والأسهم.

tutorial.combate.intro.title = مخلوقان جاهزان
tutorial.combate.intro.body = بقي Runeclaw Bear و Llanowar Elves على الطاولة دورًا كاملًا، لذا يستطيعان الهجوم. وفي الجهة المقابلة Wind Drake (2/2) يستطيع الصدّ.
tutorial.combate.go.title = انتقل إلى القتال
tutorial.combate.go.body = تُعلن الهجمات في خطوتها الخاصة. اضغط الزر الكبير (أو Space) حتى يصل الشريط إلى «إعلان المهاجمين».
tutorial.combate.declare.title = اختر من يهاجم
tutorial.combate.declare.body = انقر على مخلوقاتك: يتقدم المهاجمون نحو الخط الأوسط ويظهر لكلٍّ منهم سهم يشير إلى خصمك. يمكنك أيضًا سحب مخلوق إلى صورة الخصم. حين تكون راضيًا، اضغط الزر الكبير للتأكيد.
tutorial.combate.arrows.title = الأسهم تروي القصة كاملة
tutorial.combate.arrows.body = يمتد سهم من كل مهاجم إلى ما يهاجمه. وحين يصدّ الطرف الآخر، يمتد سهم آخر من كل صادّ إلى المهاجم الذي يقف أمامه.
tutorial.combate.blocks.title = الآن يصدّ الخصم
tutorial.combate.blocks.body = اضغط الزر الكبير ودعه يقرر. ما يصدّه لا يصيب اللاعب: تتقاتل تلك المخلوقات فيما بينها بدلًا من ذلك.
tutorial.combate.damage.title = الضرر
tutorial.combate.damage.body = كل ما لم يُصدّ يُنقص نقاط حياة الخصم، وسترى ذلك يتغير على شريطه. يبقى الضرر على المخلوقات مسجَّلًا حتى نهاية الدور؛ وإن بلغ صلابتها ماتت. النقر الأيمن يُظهر مقدار الضرر الذي يحمله المخلوق.
tutorial.combate.blocking.title = حين يهاجمك
tutorial.combate.blocking.body = الصدّ يتطلب نقرتين والترتيب مهم: أولًا المهاجم الذي تريد الوقوف أمامه، ثم مخلوقك. لإزالة صادّ، النقرتان نفسهما مجددًا.
tutorial.combate.why.title = إن ضغطت ولم يحدث شيء
tutorial.combate.why.body = أحيانًا يرفض المحرك ما أعلنته (مخلوق مُجبر على الهجوم، أو آخر يحتاج إلى صادَّين...). حين يحدث ذلك يظهر السبب تحت الزر الذي ضغطته للتو، مع اسم البطاقة التي تعيقك. إن لم يستجب الزر، فانظر هناك.
tutorial.combate.end.title = انتهى الدرس الثاني
tutorial.combate.end.body = الهجوم والصدّ وقراءة الأسهم. وما تبقى هو ما يحسم المباريات: القدرات والفوريات.

tutorial.trucos.intro.title = بطاقات تفعل أشياء
tutorial.trucos.intro.body = لديك Prodigal Pyromancer على الطاولة. إلى جانب كونه مخلوقًا، لديه قدرة يمكنك تفعيلها: أمِله ليُلحق 1 ضرر بأي شيء.
tutorial.trucos.activate.title = فعّل قدرته
tutorial.trucos.activate.body = انقر على Prodigal Pyromancer. حين تكون لبطاقة عدة أشياء تفعلها، تُظهرها كلها قائمة، مع تمييز ما لا تستطيع دفع تكلفته. اختر القدرة، ثم انقر على صورة الخصم لتوجيهها إليه.
tutorial.trucos.targets.title = اختيار الأهداف
tutorial.trucos.targets.body = حين يحتاج شيء إلى هدف، يُبرز كل ما يمكنك اختياره ويُرسم سهم منحنٍ من المصدر إلى الهدف. قد تكون الأهداف في أي مكان: الطاولة، أو مقبرة، أو المنفى. إن كانت في منطقة مغلقة، تفتحها اللعبة لتتمكن من النقر داخلها.
tutorial.trucos.instant.title = ألقِ فورية
tutorial.trucos.instant.body = في يدك Lightning Bolt. يمكن إلقاء الفورية في أي وقت تملك فيه الأولوية: في دورك، وفي دور الخصم، وحتى مع وجود شيء ينتظر في المكدّس. ألقِها على ما تشاء.
tutorial.trucos.stops.title = التوقف خلال دور الخصم
tutorial.trucos.stops.body = كي لا تضطر إلى ضغط «موافق» ألف مرة، تمرّر اللعبة الأولوية عنك حين لا يوجد ما يمكنك فعله. إن أردت انتظار لحظة معينة، فانقر على مرحلة في الشريط: يضبط ذلك نقطة توقف وستمنحك اللعبة الأولوية هناك. انقر على واحدة لتجرّب (وانقر عليها مجددًا لإزالتها). التبويبان فوق الشريط، «أنت» و«الخصوم»، يحددان أدوار من تخصّها نقاط التوقف تلك.
tutorial.trucos.commander.title = منطقة القيادة
tutorial.trucos.commander.body = على يمين يدك منطقة القيادة، حيث يقيم قائدك. تلقيه من هناك، وفي كل مرة تعيد إلقاءه يكلّف {2} إضافية: تظهر الضريبة بجانبه. وفي Commander تخسر أيضًا إن ألحق بك قائد واحد 21 ضررًا في المجموع، وذلك العدّاد موجود في شريطك.
tutorial.trucos.undo.title = تراجع
tutorial.trucos.undo.body = Ctrl+Z يتراجع عن آخر شيء ما دام المحرك يسمح بذلك، أي كل ما مرّ عبر المكدّس. لعب الأرض لا يمكن التراجع عنه، لأنه لا يمر بالمكدّس أبدًا. ولهذا يستحق الأمر أن تتأنّى قبل أن تضع أرضًا.
tutorial.trucos.pause.title = Escape والإعدادات
tutorial.trucos.pause.body = يفتح Escape قائمة الإيقاف المؤقت: الاستئناف، والإعدادات، وإعادة البدء، والخروج. اضغطه وادخل إلى الإعدادات: فيها الكثير مما يغيّر طريقة اللعب ولا يكتشفه أحد بنفسه، لأن اللعبة تعمل جيدًا دون لمس أي شيء منه. ألقِ نظرة، وعُد إلى المباراة بـ Escape متى شئت.
tutorial.trucos.settings.title = ما يمكنك تغييره هناك
tutorial.trucos.settings.body = في الإعدادات تقرر: هل تُدفع المانا عنك، وهل تُمرَّر الأولوية عنك حين لا يكون لديك ما تفعله، ومتى تتوقف خلال دور الخصم، وكم تُبطئ الذكاء الاصطناعي - فهو ينهي دوره في أجزاء من الثانية، ودون إبطائه يفوتك ما يفعله -، وهل تُسأل قبل أن تغادر مرحلتك الرئيسية، وحجم الواجهة، واللغة، ومستوى الصوت. والإعدادات نفسها موجودة خارج المباراة أيضًا، عبر Escape.
tutorial.trucos.end.title = أصبحت تعرف كيف تلعب
tutorial.trucos.end.body = قراءة بطاقة بالنقر الأيمن، والتقريب بـ Ctrl+العجلة، واللعب والهجوم بالنقر أو السحب، وتفعيل القدرات، والرد بالفوريات، والتوقف حيث تشاء. هذه كل عناصر التحكم. والباقي على البطاقات، التي تأتي ونصّها مكتوب عليها. استمتع.

