pause.quit.run.detail = لا تُجتاز هذه العقدة حتى تفوز بها، لذا فالمغادرة الآن تنهي الجولة: ستفقد رزمتك وآثارك وتقدّمك. لتتوقف عن اللعب دون أن تخسر شيئًا، افز بهذه المبارزة أو اخسرها ثم اضغط «رجوع» على الخريطة.
