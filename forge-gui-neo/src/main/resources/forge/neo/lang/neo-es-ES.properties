ascent.event.shrine.title = EL ALTAR AGRIETADO
ascent.event.shrine.text = Una piedra partida, con algo brillando dentro. La grieta tiene el ancho justo para un brazo, y los bordes no parecen amables.
ascent.event.gambler.title = EL TAHÚR
ascent.event.gambler.text = Ha montado la mesa en mitad del camino y baraja sin mirar las cartas. Dice que la casa siempre pierde. Sonríe al decirlo.
ascent.event.chest.title = EL COFRE CON TRAMPA
ascent.event.chest.text = Cerrado con un mecanismo que no vas a entender a tiempo. Se oye algo dentro, y el metal tiene marcas de otros que lo intentaron.
ascent.event.collector.title = EL COLECCIONISTA
ascent.event.collector.text = No le interesa tu dinero ni tu vida: quiere una carta, cualquiera, y paga bien por ella. Insiste en que elijas tú.
ascent.event.campfire.title = LA HOGUERA OLVIDADA
ascent.event.campfire.text = Alguien la dejó encendida y se marchó. Da para calentarse un rato, o para quemar algo que ya no te sirve.
ascent.event.echo.title = EL ECO DEL PLANO
ascent.event.echo.text = El aire repite lo que piensas medio segundo tarde. Si te dejas, te enseña algo; pero se cobra el rato.
ascent.event.fountain.title = LA FUENTE
ascent.event.fountain.text = Agua quieta, sin fondo visible. El dueño cobra por beber y no da explicaciones sobre por qué.
