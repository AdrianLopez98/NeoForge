tutorial.quit = Salir del tutorial
tutorial.waiting = Haz lo que dice aqui arriba y el paso pasa solo.
tutorial.done = Hecho.

tutorial.mesa.title = La mesa y tu turno
tutorial.mesa.summary = Quien es quien, como se lee una carta, como se acerca la mesa, y un turno entero: tierra, hechizo y stack.
tutorial.combate.title = El combate
tutorial.combate.summary = Atacar, bloquear y entender las flechas. Y que hacer cuando el motor no te deja terminar.
tutorial.trucos.title = Habilidades, instantaneos y comandante
tutorial.trucos.summary = Activar una habilidad, elegir objetivo, pararte en el turno del rival y la zona de mando.

tutorial.mesa.welcome.title = Esto es una partida de mentira
tutorial.mesa.welcome.body = Estas en una mesa preparada para practicar: pase lo que pase no se guarda nada. Ve leyendo y haciendo lo que se pida; cuando un paso pida hacer algo, se pasa solo en cuanto lo hagas. Puedes irte cuando quieras con "Salir del tutorial", aqui arriba.
tutorial.mesa.you.title = El de abajo eres tu
tutorial.mesa.you.body = Tu barra: nombre, vida, el mana que tengas flotando y el contador de cada zona (mano, mazo, cementerio, exilio, mando). Cuando se ilumina, el turno es tuyo.
tutorial.mesa.rival.title = Arriba, el rival
tutorial.mesa.rival.body = La misma barra del otro lado. Su mano se ve por el numero, no por las cartas. En una partida a tres o a cuatro, arriba salen pestañas para mirar a cada rival.
tutorial.mesa.zoom.title = Leer una carta: clic DERECHO
tutorial.mesa.zoom.body = Las cartas de la mesa son pequeñas para que quepan todas. Para leer una, clic derecho encima: sale grande y con lo que la imagen no cuenta (su fuerza de ahora, los contadores, lo que lleva encima). Un clic izquierdo en cualquier sitio la cierra. Pruebalo con cualquier carta.
tutorial.mesa.board.title = Acercar la mesa: Ctrl + rueda
tutorial.mesa.board.body = Con la mesa llena las cartas se encogen. Ctrl + rueda del raton acerca y aleja dejando quieto lo que hay bajo el puntero. Acercada, se mueve con el boton central (o Ctrl + arrastrar), y la pastilla de la esquina te devuelve a la mesa entera. Da una vuelta de rueda con Ctrl pulsado.
tutorial.mesa.phases.title = El turno va por fases
tutorial.mesa.phases.body = El rail de la derecha son los pasos del turno, de arriba abajo: enderezar, mantenimiento, robar, fase principal, combate, segunda principal y final. El encendido es el de ahora. Mas adelante veras que ademas se pueden clicar.
tutorial.mesa.button.title = Lo que el juego te pide
tutorial.mesa.button.body = Debajo del rail hay un texto y un boton grande. El texto dice que se espera de ti; el boton dice lo que va a pasar al pulsarlo ("Pasar", "Terminar", "No bloquear"...). La barra espaciadora lo pulsa. Es el unico sitio de la pantalla con botones que tocan la partida: todo lo demas solo informa.
tutorial.mesa.land.title = Juega una tierra
tutorial.mesa.land.body = En la mano tienes un Bosque. Arrastralo de la mano a la mesa, o haz clic sobre el. Las tierras son de donde sale el mana y solo se puede jugar UNA por turno. Ojo: jugar una tierra es de lo poco que no se puede deshacer.
tutorial.mesa.mana.title = Ya tienes mana
tutorial.mesa.mana.body = Ahi esta, en tu fila de atras. Para pagar un hechizo se giran las tierras, y eso lo hace el juego solo al lanzar (se puede cambiar en Ajustes). Al empezar tu turno se enderezan otra vez.
tutorial.mesa.cast.title = Lanza una criatura
tutorial.mesa.cast.body = Arrastra el Runeclaw Bear de la mano a la mesa, o clica sobre el. El mana se paga solo. Si una carta no se puede lanzar ahora mismo, al clicarla no pasa nada.
tutorial.mesa.stack.title = El stack
tutorial.mesa.stack.body = Lo que lanzas no llega a la mesa de golpe: primero pasa por el stack, que es la lista de la derecha, y ahi los dos jugadores pueden responder. Cuando nadie hace nada, lo de arriba se resuelve. El cartel grande del centro es un espejo del stack: si hay algo, se ve; cuando se vacia, se va solo. Y se aparta con un clic.
tutorial.mesa.sick.title = Mareo de invocacion
tutorial.mesa.sick.body = La criatura que acaba de entrar se ve apagada: este turno no puede atacar ni usar habilidades que pidan girarla. Desde tu turno siguiente, si. Las tierras no tienen ese problema.
tutorial.mesa.zones.title = Mirar dentro de una zona
tutorial.mesa.zones.body = Los contadores de tu barra (mano, mazo, cementerio, exilio, mando) se clican y se abre lo que hay dentro; las pilas grandes de la mesa hacen lo mismo. El mazo sale boca abajo: es informacion oculta y el visor no la destapa. Abre una zona cualquiera.
tutorial.mesa.log.title = Que ha pasado
tutorial.mesa.log.body = Abajo a la izquierda hay un boton de registro: lo que ha hecho cada uno, turno por turno, y lo tuyo en negrita. Es donde se mira cuando el rival hace algo y no te ha dado tiempo a leerlo. Abrelo.
tutorial.mesa.end.title = Primera leccion hecha
tutorial.mesa.end.body = Ya sabes leer la mesa, moverte por ella y jugar tu turno. En la siguiente, el combate: atacar, bloquear y las flechas.

tutorial.combate.intro.title = Dos criaturas listas
tutorial.combate.intro.body = El Runeclaw Bear y los Llanowar Elves llevan un turno en la mesa, asi que ya pueden atacar. Enfrente hay un Wind Drake 2/2 que puede bloquear.
tutorial.combate.go.title = Ve al combate
tutorial.combate.go.body = Los ataques se declaran en su paso. Pulsa el boton grande (o espacio) hasta que el rail llegue a "Declarar atacantes".
tutorial.combate.declare.title = Elige quien ataca
tutorial.combate.declare.body = Clica tus criaturas: las que atacan se adelantan hacia la linea del centro y les sale una flecha hacia el rival. Tambien puedes arrastrar una criatura sobre su retrato. Cuando lo tengas, pulsa el boton grande para confirmar.
tutorial.combate.arrows.title = Las flechas lo cuentan todo
tutorial.combate.arrows.body = Una flecha va del atacante a lo que ataca. Cuando el rival bloquee, saldra otra flecha de cada bloqueador al atacante al que se pone delante.
tutorial.combate.blocks.title = Ahora bloquea el rival
tutorial.combate.blocks.body = Pulsa el boton grande y deja que el rival decida. Lo que consiga bloquear no le hace daño a el: se lo hacen entre ellas.
tutorial.combate.damage.title = El daño
tutorial.combate.damage.body = Lo que no fue bloqueado baja la vida del rival, y se ve cambiar en su barra. El daño que reciben las criaturas se queda marcado hasta el final del turno; si iguala su resistencia, mueren. Con el clic derecho se ve cuanto llevan.
tutorial.combate.blocking.title = Cuando te ataquen a ti
tutorial.combate.blocking.body = Bloquear se hace en dos clics y el ORDEN importa: primero el atacante al que quieres ponerte delante, y luego tu criatura. Para quitar un bloqueador, los mismos dos clics otra vez.
tutorial.combate.why.title = Si pulsas y no pasa nada
tutorial.combate.why.body = A veces el motor no acepta lo declarado (una criatura obligada a atacar, otra que necesita dos bloqueadores...). Cuando pasa, el motivo sale DEBAJO del boton que acabas de pulsar y nombra la carta que lo impide. Si el boton no reacciona, mira ahi.
tutorial.combate.end.title = Segunda leccion hecha
tutorial.combate.end.body = Atacar, bloquear y leer las flechas. Queda lo que decide las partidas: las habilidades y los instantaneos.

tutorial.trucos.intro.title = Cartas que hacen cosas
tutorial.trucos.intro.body = En la mesa tienes un Prodigal Pyromancer. Ademas de ser una criatura, tiene una habilidad que puedes activar: girarlo para hacer 1 de daño a lo que quieras.
tutorial.trucos.activate.title = Activa su habilidad
tutorial.trucos.activate.body = Clica el Prodigal Pyromancer. Si una carta tiene varias cosas que hacer sale un menu con todas, y las que no puedes pagar salen marcadas. Elige la habilidad y despues clica el retrato del rival para apuntarle.
tutorial.trucos.targets.title = Elegir objetivo
tutorial.trucos.targets.body = Cuando algo pide objetivo, lo que se puede elegir se resalta y sale una flecha curva de origen a destino. Los objetivos pueden estar en cualquier sitio: la mesa, un cementerio o el exilio. Si estan en una zona cerrada, el juego te la abre para que cliques dentro.
tutorial.trucos.instant.title = Lanza un instantaneo
tutorial.trucos.instant.body = En la mano tienes un Lightning Bolt. Un instantaneo se puede lanzar en cualquier momento en que tengas prioridad: en tu turno, en el del rival, y hasta con algo esperando en el stack. Lanzalo a lo que quieras.
tutorial.trucos.stops.title = Pararte en el turno del rival
tutorial.trucos.stops.body = Para no tener que dar a OK mil veces, el juego te pasa la prioridad sola cuando no puedes hacer nada. Si quieres esperar a un momento concreto, CLICA UNA FASE del rail: ahi queda puesta una parada y el juego te dara la prioridad. Clica una para probarlo (y vuelve a clicarla para quitarla). Las dos pestañas de encima del rail, "Tú" y "Rivales", eligen de qué turnos son esas paradas.
tutorial.trucos.commander.title = La zona de mando
tutorial.trucos.commander.body = A la derecha de tu mano esta la zona de mando, donde vive el comandante. Se lanza desde ahi, y cada vez que lo relanzas cuesta {2} mas: el impuesto se ve al lado. En Commander tambien se pierde si UN comandante te hace 21 de daño en total, y ese contador sale en tu barra.
tutorial.trucos.undo.title = Deshacer
tutorial.trucos.undo.body = Ctrl+Z deshace lo ultimo mientras el motor lo permita, que es lo que ha pasado por el stack. Jugar una tierra NO se puede deshacer, porque no pasa por ahi. Por eso conviene mirar antes de soltar una tierra.
tutorial.trucos.pause.title = Escape y Ajustes
tutorial.trucos.pause.body = Escape abre el menu de pausa: continuar, ajustes, reiniciar y salir. Pulsalo y entra en AJUSTES: ahi dentro hay bastantes cosas que cambian como se juega y que no se descubren solas, porque el juego funciona igual sin tocarlas. Mira lo que hay, y vuelve a la partida con Escape cuando quieras.
tutorial.trucos.settings.title = Lo que puedes cambiar ahi
tutorial.trucos.settings.body = En Ajustes decides: si el mana se paga solo, si se te pasa la prioridad sola cuando no tienes nada que hacer, en que momentos pararte en el turno del rival, cuanto frenar a la IA - resuelve su turno en milisegundos y sin frenarla te pierdes lo que hace -, si preguntarte antes de dejar tu fase principal, el tamaño de la interfaz, el idioma y el volumen. Los mismos ajustes salen fuera de partida, tambien con Escape.
tutorial.trucos.end.title = Ya sabes jugar
tutorial.trucos.end.body = Leer una carta con el clic derecho, acercarte con Ctrl+rueda, jugar y atacar clicando o arrastrando, activar habilidades, responder con instantaneos y pararte donde quieras. Esos son todos los controles. Lo demas lo cuentan las cartas, que traen su texto escrito. Que lo disfrutes.

