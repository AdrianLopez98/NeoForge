ascent.event.res.noCards = No queda nada que aprender aquí.
ascent.event.toll.title = EL PUENTE DE PEAJE
ascent.event.toll.text = Un tipo grande cobra por cruzar. Debajo hay cien metros de nada, y no parece que se le pueda regatear.
ascent.event.armory.title = EL ARSENAL ABANDONADO
ascent.event.armory.text = Las puertas están abiertas de par en par y no queda nadie. Lo que hay dentro se lo lleva quien pase.
ascent.event.smith.title = EL HERRERO
ascent.event.smith.text = Trabaja con el metal de las cosas que la gente ya no necesita. Vende poco y caro, y sabe lo que vale.
ascent.event.nest.title = EL NIDO
ascent.event.nest.text = Huevos del tamaño de tu cabeza y algo grande dando vueltas arriba. Nadie ha dicho que fuera a ser gratis.
ascent.event.crossroads.title = LA ENCRUCIJADA
ascent.event.crossroads.text = Un sitio tranquilo para parar, y un montón de trastos que alguien dejó al lado del camino. No da tiempo a las dos cosas.
ascent.event.mirage.title = EL ESPEJISMO
ascent.event.mirage.text = El camino cruza algo que a ratos está y a ratos no. Irás bien o no irás bien, y no hay forma de saberlo antes.
ascent.event.pact.title = EL PACTO
ascent.event.pact.text = Te ofrece algo bueno de verdad. El precio no es dinero ni sangre: es lo que puedes aguantar a partir de ahora.
ascent.event.lender.title = EL PRESTAMISTA
ascent.event.lender.text = Presta lo que le pidas y cobra en el acto. Nunca en dinero.
ascent.event.statue.title = LA ESTATUA
ascent.event.statue.text = Alguien la levantó aquí hace mucho. Aún tiene incrustaciones, y todavía escucha.
ascent.event.wanderer.title = EL VAGABUNDO
ascent.event.wanderer.text = Lleva días sin comer y semanas caminando. No pide nada, pero se queda mirando tu zurrón.
ascent.event.well.title = EL POZO DE LOS DESEOS
ascent.event.well.text = Está lleno de monedas de gente que pasó antes. Alguna vez alguien sacó más de lo que echó.
ascent.event.hermit.title = EL ERMITAÑO
ascent.event.hermit.text = Vive aquí desde antes que el camino. Dice que viajas cargado, y no se refiere a la mochila.
ascent.event.teacher.title = EL MAESTRO
ascent.event.teacher.text = Te mira andar dos pasos y ya sabe todo lo que haces mal. Se ofrece a arreglártelo, a su manera.
