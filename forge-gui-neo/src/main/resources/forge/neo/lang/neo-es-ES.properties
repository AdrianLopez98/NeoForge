lobby.address.lan = En tu red ({0}): {1}
lobby.address.internet = Por internet: {0}
lobby.address.internetHint = Por internet solo entra quien encuentre el puerto {0} abierto en tu router (con UPnP o a mano).
lobby.address.cgnat = Tu operador no te deja hospedar (CGNAT): por internet no va a entrar nadie.
lobby.address.cgnat.what = Tu router comparte una IP pública con otros clientes, así que no tiene dirección propia. Abrir el puerto, a mano o con UPnP, no cambia nada.
lobby.address.cgnat.fix = Para jugar igualmente: instalad los dos una red virtual (Radmin VPN, ZeroTier o Tailscale), uníos a la misma red y aquí arriba te saldrá la dirección que hay que pasar.
lobby.address.cgnat.useVirtual = Pásale la de arriba, la que sale en verde: por ahí sí entra.
lobby.address.virtual = Pásale ésta — {0}: {1}
lobby.address.virtual.note = Es una red virtual: funciona aunque tu router no deje abrir puertos. Tu amigo tiene que estar en la misma red.
lobby.address.ipv6 = Por internet (IPv6): {0}
lobby.address.ipv6.note = Con IPv6 no hay NAT: esa dirección es tuya de verdad. Hacen falta dos cosas más: que tu amigo también tenga IPv6 y que el cortafuegos del router la deje entrar.
lobby.address.cgnat.wakeUp = Tienes {0} instalado pero sin conectar: ábrelo, entra en vuestra red y aquí arriba saldrá la dirección.
lobby.address.cgnat.getIt = Descargar Radmin VPN
lobby.address.cgnat.v4only = Tu operador no te deja hospedar por IPv4 (CGNAT).
lobby.address.cgnat.tryIpv6 = Pero tienes IPv6: pásale la de arriba. Si tu amigo también tiene IPv6, entra directo y no hay que instalar nada.
lobby.address.noRouter = Tu router no ha contestado (UPnP apagado), así que no sé si esa dirección sirve. Compruébalo tú: mira la IP de internet en la configuración de tu router y compárala con la de aquí arriba. Si no coinciden, tu operador no te deja hospedar y no hay puerto que abrir.
lobby.firewall = Si el cortafuegos pregunta, permite el acceso: si no, nadie podrá entrar.
lobby.versionMismatch = {0} tiene otra versión de NeoForge. Si algo falla de forma rara, jugad los dos con la misma.
