# Los textos de NUESTRA interfaz, en castellano.
#
# Lo que dice el MOTOR (prompts, fases, dialogos que nacen en forge-gui) ya
# viene traducido por Forge: eso no esta aqui. Aqui solo esta nuestro cromo.
#
# Reglas del fichero:
#   - UTF-8. Se lee con un Reader, no con el Latin-1 de siempre.
#   - Los huecos son {0}, {1}... y NO se usa MessageFormat, asi que las
#     comillas simples se escriben tal cual.
#   - Si falta una clave se cae al ingles (neo-en-US.properties), y si tampoco
#     esta sale la clave: una pantalla a medio traducir se ve, pero se usa.

