# ---------------------------------------------------------------------
# EL AVISO DE ELEGIR OBJETIVO  (forge.neo.EngineText)
# ---------------------------------------------------------------------
#
# Forge NO traduce estos avisos en ningún idioma: los compone en inglés
# TargetRestrictions ("Select target " + tipo) y, casi siempre, vienen del
# TgtPrompt$ del script de la carta, que es inglés suelto dentro de
# cardsfolder. Como son 2.217 frases distintas, no se traduce una a una: se
# COMPONE la frase a partir de estas piezas.
#
# Reglas al traducir esta sección:
#
#   - Las piezas se pegan en este orden:
#         verbo + cuantificador/artículo + nombre + adjetivos + calificadores
#     "Elige" "hasta un" "permanente" "que no sea tierra" "que controla un oponente"
#
#   - Los NOMBRES llevan tres claves: singular, plural y género (f o m). El
#     género decide qué artículo y qué forma de adjetivo se usan, así que tiene
#     que ser el del nombre TRADUCIDO, no el del inglés.
#
#   - Los ADJETIVOS llevan dos formas (.f y .m) y van DETRÁS del nombre. Si en
#     tu idioma no cambian, se escribe la misma en las dos.
#
#   - Los CUANTIFICADORES sustituyen al artículo, así que se escriben ya
#     apocopados: "hasta un artefacto", nunca "hasta uno artefacto".
#
#   - Los CALIFICADORES son oraciones de relativo y se han elegido a propósito
#     para que NO dependan del género ("que controlas", "en tu cementerio").
#
#   - Si falta una sola pieza, la frase entera se queda en inglés: media frase
#     traducida es peor que ninguna. Por eso no hace falta llenarlo todo de
#     golpe, pero lo que se ponga tiene que ser coherente.
#
# En inglés esta sección no existe: la frase ya viene así del motor.

