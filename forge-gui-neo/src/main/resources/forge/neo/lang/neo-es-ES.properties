ascent.event.campfire.title = LA HOGUERA OLVIDADA
ascent.event.campfire.text = Alguien la dejó encendida y se marchó. Da para calentarse un rato, o para quemar algo que ya no te sirve.
ascent.event.echo.title = EL ECO DEL PLANO
