# =====================================================================
#  튜토리얼 - 게임 조작법
# =====================================================================
app.preparingTutorial = 레슨을 준비하는 중...

menu.tutorial = 튜토리얼
menu.tutorial.desc = 실제 게임으로 배우는 조작법: 카드 읽기, 시전하기, 공격하기, 능력 활성화하기
menu.tutorial.note = 게임 안에서 조작법을 익히려면 필요해요
menu.tutorial.done = 세 레슨 모두 완료 - 다시 해볼 수 있어요

tutorial.title = 튜토리얼
tutorial.welcome = 환영해요. 실전에 들어가기 전에, 게임 조작법을 알려주는 짧은 레슨 세 개예요. 매직을 몰라도 괜찮아요: 여기서는 테이블 다루는 법만 알려드려요.
tutorial.progress = {1}개 중 {0}개 레슨 완료
tutorial.play = 플레이: {0}
tutorial.reset = 처음부터 다시
tutorial.lessonDone = 완료 - 다시 해볼 수 있어요
tutorial.lessonSteps = {0}단계
tutorial.counter = 튜토리얼  -  {0}  -  {1}/{2}단계
tutorial.next = 다음
tutorial.skip = 이 단계 건너뛰기
tutorial.quit = 튜토리얼 나가기
tutorial.waiting = 여기 적힌 대로 하면 저절로 다음 단계로 넘어가요.
tutorial.done = 완료.

tutorial.mesa.title = 테이블과 당신의 턴
tutorial.mesa.summary = 누가 누구인지, 카드 읽는 법, 테이블 확대하는 법, 그리고 턴 하나 전체: 토지, 주문, 스택.
tutorial.combate.title = 전투
tutorial.combate.summary = 공격하고 막고 화살표 읽는 법. 그리고 엔진이 끝내지 못하게 막을 때 어떻게 할지.
tutorial.trucos.title = 능력, 인스턴트, 커맨더
tutorial.trucos.summary = 능력 활성화하기, 대상 고르기, 상대 턴에 멈추기, 지휘 구역.

tutorial.mesa.welcome.title = 이건 연습 게임이에요
tutorial.mesa.welcome.body = 지금 있는 테이블은 연습용으로 준비된 거라, 여기서 하는 일은 저장되지 않아요. 읽으면서 각 단계가 시키는 대로 해보세요. 행동이 필요한 단계는 하자마자 저절로 넘어가요. "튜토리얼 나가기"를 누르면 언제든 나갈 수 있어요.
tutorial.mesa.you.title = 아래쪽이 당신이에요
tutorial.mesa.you.body = 당신의 바: 이름, 생명, 떠 있는 마나, 그리고 각 구역(손패, 라이브러리, 묘지, 추방, 지휘)의 개수예요. 불이 켜지면 당신의 턴이에요.
tutorial.mesa.rival.title = 위쪽은 상대예요
tutorial.mesa.rival.body = 반대편에도 같은 바가 있어요. 상대의 손패는 카드가 아니라 숫자로만 보여요. 3인이나 4인 게임에서는 위쪽에 탭이 생겨서 각 상대를 볼 수 있어요.
tutorial.mesa.zoom.title = 카드 읽기: 오른쪽 클릭
tutorial.mesa.zoom.body = 테이블의 카드는 다 들어가도록 일부러 작게 표시돼요. 읽으려면 오른쪽 클릭하세요: 카드가 크게 뜨면서 이미지만으로는 알 수 없는 것(지금 힘, 카운터, 부착된 것)도 함께 보여줘요. 아무 곳이나 왼쪽 클릭하면 닫혀요. 아무 카드에나 해보세요.
tutorial.mesa.board.title = 테이블 확대: Ctrl + 휠
tutorial.mesa.board.body = 테이블이 꽉 차면 카드가 작아져요. Ctrl + 마우스 휠로 확대·축소하면 포인터 아래 지점이 고정돼요. 확대된 상태에서는 마우스 가운데 버튼(또는 Ctrl + 드래그)으로 테이블을 옮길 수 있고, 구석의 배지를 누르면 전체 테이블로 돌아가요. Ctrl을 누른 채로 휠을 한 번 돌려보세요.
tutorial.mesa.phases.title = 턴은 페이즈로 진행돼요
tutorial.mesa.phases.body = 오른쪽 레일이 턴의 단계예요, 위에서 아래로: 언탭, 업킵, 드로우, 첫 메인, 전투, 두 번째 메인, 종료. 불이 켜진 게 지금이에요. 나중엔 이것도 클릭할 수 있다는 걸 알게 될 거예요.
tutorial.mesa.button.title = 게임이 당신에게 원하는 것
tutorial.mesa.button.body = 레일 아래에 문구와 큰 버튼이 있어요. 문구는 지금 무엇을 해야 하는지 알려주고, 버튼은 누르면 무슨 일이 일어날지 말해줘요("패스", "턴 종료", "막지 않음"...). 스페이스바로도 누를 수 있어요. 게임에 직접 영향을 주는 버튼은 화면에서 여기뿐이에요: 나머지는 정보만 알려줘요.
tutorial.mesa.land.title = 토지를 내보세요
tutorial.mesa.land.body = 손패에 숲이 있어요. 손패에서 테이블로 드래그하거나 그냥 클릭하세요. 토지에서 마나가 나오고, 한 턴에 딱 한 장만 낼 수 있어요. 주의: 토지를 내는 건 되돌릴 수 없는 몇 안 되는 행동이에요.
tutorial.mesa.mana.title = 이제 마나가 생겼어요
tutorial.mesa.mana.body = 뒷줄에 있죠. 주문값을 낼 때는 토지를 탭하는데, 시전할 때 게임이 알아서 해줘요(설정에서 바꿀 수 있어요). 당신의 턴이 시작되면 다시 언탭돼요.
tutorial.mesa.cast.title = 생물을 시전하세요
tutorial.mesa.cast.body = 손패의 룬클로 베어를 테이블로 드래그하거나 클릭하세요. 마나는 자동으로 지불돼요. 지금 시전할 수 없는 카드는 클릭해도 아무 일도 안 일어나요.
tutorial.mesa.stack.title = 스택
tutorial.mesa.stack.body = 시전한 건 바로 테이블에 나오지 않아요: 먼저 스택, 오른쪽에 있는 목록에 올라가고, 거기서 두 플레이어 모두 응수할 수 있어요. 아무도 아무것도 안 하면 맨 위 것부터 해결돼요. 가운데의 큰 배너는 스택을 그대로 비추는 거예요: 뭔가 있으면 보이고, 비면 사라져요. 클릭하면 옆으로 치울 수 있어요.
tutorial.mesa.sick.title = 소환 병
tutorial.mesa.sick.body = 방금 들어온 생물은 흐릿하게 보여요: 이번 턴엔 공격하거나 탭이 필요한 능력을 쓸 수 없어요. 다음 턴부터는 가능해요. 토지는 이런 문제가 없어요.
tutorial.mesa.zones.title = 구역 안 들여다보기
tutorial.mesa.zones.body = 당신 바의 카운터(손패, 라이브러리, 묘지, 추방, 지휘)를 클릭하면 안에 있는 게 열려요. 테이블의 큰 더미도 마찬가지예요. 라이브러리는 뒷면으로 나와요: 숨겨진 정보라서 뷰어도 보여주지 않아요. 아무 구역이나 열어보세요.
tutorial.mesa.log.title = 무슨 일이 있었나
tutorial.mesa.log.body = 왼쪽 아래에 기록 버튼이 있어요: 각자 턴마다 한 일이 나오고, 당신 것은 굵게 표시돼요. 상대가 뭔가 했는데 읽을 시간이 없었을 때 여길 보면 돼요. 열어보세요.
tutorial.mesa.end.title = 첫 번째 레슨 완료
tutorial.mesa.end.body = 이제 테이블을 읽고, 돌아다니고, 당신의 턴을 플레이할 수 있어요. 다음은 전투예요: 공격, 방어, 화살표.

tutorial.combate.intro.title = 준비된 생물 두 마리
tutorial.combate.intro.body = 룬클로 베어와 라노워 엘프가 한 턴을 버텨서 이제 공격할 수 있어요. 맞은편엔 막을 수 있는 2/2 윈드 드레이크가 있어요.
tutorial.combate.go.title = 전투로 넘어가세요
tutorial.combate.go.body = 공격은 전용 단계에서 선언해요. 레일이 "공격자 선언"에 닿을 때까지 큰 버튼(또는 스페이스)을 누르세요.
tutorial.combate.declare.title = 누가 공격할지 고르세요
tutorial.combate.declare.body = 생물을 클릭하세요: 공격하는 생물은 중앙선 쪽으로 나아가면서 상대를 향한 화살표가 생겨요. 생물을 상대의 초상화 위로 드래그해도 돼요. 다 골랐으면 큰 버튼을 눌러 확정하세요.
tutorial.combate.arrows.title = 화살표가 모든 걸 말해줘요
tutorial.combate.arrows.body = 공격하는 대상마다 화살표가 하나씩 이어져요. 상대가 막으면, 막는 생물에서 막고 있는 공격자로 또 다른 화살표가 생겨요.
tutorial.combate.blocks.title = 이제 상대가 막을 차례예요
tutorial.combate.blocks.body = 큰 버튼을 누르고 상대가 정하게 두세요. 상대가 막은 건 플레이어에게 피해를 주지 않아요: 대신 생물끼리 싸워요.
tutorial.combate.damage.title = 피해
tutorial.combate.damage.body = 막히지 않은 공격은 상대의 생명을 깎고, 상대 바에서 그게 바뀌는 걸 볼 수 있어요. 생물이 받은 피해는 턴이 끝날 때까지 표시돼 있고, 인성에 다다르면 죽어요. 오른쪽 클릭하면 얼마나 받았는지 볼 수 있어요.
tutorial.combate.blocking.title = 상대가 당신을 공격할 때
tutorial.combate.blocking.body = 막는 건 클릭 두 번이고 순서가 중요해요: 먼저 막고 싶은 공격자, 그다음 당신의 생물이에요. 막는 걸 취소하려면 같은 두 번의 클릭을 다시 하면 돼요.
tutorial.combate.why.title = 눌러도 아무 일도 안 일어나면
tutorial.combate.why.body = 가끔 엔진이 선언한 걸 받아들이지 않아요(반드시 공격해야 하는 생물, 두 마리가 막아야 하는 생물...). 그럴 땐 방금 누른 버튼 아래에 이유가 나오면서 원인이 된 카드 이름도 나와요. 버튼이 반응하지 않으면 거길 보세요.
tutorial.combate.end.title = 두 번째 레슨 완료
tutorial.combate.end.body = 공격하고, 막고, 화살표 읽는 법을 배웠어요. 남은 건 게임을 가르는 것들: 능력과 인스턴트예요.

tutorial.trucos.intro.title = 뭔가를 하는 카드
tutorial.trucos.intro.body = 테이블에 프로디절 파이로맨서가 있어요. 생물이면서 활성화할 수 있는 능력도 있어요: 탭해서 원하는 대상에게 1점의 피해를 줘요.
tutorial.trucos.activate.title = 능력을 활성화하세요
tutorial.trucos.activate.body = 프로디절 파이로맨서를 클릭하세요. 카드에 할 수 있는 게 여러 개면 메뉴에 전부 나오고, 지불할 수 없는 건 표시돼요. 능력을 고른 다음 상대의 초상화를 클릭해서 겨누세요.
tutorial.trucos.targets.title = 대상 고르기
tutorial.trucos.targets.body = 대상이 필요할 때는 고를 수 있는 것들이 강조되고, 원본에서 대상까지 곡선 화살표가 그려져요. 대상은 어디에나 있을 수 있어요: 테이블, 묘지, 추방까지도요. 닫힌 구역에 있으면 게임이 열어줘서 안을 클릭할 수 있어요.
tutorial.trucos.instant.title = 인스턴트를 시전하세요
tutorial.trucos.instant.body = 손패에 라이트닝 볼트가 있어요. 인스턴트는 우선권이 있을 때면 언제든 시전할 수 있어요: 당신의 턴이든, 상대의 턴이든, 스택에 뭔가 기다리고 있을 때도요. 원하는 대상에 시전하세요.
tutorial.trucos.stops.title = 상대 턴에 멈추기
tutorial.trucos.stops.body = OK를 천 번씩 누르지 않아도 되도록, 할 수 있는 게 없을 땐 게임이 알아서 우선권을 넘겨요. 특정 순간에 멈추고 싶으면 레일에서 페이즈를 클릭하세요: 그러면 정지 지점이 생기고 게임이 거기서 우선권을 줘요. 하나 클릭해서 시험해보세요(다시 클릭하면 없어져요).
tutorial.trucos.commander.title = 지휘 구역
tutorial.trucos.commander.body = 손패 오른쪽에 커맨더가 사는 지휘 구역이 있어요. 거기서 시전하고, 다시 시전할 때마다 {2}씩 더 들어요: 세금이 옆에 표시돼요. 커맨더 포맷에서는 커맨더 한 장에게서 총 21점의 피해를 받아도 져요. 그 숫자도 당신 바에 나와요.
tutorial.trucos.undo.title = 되돌리기
tutorial.trucos.undo.body = Ctrl+Z는 엔진이 허락하는 한 마지막 행동을 되돌려요. 즉, 스택을 거친 것만 가능해요. 토지를 내는 건 스택을 거치지 않아서 되돌릴 수 없어요. 그러니 토지를 놓기 전에 잘 살펴보는 게 좋아요.
tutorial.trucos.pause.title = Escape와 설정
tutorial.trucos.pause.body = Escape를 누르면 일시정지 메뉴가 열려요: 계속하기, 설정, 다시 시작, 나가기. 눌러서 '설정'에 들어가 보세요. 게임이 진행되는 방식 자체를 바꾸는 항목이 꽤 있는데, 건드리지 않아도 게임은 잘 돌아가니까 혼자서는 발견하기 어려워요. 살펴본 다음 Escape로 언제든 대전으로 돌아오면 돼요.
tutorial.trucos.settings.title = 거기서 바꿀 수 있는 것
tutorial.trucos.settings.body = 설정에서는 마나를 자동으로 낼지, 할 일이 없을 때 우선권을 자동으로 넘길지, 상대 턴의 어느 순간에 멈출지, AI를 얼마나 늦출지(AI는 자기 턴을 몇 밀리초 만에 처리하니까 늦추지 않으면 뭘 했는지 놓쳐요), 주 단계를 떠나기 전에 물어볼지, 그리고 인터페이스 크기와 언어, 음량을 정할 수 있어요. 같은 설정은 대전 밖에서도 Escape로 열려요.
tutorial.trucos.end.title = 이제 플레이하는 법을 알아요
tutorial.trucos.end.body = 오른쪽 클릭으로 카드 읽기, Ctrl+휠로 확대하기, 클릭이나 드래그로 플레이하고 공격하기, 능력 활성화하기, 인스턴트로 응수하기, 원할 때 멈추기. 이게 조작법의 전부예요. 나머지는 카드에 적혀 있어요. 즐겁게 플레이하세요.

