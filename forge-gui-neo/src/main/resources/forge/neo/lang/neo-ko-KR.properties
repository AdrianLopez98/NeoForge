ascent.event.shrine.text = 쪼개진 돌 안에서 무엇인가 빛난다. 팀은 팔 하나 들어갈 너비이고, 모서리는 친절해 보이지 않는다.
ascent.event.gambler.title = 도박꾼
ascent.event.gambler.text = 길 한가운데 판을 펼치고 카드를 보지도 않고 섞는다. 하우스는 항상 진다고 말하며 웃는다.
ascent.event.chest.title = 함정이 있는 상자
ascent.event.chest.text = 제때 풀 수 없는 장치로 잠겨 있다. 안에서 무언가 달그랑거리고, 금속에는 먼저 시도한 자들의 흔적이 있다.
ascent.event.collector.title = 수집가
ascent.event.collector.text = 돈도 피도 원하지 않는다. 카드 한 장이면 되고, 값은 후하게 치른다. 고르는 건 네 몴이라고 말한다.
ascent.event.campfire.title = 잊혀진 모닥불
ascent.event.campfire.text = 누군가 불을 남겨둔 채 떠났다. 잠시 몸을 녹이기에도, 필요 없는 걸 태우기에도 충분하다.
ascent.event.echo.title = 차원의 메아리
ascent.event.echo.text = 공기가 생각을 반박자 늦게 되품이한다. 맡기면 무언가를 가르쳐 주지만, 대가를 받는다.
ascent.event.fountain.title = 샘
