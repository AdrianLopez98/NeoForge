# 우리 인터페이스에서 쓰는 텍스트, 한국어판.
#
# 엔진이 하는 말(프롬프트, 페이즈, forge-gui에서 나오는 대화상자)은 이미
# Forge가 번역해 놓았으므로 여기에는 없습니다. 여기 있는 건 우리 크롬(화면
# 장식)뿐입니다.
#
# 파일 규칙:
#   - UTF-8, BOM 없이 저장합니다.
#   - 빈칸은 {0}, {1}... 이고 MessageFormat을 쓰지 않으므로 작은따옴표는
#     그대로 씁니다.
#   - 키가 없으면 영어(neo-en-US.properties)로 대체되고, 거기에도 없으면
#     키 이름 자체가 화면에 나옵니다: 절반만 번역된 화면이 보이긴 해도 계속
#     쓸 수는 있습니다.

