ascent.event.smith.text = 아무도 필요 없어진 것들의 금속을 다룬다. 적게 팔고 비싸게 받는다.
ascent.event.nest.title = 둥지
ascent.event.nest.text = 머리만한 알들, 그리고 위에서 맴도는 큰 것. 공짜라고는 아무도 하지 않았다.
ascent.event.crossroads.title = 갈림길
ascent.event.crossroads.text = 쉐기 좋은 자리와, 누군가 길가에 두고 간 잡동사니 더미. 둘 다 할 시간은 없다.
ascent.event.mirage.title = 신기루
ascent.event.mirage.text = 길이 있다 없어지는 무언가를 가로지른다. 잘 될 수도, 아닐 수도 있고, 미리는 모른다.
ascent.event.pact.title = 계약
ascent.event.pact.text = 정말 좋은 걸 내민다. 값은 돈도 피도 아니다 — 앞으로 네가 버팼 수 있는 양이다.
ascent.event.lender.title = 고리대금업자
ascent.event.lender.text = 달라는 대로 빌려주고 그 자리에서 받아낸다. 돈으로는 절대 아니다.
ascent.event.statue.title = 석상
ascent.event.statue.text = 오래전 누군가 여기 세웠다. 상감은 아직 남아 있고, 여전히 듣고 있다.
ascent.event.wanderer.title = 떠돌이
ascent.event.wanderer.text = 며칠을 굶고 몇 주를 걷기만 했다. 아무것도 청하지 않지만 네 보따리를 계속 본다.
ascent.event.well.title = 소원의 우물
ascent.event.well.text = 먼저 지나간 사람들의 동전으로 가득하다. 가끔은 던진 것보다 많이 건졌다는 사람도 있다.
ascent.event.hermit.title = 은둔자
ascent.event.hermit.text = 길보다 먼저 여기 살았다. 네가 무겁게 여행한다고 말하는데, 짐 얘기가 아니다.
ascent.event.teacher.title = 스승
ascent.event.teacher.text = 두 걸음만 보고도 네가 틀린 걸 다 안다. 고쳐주겠다고 한다. 자기 방식으로.
