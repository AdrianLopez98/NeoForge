ascent.event.toll.text = 덩치 큰 사내가 건너는 대가를 받는다. 아래는 백 미터의 허공이고, 흥정할 분위기는 아니다.
ascent.event.armory.title = 버려진 무기고
ascent.event.armory.text = 문은 활짝 열려 있고 남은 사람은 없다. 안에 있는 건 지나가는 사람의 것이다.
