# --- Ascenso: salir de un duelo cuesta la run ---
pause.quit.run.ask = 나가서 런을 잃겠습니까?
pause.quit.run.detail = 이 노드는 이겨야 완료됩니다. 지금 나가면 런이 끝나고 덱과 유물, 모든 진행이 사라집니다. 아무것도 잃지 않고 그만두려면 이 결투를 끝낸 뒤 지도에서 돌아가기를 누르세요.
pause.quit.run.yes = 런 포기

# --- Ascenso: el menu y montar la run ---
menu.ascent = 등정
menu.ascent.desc = 운명에 맞서는 런. 지도를 올라가며 전투 사이에 덱을 다듬고 뒤돌아보지 마라. 지면 거기서 끝이다.
menu.ascent.none = 로그라이크 런, 45~60분
menu.ascent.running = 이어하기 — {0}막, 생명점 {1}
menu.ascent.ascension = 등정 {0}단계 해금
ascent.setup.title = 새로운 등정
ascent.setup.subtitle = 시작하면 되돌릴 수 없다. 지면 런이 끝난다.
ascent.setup.mode = 어떤 규칙으로
ascent.setup.mode.standard = 스탠다드
ascent.setup.mode.commander = 커맨더
ascent.setup.mode.standard.desc = 30장, 생명점 20. 한두 색에 레어는 없음. 덱이 약한 건 일부러다. 런 전체가 그걸 키우는 이야기니까.
ascent.setup.mode.commander.desc = 커맨더와 20장, 생명점 40. 보상이 고유색으로 걸러지므로 이 선택이 런 전체를 좌우한다.
ascent.setup.commander = 내 커맨더
ascent.setup.search = 이름으로 검색
ascent.setup.randomCommander = 게임이 고르게 하기
ascent.setup.page = {1}쪽 중 {0}쪽 — 커맨더 {2}장
ascent.setup.ascension = 등정
ascent.setup.ascension.none = 없음
ascent.setup.start = 등정 시작
ascent.setup.startOver = 새 등정 시작
ascent.setup.willLose = 진행 중인 런이 있습니다. 새로 시작하면 영영 사라집니다.
ascent.setup.confirm.ask = 진행 중인 런을 버릴까요?
ascent.setup.confirm.detail = 덱과 유물, 지금까지 올라온 모든 것이 사라집니다. 런은 언제나 하나뿐입니다.
ascent.setup.confirm.yes = 버리고 시작
# --- 상승: 업적 (el plan de Ascenso 19절) ---
ascent.over.feat = 업적 달성: {0}!
ascent.feat.reachAct2.name = 첫 번째 계단
ascent.feat.reachAct2.opens = 꺼진 등대가 여정의 조우에 추가됩니다.
ascent.feat.firstWin.name = 상승 완주
ascent.feat.firstWin.opens = 행상인이 여정의 조우에 추가됩니다.
ascent.feat.hoarder.name = 수집가
ascent.feat.hoarder.opens = 왕들의 묘실이 여정의 조우에 추가됩니다.
ascent.feat.champion.name = 챔피언
ascent.feat.champion.opens = 큰 대장간이 여정의 조우에 추가됩니다.
ascent.event.beacon.title = 꺼진 등대
ascent.event.beacon.text = 절벽 위에 불이 꺼진 등대가 서 있다. 불을 붙일 만큼의 비축은 있다. 나중에 아쉬워질지라도.
ascent.event.beacon.blocked = 태울 최대 생명력과 치료할 상처가 필요합니다
ascent.event.opt.burnStores = 비축을 태우기: 최대 생명력 −{0}, 생명력 {1} 회복
ascent.event.res.burnStores = 생명력을 {0} 회복합니다. 최대 생명력이 {1} 줄어 이제 {2}까지 버팁니다.
ascent.event.peddler.title = 행상인
ascent.event.peddler.text = 작은 사내가 길 한복판에서 커다란 보따리를 푼다. 통째로 팔거나 아예 팔지 않는다고 한다.
ascent.event.opt.buyBundle = 보따리째 사기: {0} 크레딧으로 유물 하나와 카드 3장 중 1장
ascent.event.res.bundle = 보따리에서 {0}이(가) 나왔습니다.
ascent.event.res.bundleHalf = 유물이 남아 있지 않았습니다: {0} 크레딧을 돌려줍니다.
ascent.event.crypt.title = 왕들의 묘실
ascent.event.crypt.text = 돌 아래에는 당신보다 먼저 오른 이들이 잠들어 있다. 오랫동안 아무도 건드리지 않았다.
ascent.event.opt.takeGoods = 부장품을 챙기기: +{0} 크레딧
ascent.event.opt.takeCrown = 왕관을 챙기기: 생명력 −{0}으로 보스 유물
ascent.event.forge.title = 큰 대장간
ascent.event.forge.text = 이 불은 길보다 오래 타고 있다. 대장장이는 당신이 지닌 것을 훑어보고 가장 오래된 것을 가리킨다.
ascent.event.forge.blocked = 크레딧과 다시 벼릴 일반 유물이 필요합니다
ascent.event.opt.reforge = 가장 오래된 일반 유물을 다시 벼리기: {0} 크레딧으로 희귀 유물
ascent.event.res.reforged = {0}이(가) 불에 들어가 {1}(으)로 나왔습니다.
ascent.event.res.noReforge = 대장장이가 이리저리 살펴보더니 그대로 돌려줍니다. 오늘은 안 되겠군요.
