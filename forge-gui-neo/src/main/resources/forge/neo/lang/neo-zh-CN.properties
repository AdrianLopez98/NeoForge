ascent.event.shrine.title = 裂开的神龛
ascent.event.shrine.text = 一块裂开的石头，里面有东西在发亮。缝隙刚好能伸进一条胳膊，边缘看起来并不友好。
ascent.event.gambler.title = 赌徒
ascent.event.gambler.text = 他把牌桌摆在路中间，不看牌就洗。他说庄家总是输。说这话时他在笑。
ascent.event.chest.title = 带陷阱的箱子
ascent.event.chest.text = 锁着一个你来不及看懂的机关。里面有东西在响，金属上留着前人的痕迹。
ascent.event.collector.title = 收藏家
ascent.event.collector.text = 他不要你的钱，也不要你的血：他只要一张牌，哪张都行，且出价不低。他坚持让你来选。
ascent.event.campfire.title = 被遗忘的营火
ascent.event.campfire.text = 有人把它点着就走了。够你暖上一阵，也够烧掉一些不再需要的东西。
ascent.event.echo.title = 次元的回声
ascent.event.echo.text = 空气会晚半秒重复你的念头。任它去做，它会教你些什么——但要收费。
ascent.event.fountain.title = 泉
ascent.event.fountain.text = 静止的水，看不到底。主人按口收钱，不解释为什么。
