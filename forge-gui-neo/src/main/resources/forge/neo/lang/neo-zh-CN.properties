ascent.event.toll.title = 收费的桥
ascent.event.toll.text = 一个大个子收过桥费。下面是一百米的空，而他看起来不像会讲价。
ascent.event.armory.title = 废弃的兵器库
ascent.event.armory.text = 大门敎开，一个人也没。里面的东西归路过的人。
ascent.event.smith.title = 铁匠
ascent.event.smith.text = 他用那些再也没人需要的东西的金属干活。卖得少，卖得贵。
ascent.event.nest.title = 巢
ascent.event.nest.text = 跟你头一般大的蛋，头顶上有个大家伙在盘旋。没人说过这是白拿的。
ascent.event.crossroads.title = 十字路口
ascent.event.crossroads.text = 一个适合歇脚的安静地方，以及路边一堆别人丢下的杂物。两样都做是来不及的。
ascent.event.mirage.title = 海市蜃楼
ascent.event.mirage.text = 路穿过一个忽有忽无的东西。要么顺利要么不，事前无从得知。
ascent.event.pact.title = 契约
ascent.event.pact.text = 它给你真正的好东西。代价不是钱，也不是血：是你从此能承受的量。
ascent.event.lender.title = 放贷人
ascent.event.lender.text = 你要多少他借多少，当场就收。从不收钱。
ascent.event.statue.title = 石像
ascent.event.statue.text = 很久以前有人把它立在这里。镶嵌还在，而且它还在听。
ascent.event.wanderer.title = 流浪者
ascent.event.wanderer.text = 好几天没吃，好几周在走。他什么都不要，但一直看着你的包。
ascent.event.well.title = 许愿井
ascent.event.well.text = 里面堆满了先前路人的硬币。据说偶尔有人捣出的比扔进去的多。
ascent.event.hermit.title = 隐修士
ascent.event.hermit.text = 他比这条路还早住在这里。他说你走得太重，指的不是行李。
ascent.event.teacher.title = 师傅
ascent.event.teacher.text = 看你走两步，就知道你所有做错的地方。她愿意帮你改，用她的方式。
