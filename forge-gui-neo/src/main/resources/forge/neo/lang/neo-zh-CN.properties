menu.tutorial = 教程
menu.tutorial.desc = 通过实战学会怎么操作：读牌、施放、进攻和激活异能
menu.tutorial.note = 想搞懂对局里的操作，从这里开始
menu.tutorial.done = 三节课都上完了 —— 可以重新上

tutorial.title = 教程
tutorial.welcome = 欢迎。在正式对局之前，先来三节短课，学学怎么操作这张桌子。不需要你懂万智牌规则：这里只教你怎么用这套界面。
tutorial.progress = 已完成 {0} / {1} 节课
tutorial.play = 开始：{0}
tutorial.reset = 从头开始
tutorial.lessonDone = 已完成 —— 可以重新上
tutorial.lessonSteps = {0} 个步骤
tutorial.counter = 教程  -  {0}  -  第 {1} / {2} 步
tutorial.next = 下一步
tutorial.skip = 跳过这一步
tutorial.quit = 退出教程
tutorial.waiting = 照着上面说的做，这一步就会自动过去。
tutorial.done = 完成。

tutorial.mesa.title = 牌桌和你的回合
tutorial.mesa.summary = 谁是谁、怎么读一张牌、怎么放大牌桌，还有完整的一个回合：地、法术和堆叠。
tutorial.combate.title = 战斗
tutorial.combate.summary = 进攻、阻挡、看懂箭头。还有引擎不让你继续时该怎么办。
tutorial.trucos.title = 异能、瞬间与指挥官
tutorial.trucos.summary = 激活异能、选择目标、在对手回合暂停，以及指挥区。

tutorial.mesa.welcome.title = 这是一局练习赛
tutorial.mesa.welcome.body = 你现在在一张为练习搭好的桌子上：这里发生的一切都不会被保存。跟着提示做就行；操作类的一步，做完就会自动过去。随时可以点这里的"退出教程"离开。
tutorial.mesa.you.title = 下方的就是你
tutorial.mesa.you.body = 你的信息栏：名字、生命、悬浮的法力，还有每个区域的数量（手牌、牌库、坟场、放逐、指挥）。亮起来的时候，就是你的回合。
tutorial.mesa.rival.title = 对手在上方
tutorial.mesa.rival.body = 对面也是同样的信息栏。对手的手牌只显示数字，不显示卡面。三人或四人对局里，上方会出现标签页，方便查看每个对手。
tutorial.mesa.zoom.title = 读一张牌：右键点击
tutorial.mesa.zoom.body = 桌面上的牌故意做得很小，好让它们都能放得下。要读一张牌，右键点击它：会放大显示，还带上图片里看不出来的信息（现在的力量、指示物、附着在它上面的东西）。在任何地方左键点击一下就会关掉。找张牌试试看。
tutorial.mesa.board.title = 放大牌桌：Ctrl + 滚轮
tutorial.mesa.board.body = 牌桌满了以后卡牌会缩小。Ctrl + 鼠标滚轮可以放大缩小，鼠标指着的地方会保持不动。放大后，鼠标中键（或 Ctrl + 拖动）可以移动牌桌，角落的小标签能带你回到整张牌桌。按住 Ctrl 滚一下滚轮试试。
tutorial.mesa.phases.title = 一个回合分成好几个阶段
tutorial.mesa.phases.body = 右边的轨道就是回合的各个步骤，从上到下：重置、维持、抓牌、主阶段1、战斗、主阶段2、结束。亮着的就是现在所在的阶段。之后你会发现它们还能点击。
tutorial.mesa.button.title = 游戏在等你做什么
tutorial.mesa.button.body = 轨道下方有一行文字和一个大按钮。文字说明现在该做什么；按钮说明按下去会发生什么（"跳过"、"结束回合"、"不阻挡"……）。空格键就能按它。这是屏幕上唯一会真正影响对局的按钮：其他地方都只是提示信息。
tutorial.mesa.land.title = 打一张地
tutorial.mesa.land.body = 你手里有一张森林。把它从手牌拖到桌面上，或者直接点击它。地是法力的来源，每回合只能打一张。注意：打地是少数没法撤销的操作之一。
tutorial.mesa.mana.title = 你现在有法力了
tutorial.mesa.mana.body = 就在你的后排。施放法术要横置地来支付，游戏在你施放的时候会自动帮你做（可以在设置里改）。到你回合开始时它们会重新竖起来。
tutorial.mesa.cast.title = 施放一个生物
tutorial.mesa.cast.body = 把符爪熊从手牌拖到桌面上，或者点击它。法力会自动支付。如果一张牌现在没法施放，点它也不会有任何反应。
tutorial.mesa.stack.title = 堆叠
tutorial.mesa.stack.body = 你施放的东西不会立刻出现在桌面上：它会先进入堆叠——就是右边那份列表——双方都可以在这时候做出反应。等大家都不再做任何事，最上面的那个才会结算。中间那个大横幅是堆叠的镜像：有东西就显示，空了就消失。点一下就能把它挪开。
tutorial.mesa.sick.title = 召唤失调
tutorial.mesa.sick.body = 刚上场的生物看起来是暗淡的：这个回合它不能进攻，也不能使用需要横置它的异能。到你下个回合就可以了。地没有这个限制。
tutorial.mesa.zones.title = 看一个区域里有什么
tutorial.mesa.zones.body = 信息栏上的数量（手牌、牌库、坟场、放逐、指挥）可以点击，打开里面的内容；牌桌上的大堆牌也是一样。牌库会正面朝下显示：这是隐藏信息，查看器不会替你揭开。随便打开一个区域看看。
tutorial.mesa.log.title = 发生了什么
tutorial.mesa.log.body = 左下角有个记录按钮：每个人做了什么，一回合一回合地列出来，你自己的会加粗。当对手做了什么、你没来得及看清楚的时候就来这里看。打开它。
tutorial.mesa.end.title = 第一节课完成
tutorial.mesa.end.body = 你已经会读懂这张牌桌、在上面移动、打完自己的回合了。接下来是战斗：进攻、阻挡和箭头。

tutorial.combate.intro.title = 两个生物准备好了
tutorial.combate.intro.body = 符爪熊和罗堰妖精已经在场一个回合了，可以进攻了。对面有一只 2/2 的风龙兽可以阻挡。
tutorial.combate.go.title = 进入战斗
tutorial.combate.go.body = 进攻要在专门的步骤里宣告。按大按钮（或空格），一直按到轨道走到"攻击者"。
tutorial.combate.declare.title = 选择谁进攻
tutorial.combate.declare.body = 点击你的生物：进攻的生物会向中线前进，并出现一支指向对手的箭头。也可以把生物拖到对手的头像上。选好后按大按钮确认。
tutorial.combate.arrows.title = 箭头把一切都说清楚了
tutorial.combate.arrows.body = 每个攻击者都有一支箭头指向它攻击的目标。对手阻挡后，每个阻挡者也会有一支箭头指向它挡住的那个攻击者。
tutorial.combate.blocks.title = 现在轮到对手阻挡
tutorial.combate.blocks.body = 按大按钮，让对手来决定。凡是被挡住的，都不会打到对手本人：它们会互相战斗。
tutorial.combate.damage.title = 伤害
tutorial.combate.damage.body = 没被阻挡的会扣掉对手的生命，你会看到它在对方信息栏上变化。生物身上的伤害会一直标记到回合结束；如果达到它的防御力，它就会死。右键点击可以看到它身上有多少伤害。
tutorial.combate.blocking.title = 轮到对手打你的时候
tutorial.combate.blocking.body = 阻挡需要点两下，而且顺序很重要：先点你想挡在它前面的那个攻击者，再点你的生物。要撤销一个阻挡者，同样再点这两下。
tutorial.combate.why.title = 如果按了没反应
tutorial.combate.why.body = 有时候引擎会拒绝你刚才的宣告（比如某个生物被迫进攻、某个生物需要两个阻挡者才能被挡……）。这种时候，原因会显示在你刚按的按钮下方，并点名是哪张牌造成的。按钮没反应的话，去那里看看。
tutorial.combate.end.title = 第二节课完成
tutorial.combate.end.body = 进攻、阻挡、看懂箭头都会了。剩下的是真正决定胜负的东西：异能和瞬间法术。

tutorial.trucos.intro.title = 会做事的牌
tutorial.trucos.intro.body = 桌面上有一张放荡烈焰术士。除了是个生物之外，它还有一个可以激活的异能：横置它，对任意目标造成 1 点伤害。
tutorial.trucos.activate.title = 激活它的异能
tutorial.trucos.activate.body = 点击放荡烈焰术士。当一张牌有好几件事能做时，会弹出一个菜单列出全部选项，付不起代价的会标出来。选中这个异能，再点对手的头像把它指向对方。
tutorial.trucos.targets.title = 选择目标
tutorial.trucos.targets.body = 需要目标的时候，所有能选的对象都会高亮，并且会画出一条从来源到目标的曲线箭头。目标可以在任何地方：牌桌、坟场或放逐区。如果目标在一个关闭的区域里，游戏会替你打开它，方便你点击里面的牌。
tutorial.trucos.instant.title = 施放一个瞬间
tutorial.trucos.instant.body = 你手里有一张闪电击。瞬间法术可以在你拥有优先权的任何时候施放：你的回合、对手的回合，甚至堆叠上还有东西等着结算的时候。想打谁就打谁。
tutorial.trucos.stops.title = 在对手回合暂停
tutorial.trucos.stops.body = 为了不用一直按确定，游戏会在你没什么可做的时候自动帮你让过优先权。如果你想在某个特定时刻停下来，点轨道上的一个阶段：这样就设好了一个停靠点，游戏会在那里把优先权交给你。点一个试试（再点一次可以取消）。
tutorial.trucos.commander.title = 指挥区
tutorial.trucos.commander.body = 手牌右边就是指挥区，你的指挥官住在那里。你从那里施放它，而且每次重新施放都要多付 {2}：旁边会显示这笔额外费用。在指挥官赛制里，如果同一个指挥官总共对你造成 21 点伤害你也会输，这个数字就在你的信息栏上。
tutorial.trucos.undo.title = 撤销
tutorial.trucos.undo.body = Ctrl+Z 可以撤销上一步，只要引擎允许——也就是任何经过堆叠的操作。打地没法撤销，因为它根本不经过堆叠。所以打地之前最好先看清楚。
tutorial.trucos.pause.title = Esc 与设置
tutorial.trucos.pause.body = Esc 打开暂停菜单：继续、设置、重新开始和退出。按一下，然后进入「设置」：里面有不少会改变游戏玩法的选项，不去动它们游戏也照样能玩，所以自己很难发现。看完之后，随时按 Esc 回到对局就行。
tutorial.trucos.settings.title = 在设置里能改什么
tutorial.trucos.settings.body = 设置里可以决定：法术力是否自动支付、没事可做时是否自动让过优先权、在对手回合的哪些时候停下、把 AI 放慢多少（AI 几毫秒就能算完一个回合，不放慢的话你会看不清它做了什么）、离开自己的主要阶段前是否询问，以及界面大小、语言和音量。同样的设置在对局之外也能用 Esc 打开。
tutorial.trucos.end.title = 你已经会玩了
tutorial.trucos.end.body = 右键读牌、Ctrl+滚轮放大、点击或拖动来打牌和进攻、激活异能、用瞬间法术回应、想停就停。这些就是全部的操作。剩下的都写在卡牌上，它们自带说明文字。祝你玩得开心。

