# El tutorial en Android: los pasos que hablan de gestos (decision 478 de Android)
tutorial.mesa.you.body.android = Ta plaque, en bas à gauche à côté de ta main : nom, vie et le mana que tu as en réserve. Tes piles (bibliothèque, cimetière et exil) sont sur le bord gauche de ta moitié de table, chacune avec son nombre. Quand ta plaque s'allume, c'est ton tour.
tutorial.mesa.rival.body.android = La plaque de l'adversaire, en haut au centre. Sa main se voit sous forme de nombre, pas de cartes. Dans une partie à trois ou à quatre, les autres adversaires apparaissent comme des pastilles à gauche de la bande du haut : touche-les pour regarder chacun d'eux.
tutorial.mesa.zoom.body.android = Les cartes sur la table sont petites pour qu'elles tiennent toutes. Pour en lire une, GARDE le doigt APPUYÉ dessus : elle s'affiche en grand, avec ce que l'image ne dit pas (sa force actuelle, les marqueurs, ce qui lui est attaché). Fais glisser pour passer à la suivante et touche à côté pour la fermer. Dans ta main, touche deux fois la carte. Essaie avec n'importe quelle carte de la table.
tutorial.mesa.board.body.android = Quand la table se remplit, les cartes rétrécissent. PINCE avec deux doigts pour zoomer sur la table, et bouge les deux doigts pour t'y déplacer. Le bouton «Annuler le zoom», en bas à gauche, te ramène à la table entière. Pince pour zoomer.
tutorial.mesa.phases.body.android = En haut à droite, il y a le rail avec les étapes du tour : dégagement, entretien, pioche, phase principale, combat, deuxième phase principale et fin. Celle qui est allumée, c'est l'actuelle. Plus tard tu verras qu'en le touchant on pose des arrêts.
tutorial.mesa.button.body.android = En bas à droite, au-dessus de ta main, il y a un texte et un grand bouton. Le texte dit ce qu'on attend de toi ; le bouton dit ce qui va se passer quand tu appuies («Passer», «Finir le tour», «Pas de blocage»...). C'est le seul endroit avec des boutons qui agissent sur la partie : tout le reste ne fait qu'informer.
tutorial.mesa.land.body.android = Tu as une Forêt en main. FAIS-LA GLISSER de ta main sur la table : pose le doigt dessus, remonte-la au-dessus de ta main et lâche-la sur la table. Toucher une carte de ta main ne fait que la montrer. Les terrains donnent le mana et tu ne peux en jouer qu'UN par tour. Attention : jouer un terrain fait partie des rares choses qu'on ne peut pas annuler.
tutorial.mesa.cast.body.android = Fais glisser le Runeclaw Bear de ta main sur la table. Le mana se paie tout seul. Si une carte ne peut pas être lancée tout de suite, elle revient dans ta main quand tu la lâches.
tutorial.mesa.stack.body.android = Ce que tu lances n'arrive pas directement sur la table : ça passe d'abord par le stack, où les deux joueurs peuvent répondre. Quand personne ne fait rien, ce qui est en haut se résout. Tant qu'il y a quelque chose dans le stack, une pastille apparaît sur le bord droit de la table : touche-la pour voir ce qu'il y a.
tutorial.mesa.zones.body.android = Tes piles (bibliothèque, cimetière et exil) sont sur le bord gauche de ta moitié de table : touche-en une et son contenu s'ouvre. Celles de l'adversaire, pareil sur sa moitié. La bibliothèque s'affiche face cachée : c'est une information cachée et la visionneuse ne la dévoile pas. Ouvre une zone, n'importe laquelle.
tutorial.mesa.log.body.android = En haut à droite, le bouton ≡ ouvre le menu de la table, et le Journal est dedans : ce que chacun a fait, tour par tour. C'est là qu'on regarde quand l'adversaire fait quelque chose et que tu n'as pas eu le temps de le lire. Ouvre-le.
tutorial.combate.go.body.android = Les attaques se déclarent à leur étape. Appuie sur le grand bouton jusqu'à ce que le rail en haut arrive à «Déclarer les attaquants».
tutorial.combate.declare.body.android = Touche tes créatures : celles qui attaquent avancent et reçoivent une flèche vers l'adversaire. Tu peux aussi faire glisser une créature sur la plaque de l'adversaire. Quand c'est bon, appuie sur le grand bouton pour confirmer ; la première fois, il demande une deuxième touche, pour que tu n'attaques pas sans le vouloir.
tutorial.combate.damage.body.android = Ce qui n'a pas été bloqué fait baisser la vie de l'adversaire, et tu la vois changer sur sa plaque. Les blessures infligées aux créatures restent marquées jusqu'à la fin du tour ; si elles atteignent leur endurance, elles meurent. Garde le doigt appuyé sur une carte pour voir combien elle en a reçu.
tutorial.combate.blocking.body.android = Pour bloquer, touche d'abord l'attaquant devant lequel tu veux te mettre, puis ta créature, ou fais glisser ta créature sur l'attaquant. L'ORDRE compte. Pour retirer un bloqueur, refais la même chose.
tutorial.trucos.activate.body.android = Touche le Prodigal Pyromancer. Si une carte peut faire plusieurs choses, un menu les affiche toutes, et celles que tu ne peux pas payer sont marquées. Choisis la capacité puis touche la plaque de l'adversaire pour le cibler.
tutorial.trucos.targets.body.android = Quand quelque chose demande une cible, ce qu'on peut choisir est mis en valeur et une flèche va de la source à la destination. Les cibles peuvent être n'importe où : sur la table, dans un cimetière ou en exil. Si elles sont dans une zone fermée, le jeu te l'ouvre pour que tu touches dedans.
tutorial.trucos.aura.body.android = Dans ta main il y a une Curse of the Pierced Heart : une AURA qui ne va pas sur une créature mais sur un JOUEUR (« Enchanter : joueur »). Fais-la glisser sur la table et, quand elle demande une cible, touche la PLAQUE de l'adversaire (en haut au centre), pas une carte. Dès lors, elle lui inflige 1 blessure au début de chacun de ses tours. Lance-la sur l'adversaire.
tutorial.trucos.instant.body.android = Tu as un Lightning Bolt en main. Un éphémère peut se lancer à tout moment où tu as la priorité : pendant ton tour, pendant celui de l'adversaire, et même avec quelque chose en attente dans le stack. Fais-le glisser sur la table et choisis sur quoi tu le lances.
tutorial.trucos.stops.body.android = Pour que tu n'aies pas à appuyer sur OK mille fois, le jeu te passe la priorité tout seul quand tu ne peux rien faire. Si tu veux attendre un moment précis, TOUCHE LE RAIL en haut : les étapes du tour s'ouvrent, pour tes tours et pour ceux des adversaires. Touche une étape pour y poser un arrêt et appuie sur Accepter : c'est là que le jeu te donnera la priorité. Essaie (et retire-le de la même façon).
tutorial.trucos.commander.body.android = Sur le bord gauche de ta moitié de table, à côté de tes piles, se trouve la zone de commande, où vit ton commandant. Tu le lances en le touchant, et chaque fois que tu le relances il coûte {2} de plus : la taxe s'affiche à côté. En Commander tu perds aussi si UN commandant t'inflige 21 blessures au total, et ce compteur est sur ta plaque.
tutorial.trucos.undo.body.android = Quand la dernière action peut être annulée, le deuxième bouton, à côté du grand, affiche «Annuler» : il annule ce qui est passé par le stack. Jouer un terrain NE peut PAS être annulé, parce que ça ne passe pas par là. C'est pour ça qu'il vaut mieux regarder avant de lâcher un terrain.
tutorial.trucos.pause.body.android = Le bouton ≡, en haut à droite, ouvre le menu de la table : journal, paramètres et quitter. Tant qu'il est ouvert, la partie est en pause. Touche-le et entre dans les PARAMÈTRES : il y a là-dedans des choses qui changent ta façon de jouer et que tu ne découvriras pas tout seul, parce que le jeu marche pareil sans y toucher. Jette un œil et reviens à la partie quand tu veux.
tutorial.trucos.settings.body.android = Dans les Paramètres, tu décides si le mana se paie tout seul, si la priorité passe toute seule quand tu n'as rien à faire, à quels moments t'arrêter pendant le tour de l'adversaire, à quel point ralentir l'IA (elle résout son tour en quelques millisecondes et sans la freiner tu rates ce qu'elle fait), s'il faut te demander avant de quitter ta phase principale, la taille des cartes, la langue et le volume. Les mêmes paramètres sont aussi dans le menu principal.
tutorial.trucos.end.body.android = Lire une carte en gardant le doigt appuyé, zoomer sur la table en pinçant, jouer en faisant glisser depuis la main, attaquer en touchant ou en faisant glisser, activer des capacités, répondre avec des éphémères et t'arrêter où tu veux. Ce sont toutes les commandes. Le reste, ce sont les cartes qui le racontent, avec leur texte écrit dessus. Amuse-toi bien.
tutorial.mesa.zoom.title.android = Lire une carte : appui long
tutorial.mesa.board.title.android = Zoomer sur la table : pincer
tutorial.trucos.pause.title.android = Le menu ≡ et les Réglages

