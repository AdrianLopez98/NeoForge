# Apoyar el proyecto (SettingsPanel.supportCard)
settings.tab.support = Soutenir
support.title = Soutenir Neo Forge
support.text1 = Bonjour ! Neo Forge est gratuit, sans publicités ni achats intégrés. Je développe son interface seul, avec beaucoup d’amour, par-dessus le moteur de Forge, sans lequel rien de tout cela ne serait possible. Chaque correction, chaque nouveau mode et chaque nouvelle extension demandent de nombreuses heures de travail, et beaucoup des meilleures idées viennent de ce que vous me dites sur itch.io et Discord.
support.text2 = Si vous vous amusez et avez envie de me donner un coup de main, un petit don m’aide énormément à continuer d’y consacrer du temps et à faire arriver les mises à jour. C’est entièrement facultatif, et chaque soutien, même petit, me fait vraiment plaisir.
