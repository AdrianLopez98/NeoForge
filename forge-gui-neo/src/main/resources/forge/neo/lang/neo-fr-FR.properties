phase.ask.combatTitle = Passer à la phase de combat ?
phase.ask.combatDetail = Tu quittes ta phase principale. Jusqu'après le combat, tu ne pourras plus jouer de terrain ni lancer de créature ou de rituel.
phase.ask.combatGo = Aller au combat
phase.ask.endTitle = Terminer ta phase principale ?
