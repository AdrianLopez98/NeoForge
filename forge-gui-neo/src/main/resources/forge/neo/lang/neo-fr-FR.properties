tutorial.mesa.title = La table et ton tour
tutorial.mesa.summary = Qui est qui, comment lire une carte, comment zoomer sur la table, et un tour complet : terrain, sort et stack.
tutorial.combate.title = Le combat
tutorial.combate.summary = Attaquer, bloquer et comprendre les flèches. Et que faire quand le moteur ne te laisse pas terminer.
tutorial.trucos.title = Capacités, éphémères et commandant
tutorial.trucos.summary = Activer une capacité, choisir une cible, t'arrêter pendant le tour du rival et la zone de commande.

tutorial.mesa.welcome.title = Ceci est une partie d'entraînement
tutorial.mesa.welcome.body = Tu es sur une table préparée pour t'entraîner : rien de ce qui se passe ici n'est enregistré. Lis et fais ce que chaque étape demande ; une étape d'action avance toute seule dès que tu la fais. Tu peux partir quand tu veux avec "Quitter le tutoriel", ici en haut.
tutorial.mesa.you.title = C'est toi, en bas
tutorial.mesa.you.body = Ta barre : nom, vie, le mana que tu as en réserve, et un compteur pour chaque zone (main, bibliothèque, cimetière, exil, commande). Quand elle s'allume, c'est ton tour.
tutorial.mesa.rival.title = Ton adversaire, en haut
tutorial.mesa.rival.body = La même barre de l'autre côté. Sa main s'affiche comme un nombre, pas comme des cartes. Dans une partie à trois ou quatre, des onglets apparaissent en haut pour regarder chaque adversaire.
tutorial.mesa.zoom.title = Lire une carte : clic DROIT
tutorial.mesa.zoom.body = Les cartes sur la table sont petites exprès, pour qu'elles tiennent toutes. Pour en lire une, clic droit dessus : elle apparaît en grand, avec ce que l'image ne dit pas (sa force actuelle, ses compteurs, ce qui lui est attaché). Un clic gauche n'importe où la referme. Essaie sur n'importe quelle carte.
tutorial.mesa.board.title = Zoomer sur la table : Ctrl + molette
tutorial.mesa.board.body = Avec une table pleine, les cartes rétrécissent. Ctrl + molette de la souris zoome et dézoome, en gardant fixe ce qui est sous le pointeur. Une fois zoomé, le bouton central (ou Ctrl + glisser) déplace la table, et la pastille dans le coin te ramène à la table entière. Fais un tour de molette avec Ctrl enfoncé.
tutorial.mesa.phases.title = Un tour se déroule en phases
tutorial.mesa.phases.body = Le rail à droite montre les étapes du tour, de haut en bas : dégagement, entretien, pioche, phase principale, combat, deuxième phase principale et fin. Celle qui est allumée, c'est celle où tu es maintenant. Plus tard tu verras qu'on peut aussi cliquer dessus.
tutorial.mesa.button.title = Ce que le jeu attend de toi
tutorial.mesa.button.body = Sous le rail il y a une ligne de texte et un gros bouton. Le texte dit ce qu'on attend de toi ; le bouton dit ce qui va se passer si tu appuies dessus ("Passer", "Terminer le tour", "Ne pas bloquer"...). La barre d'espace l'active. C'est le seul endroit de l'écran avec des boutons qui agissent sur la partie : tout le reste ne fait qu'informer.
tutorial.mesa.land.title = Joue un terrain
tutorial.mesa.land.body = Tu as une Forêt dans ta main. Fais-la glisser de ta main vers la table, ou clique simplement dessus. Les terrains sont d'où vient le mana, et tu ne peux en jouer qu'UN par tour. Attention : jouer un terrain est l'une des rares choses qui ne peuvent pas être annulées.
tutorial.mesa.mana.title = Tu as du mana maintenant
tutorial.mesa.mana.body = Le voilà, dans ta rangée arrière. Payer un sort tape des terrains, et le jeu le fait pour toi au moment de le lancer (tu peux changer ça dans les paramètres). Ils se dégagent à nouveau au début de ton tour.
tutorial.mesa.cast.title = Lance une créature
tutorial.mesa.cast.body = Fais glisser l'Ours runegriffe de ta main vers la table, ou clique dessus. Le mana est payé automatiquement. Si une carte ne peut pas être lancée maintenant, cliquer dessus ne fait simplement rien.
tutorial.mesa.stack.title = Le stack
tutorial.mesa.stack.body = Ce que tu lances n'arrive pas directement sur la table : ça passe d'abord par le stack - la liste à droite - et les deux joueurs peuvent y répondre. Quand personne ne fait rien, ce qui est en haut se résout. Le grand bandeau au centre est un reflet du stack : s'il y a quelque chose, tu le vois ; quand ça se vide, il disparaît. Et un clic l'écarte.
tutorial.mesa.sick.title = Mal d'invocation
tutorial.mesa.sick.body = La créature qui vient d'arriver paraît estompée : ce tour-ci elle ne peut ni attaquer ni utiliser de capacités qui demandent de la taper. Dès ton tour suivant, elle le pourra. Les terrains n'ont pas ce problème.
tutorial.mesa.zones.title = Regarder dans une zone
tutorial.mesa.zones.body = Les compteurs de ta barre (main, bibliothèque, cimetière, exil, commande) se cliquent et ouvrent ce qu'il y a dedans ; les grosses piles sur la table font pareil. La bibliothèque apparaît face cachée : c'est une information cachée et le visualiseur ne la révèle pas. Ouvre une zone, n'importe laquelle.
tutorial.mesa.log.title = Ce qui s'est passé
tutorial.mesa.log.body = En bas à gauche il y a un bouton de journal : ce que chacun a fait, tour par tour, avec le tien en gras. C'est là que tu regardes quand le rival fait quelque chose et que tu n'as pas eu le temps de le lire. Ouvre-le.
tutorial.mesa.end.title = Première leçon terminée
tutorial.mesa.end.body = Tu sais maintenant lire la table, t'y déplacer et jouer ton tour. La prochaine fois : le combat - attaquer, bloquer et les flèches.

tutorial.combate.intro.title = Deux créatures prêtes
tutorial.combate.intro.body = L'Ours runegriffe et les Elfes de Llanowar sont sur la table depuis un tour, donc ils peuvent attaquer. En face, il y a un Drakôn des vents 2/2 qui peut bloquer.
tutorial.combate.go.title = Va au combat
tutorial.combate.go.body = Les attaques se déclarent dans leur propre étape. Appuie sur le gros bouton (ou espace) jusqu'à ce que le rail arrive à "Attaquants".
tutorial.combate.declare.title = Choisis qui attaque
tutorial.combate.declare.body = Clique tes créatures : celles qui attaquent avancent vers la ligne du milieu et une flèche pointe vers ton adversaire. Tu peux aussi faire glisser une créature sur son portrait. Quand tu es prêt, appuie sur le gros bouton pour confirmer.
tutorial.combate.arrows.title = Les flèches racontent tout
tutorial.combate.arrows.body = Une flèche part de chaque attaquant vers ce qu'il attaque. Quand l'adversaire bloque, une autre flèche part de chaque bloqueur vers l'attaquant qu'il affronte.
tutorial.combate.blocks.title = Maintenant l'adversaire bloque
tutorial.combate.blocks.body = Appuie sur le gros bouton et laisse-le décider. Ce qu'il bloque ne touche pas le joueur : ces créatures se battent entre elles à la place.
tutorial.combate.damage.title = Les dégâts
tutorial.combate.damage.body = Tout ce qui n'est pas bloqué fait baisser la vie de l'adversaire, et tu le verras changer sur sa barre. Les dégâts sur les créatures restent marqués jusqu'à la fin du tour ; s'ils atteignent leur endurance, elles meurent. Le clic droit montre combien elles en portent.
tutorial.combate.blocking.title = Quand on t'attaque
tutorial.combate.blocking.body = Bloquer se fait en deux clics et l'ORDRE compte : d'abord l'attaquant devant lequel tu veux te mettre, puis ta créature. Pour retirer un bloqueur, les deux mêmes clics à nouveau.
tutorial.combate.why.title = Si tu appuies et que rien ne se passe
tutorial.combate.why.body = Parfois le moteur refuse ce que tu as déclaré (une créature obligée d'attaquer, une autre qui a besoin de deux bloqueurs...). Quand ça arrive, la raison apparaît SOUS le bouton que tu viens d'appuyer, et nomme la carte responsable. Si le bouton ne réagit pas, regarde là.
tutorial.combate.end.title = Deuxième leçon terminée
tutorial.combate.end.body = Attaquer, bloquer et lire les flèches. Il reste ce qui décide des parties : les capacités et les éphémères.

tutorial.trucos.intro.title = Des cartes qui font des choses
tutorial.trucos.intro.body = Tu as un Pyromancien sybarite sur la table. En plus d'être une créature, il a une capacité que tu peux activer : le taper pour infliger 1 dégât à ce que tu veux.
tutorial.trucos.activate.title = Active sa capacité
tutorial.trucos.activate.body = Clique le Pyromancien sybarite. Quand une carte a plusieurs choses à faire, un menu les montre toutes, avec celles que tu ne peux pas payer marquées. Choisis la capacité, puis clique le portrait de l'adversaire pour la lui envoyer.
tutorial.trucos.targets.title = Choisir des cibles
tutorial.trucos.targets.body = Quand quelque chose a besoin d'une cible, tout ce que tu peux choisir est surligné et une flèche courbe part de la source vers la cible. Les cibles peuvent être n'importe où : la table, un cimetière ou l'exil. Si elles sont dans une zone fermée, le jeu te l'ouvre pour que tu puisses cliquer dedans.
tutorial.trucos.instant.title = Lance un éphémère
tutorial.trucos.instant.body = Tu as une Foudre dans ta main. Un éphémère peut être lancé à tout moment où tu as la priorité : pendant ton tour, pendant celui de l'adversaire, même avec quelque chose qui attend sur le stack. Lance-la sur ce que tu veux.
tutorial.trucos.stops.title = T'arrêter pendant le tour du rival
tutorial.trucos.stops.body = Pour que tu n'aies pas à cliquer sur OK mille fois, le jeu te passe la priorité tout seul quand tu ne peux rien faire. Si tu veux attendre un moment précis, CLIQUE UNE PHASE sur le rail : ça pose une pause et le jeu te redonnera la priorité à ce moment-là. Clique-en une pour essayer (et reclique dessus pour la retirer).
tutorial.trucos.commander.title = La zone de commande
tutorial.trucos.commander.body = À droite de ta main se trouve la zone de commande, où vit ton commandant. Tu le lances depuis là, et chaque fois que tu le relances ça coûte {2} de plus : la taxe s'affiche à côté. En Commander tu perds aussi la partie si UN commandant t'inflige 21 dégâts au total, et ce compteur est sur ta barre.
tutorial.trucos.undo.title = Annuler
tutorial.trucos.undo.body = Ctrl+Z annule la dernière action tant que le moteur le permet, c'est-à-dire tout ce qui est passé par le stack. Jouer un terrain ne PEUT PAS être annulé, parce que ça n'y passe jamais. C'est pour ça qu'il vaut mieux réfléchir avant de poser un terrain.
tutorial.trucos.pause.title = Échap et paramètres
tutorial.trucos.pause.body = Échap ouvre le menu de pause : reprendre, paramètres, recommencer et quitter. Appuie dessus et entre dans les PARAMÈTRES : il y a pas mal de choses qui changent la façon de jouer et que personne ne découvre tout seul, parce que le jeu marche très bien sans y toucher. Regarde, et reviens à la partie avec Échap quand tu veux.
tutorial.trucos.settings.title = Ce que tu peux y changer
tutorial.trucos.settings.body = Dans les paramètres tu décides : si le mana se paie tout seul, si la priorité passe toute seule quand tu n'as rien à faire, à quels moments s'arrêter pendant le tour de l'adversaire, de combien ralentir l'IA - elle résout son tour en quelques millisecondes, et sans la ralentir tu rates ce qu'elle fait -, s'il faut demander avant de quitter ta phase principale, la taille de l'interface, la langue et le volume. Les mêmes paramètres existent hors partie, avec Échap aussi.
tutorial.trucos.end.title = Tu sais jouer maintenant
tutorial.trucos.end.body = Lire une carte avec le clic droit, zoomer avec Ctrl+molette, jouer et attaquer en cliquant ou en glissant, activer des capacités, répondre avec des éphémères et t'arrêter où tu veux. Ce sont tous les contrôles. Le reste est écrit sur les cartes, avec leur texte dessus. Amuse-toi bien.

