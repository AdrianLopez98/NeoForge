ascent.event.shrine.title = LE SANCTUAIRE FENDU
ascent.event.shrine.text = Une pierre brisée, avec quelque chose qui brille dedans. La fente est juste assez large pour un bras, et les bords n'ont pas l'air aimables.
ascent.event.gambler.title = LE JOUEUR
ascent.event.gambler.text = Il a installé sa table au milieu du chemin et bat les cartes sans les regarder. Il dit que la banque perd toujours. Il sourit en le disant.
ascent.event.chest.title = LE COFFRE PIÉGÉ
ascent.event.chest.text = Fermé par un mécanisme que tu ne comprendras pas à temps. Quelque chose remue à l'intérieur, et le métal garde les marques des autres.
ascent.event.collector.title = LE COLLECTIONNEUR
ascent.event.collector.text = Ni ton argent ni ton sang ne l'intéressent : il veut une carte, n'importe laquelle, et il paie bien. Il insiste pour que tu choisisses.
ascent.event.campfire.title = LE FEU DE CAMP OUBLIÉ
ascent.event.campfire.text = Quelqu'un l'a laissé brûler et s'en est allé. De quoi se réchauffer un moment, ou brûler ce qui ne te sert plus.
ascent.event.echo.title = L'ÉCHO DU PLAN
ascent.event.echo.text = L'air répète tes pensées une demi-seconde plus tard. Laisse-le faire et il t'apprend quelque chose — mais il fait payer.
ascent.event.fountain.title = LA FONTAINE
ascent.event.fountain.text = Eau immobile, sans fond visible. Le propriétaire fait payer la gorgée et n'explique rien.
