ascent.event.armory.title = L'ARSENAL ABANDONNÉ
ascent.event.armory.text = Les portes sont grandes ouvertes et il ne reste personne. Ce qu'il y a dedans est à qui passe.
ascent.event.smith.title = LE FORGERON
ascent.event.smith.text = Il travaille le métal des choses dont plus personne ne veut. Il vend peu, cher, et il sait ce que ça vaut.
ascent.event.nest.title = LE NID
ascent.event.nest.text = Des œufs gros comme ta tête, et quelque chose de grand qui tourne au-dessus. Personne n'a dit que ce serait gratuit.
ascent.event.crossroads.title = LE CARREFOUR
ascent.event.crossroads.text = Un coin tranquille pour s'arrêter, et un tas de bric-à-brac laissé au bord. Pas le temps pour les deux.
ascent.event.mirage.title = LE MIRAGE
ascent.event.mirage.text = La route traverse quelque chose qui est là puis ne l'est plus. Ça passera ou ça ne passera pas, impossible de le savoir avant.
ascent.event.pact.title = LE PACTE
ascent.event.pact.text = Il t'offre quelque chose de vraiment bien. Le prix n'est ni l'argent ni le sang : c'est ce que tu pourras encaisser désormais.
ascent.event.lender.title = LE PRÊTEUR
ascent.event.lender.text = Il prête ce que tu veux et encaisse sur-le-champ. Jamais en argent.
ascent.event.statue.title = LA STATUE
ascent.event.statue.text = Quelqu'un l'a dressée ici il y a longtemps. Elle a encore ses incrustations, et elle écoute encore.
ascent.event.wanderer.title = LE VAGABOND
ascent.event.wanderer.text = Des jours sans manger, des semaines de marche. Il ne demande rien, mais il regarde ta besace.
ascent.event.well.title = LE PUITS À SOUHAITS
ascent.event.well.text = Plein de pièces de ceux qui sont passés avant. Il paraît qu'une fois, quelqu'un en a sorti plus qu'il n'y avait mis.
ascent.event.hermit.title = L'ERMITE
ascent.event.hermit.text = Il vit ici depuis avant la route. Il dit que tu voyages chargé, et il ne parle pas du sac.
ascent.event.teacher.title = LA MAÎTRESSE
ascent.event.teacher.text = Deux pas à te regarder marcher et elle sait tout ce que tu fais mal. Elle propose d'y remédier. À sa façon.
