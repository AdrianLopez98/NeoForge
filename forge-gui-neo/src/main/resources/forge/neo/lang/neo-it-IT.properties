menu.tutorial.note = serve per conoscere i comandi dentro una partita
menu.tutorial.done = tutte e tre le lezioni fatte - puoi rifarle

tutorial.title = Tutorial
tutorial.welcome = Benvenuto. Prima di giocare sul serio, tre lezioni brevi sui comandi di una partita. Non serve sapere giocare a Magic: qui si impara solo a usare il tavolo.
tutorial.progress = {0} di {1} lezioni fatte
tutorial.play = Gioca: {0}
tutorial.reset = Ricomincia da capo
tutorial.lessonDone = fatta - puoi rifarla
tutorial.lessonSteps = {0} passaggi
tutorial.counter = TUTORIAL  -  {0}  -  passaggio {1} di {2}
tutorial.next = Avanti
tutorial.skip = Salta questo passaggio
tutorial.quit = Esci dal tutorial
tutorial.waiting = Fai quello che dice qui sopra e il passaggio va avanti da solo.
tutorial.done = Fatto.

tutorial.mesa.title = Il tavolo e il tuo turno
tutorial.mesa.summary = Chi è chi, come leggere una carta, come ingrandire il tavolo, e un turno intero: terra, magia e stack.
tutorial.combate.title = Il combattimento
tutorial.combate.summary = Attaccare, bloccare e leggere le frecce. E cosa fare quando il motore non ti lascia finire.
tutorial.trucos.title = Abilità, istantanei e comandante
tutorial.trucos.summary = Attivare un'abilità, scegliere i bersagli, fermarti nel turno del rivale e la zona di comando.

tutorial.mesa.welcome.title = Questa è una partita di prova
tutorial.mesa.welcome.body = Sei su un tavolo preparato per esercitarti: qualsiasi cosa succeda qui non viene salvata. Leggi e fai quello che ti si chiede; un passaggio d'azione va avanti da solo appena lo fai. Puoi uscire quando vuoi con "Esci dal tutorial", qui sopra.
tutorial.mesa.you.title = Quello in basso sei tu
tutorial.mesa.you.body = La tua barra: nome, vita, il mana che hai in sospeso e un contatore per ogni zona (mano, grimorio, cimitero, esilio, comando). Quando si accende, è il tuo turno.
tutorial.mesa.rival.title = Il tuo avversario, in alto
tutorial.mesa.rival.body = La stessa barra dall'altra parte. La sua mano si vede come un numero, non come carte. In una partita a tre o quattro, in alto compaiono delle schede per guardare ogni avversario.
tutorial.mesa.zoom.title = Leggere una carta: clic DESTRO
tutorial.mesa.zoom.body = Le carte sul tavolo sono piccole apposta, così entrano tutte. Per leggerne una, clic destro sopra: compare grande, insieme a ciò che l'immagine non dice (la sua forza attuale, i segnalini, cosa ha attaccato sopra). Un clic sinistro in qualsiasi punto la chiude. Provalo su una carta qualsiasi.
tutorial.mesa.board.title = Ingrandire il tavolo: Ctrl + rotellina
tutorial.mesa.board.body = Con il tavolo pieno le carte si rimpiccioliscono. Ctrl + rotellina del mouse ingrandisce e rimpicciolisce, tenendo fermo ciò che sta sotto il puntatore. Ingrandito, il pulsante centrale del mouse (o Ctrl + trascina) sposta il tavolo, e il pulsante nell'angolo ti riporta al tavolo intero. Gira la rotellina tenendo premuto Ctrl.
tutorial.mesa.phases.title = Un turno si svolge per fasi
tutorial.mesa.phases.body = Il binario a destra sono i passaggi del turno, dall'alto in basso: stap, mantenimento, pesca, prima fase principale, combattimento, seconda fase principale e finale. Quello acceso è dove ti trovi adesso. Più avanti vedrai che si possono anche cliccare.
tutorial.mesa.button.title = Cosa ti chiede il gioco
tutorial.mesa.button.body = Sotto il binario c'è una riga di testo e un pulsante grande. Il testo dice cosa ci si aspetta da te; il pulsante dice cosa succederà se lo premi ("Passa", "Fine turno", "Nessun blocco"...). La barra spaziatrice lo preme. È l'unico punto dello schermo con pulsanti che agiscono sulla partita: tutto il resto informa soltanto.
tutorial.mesa.land.title = Gioca una terra
tutorial.mesa.land.body = Nella mano hai una Foresta. Trascinala dalla mano al tavolo, oppure cliccala. Le terre sono da dove arriva il mana, e se ne può giocare UNA sola per turno. Attenzione: giocare una terra è una delle poche cose che non si possono annullare.
tutorial.mesa.mana.title = Ora hai mana
tutorial.mesa.mana.body = Eccolo, nella tua fila posteriore. Per pagare una magia si tappano le terre, e lo fa il gioco per te quando lanci (puoi cambiarlo in Impostazioni). Si stappano di nuovo all'inizio del tuo turno.
tutorial.mesa.cast.title = Lancia una creatura
tutorial.mesa.cast.body = Trascina l'Orso di Runeclaw dalla mano al tavolo, oppure cliccalo. Il mana si paga da solo. Se una carta non può essere lanciata in questo momento, cliccarla semplicemente non fa nulla.
tutorial.mesa.stack.title = Lo stack
tutorial.mesa.stack.body = Ciò che lanci non arriva subito sul tavolo: prima passa per lo stack - la lista a destra - e lì entrambi i giocatori possono rispondere. Quando nessuno fa niente, si risolve quello in cima. Il cartello grande al centro è uno specchio dello stack: se c'è qualcosa, lo vedi; quando si svuota, sparisce. E si mette da parte con un clic.
tutorial.mesa.sick.title = Malattia da evocazione
tutorial.mesa.sick.body = La creatura appena arrivata appare spenta: questo turno non può attaccare né usare abilità che richiedono di tapparla. Dal tuo prossimo turno, sì. Le terre non hanno questo problema.
tutorial.mesa.zones.title = Guardare dentro una zona
tutorial.mesa.zones.body = I contatori della tua barra (mano, grimorio, cimitero, esilio, comando) si possono cliccare per aprire cosa c'è dentro; le pile grandi sul tavolo fanno lo stesso. Il grimorio compare coperto: è informazione nascosta e il visualizzatore non la svela. Apri una zona qualsiasi.
tutorial.mesa.log.title = Cosa è successo
tutorial.mesa.log.body = In basso a sinistra c'è un pulsante di registro: cosa ha fatto ciascuno, turno per turno, con il tuo in grassetto. È dove guardare quando il rivale fa qualcosa e non hai fatto in tempo a leggerlo. Aprilo.
tutorial.mesa.end.title = Prima lezione fatta
tutorial.mesa.end.body = Ormai sai leggere il tavolo, muoverti e giocare il tuo turno. Nella prossima, il combattimento: attaccare, bloccare e le frecce.

tutorial.combate.intro.title = Due creature pronte
tutorial.combate.intro.body = L'Orso di Runeclaw e gli Elfi di Llanowar sono sul tavolo da un turno, quindi possono già attaccare. Di fronte c'è un Drago del Vento 2/2 che può bloccare.
tutorial.combate.go.title = Vai al combattimento
tutorial.combate.go.body = Gli attacchi si dichiarano nel loro passaggio. Premi il pulsante grande (o spazio) finché il binario non arriva a "Dichiara attaccanti".
tutorial.combate.declare.title = Scegli chi attacca
tutorial.combate.declare.body = Clicca le tue creature: quelle che attaccano avanzano verso la linea centrale e gli spunta una freccia verso il rivale. Puoi anche trascinare una creatura sul suo ritratto. Quando sei soddisfatto, premi il pulsante grande per confermare.
tutorial.combate.arrows.title = Le frecce raccontano tutto
tutorial.combate.arrows.body = Una freccia va da ogni attaccante a ciò che attacca. Quando il rivale blocca, spunta un'altra freccia da ogni bloccante all'attaccante davanti al quale si mette.
tutorial.combate.blocks.title = Ora blocca il rivale
tutorial.combate.blocks.body = Premi il pulsante grande e lascia che decida lui. Ciò che riesce a bloccare non fa danno a lui: le creature si combattono tra loro invece.
tutorial.combate.damage.title = Il danno
tutorial.combate.damage.body = Ciò che non viene bloccato abbassa i punti vita del rivale, e lo vedrai cambiare sulla sua barra. Il danno sulle creature resta segnato fino alla fine del turno; se raggiunge la loro costituzione, muoiono. Con il clic destro si vede quanto ne portano.
tutorial.combate.blocking.title = Quando ti attaccano
tutorial.combate.blocking.body = Bloccare si fa con due clic e l'ORDINE conta: prima l'attaccante davanti al quale ti vuoi mettere, poi la tua creatura. Per togliere un bloccante, di nuovo gli stessi due clic.
tutorial.combate.why.title = Se premi e non succede niente
tutorial.combate.why.body = A volte il motore rifiuta ciò che hai dichiarato (una creatura obbligata ad attaccare, una che serve due bloccanti...). Quando succede, il motivo compare SOTTO il pulsante che hai appena premuto, e nomina la carta che lo impedisce. Se il pulsante non reagisce, guarda lì.
tutorial.combate.end.title = Seconda lezione fatta
tutorial.combate.end.body = Attaccare, bloccare e leggere le frecce. Resta ciò che decide le partite: le abilità e gli istantanei.

tutorial.trucos.intro.title = Carte che fanno cose
tutorial.trucos.intro.body = Sul tavolo hai un Piromante Prodigioso. Oltre a essere una creatura, ha un'abilità che puoi attivare: tappalo per infliggere 1 danno a qualsiasi cosa.
tutorial.trucos.activate.title = Attiva la sua abilità
tutorial.trucos.activate.body = Clicca il Piromante Prodigioso. Quando una carta ha più cose da fare, compare un menu con tutte, e quelle che non puoi pagare sono segnate. Scegli l'abilità, poi clicca il ritratto del rivale per puntarla su di lui.
tutorial.trucos.targets.title = Scegliere i bersagli
tutorial.trucos.targets.body = Quando qualcosa richiede un bersaglio, tutto ciò che puoi scegliere si illumina e viene disegnata una freccia curva dall'origine al bersaglio. I bersagli possono essere ovunque: il tavolo, un cimitero o l'esilio. Se sono in una zona chiusa, il gioco te la apre così puoi cliccare dentro.
tutorial.trucos.instant.title = Lancia un istantaneo
tutorial.trucos.instant.body = Nella mano hai un Fulmine. Un istantaneo si può lanciare in qualsiasi momento tu abbia la priorità: nel tuo turno, in quello del rivale, e persino con qualcosa in attesa sullo stack. Lancialo su quello che vuoi.
tutorial.trucos.stops.title = Fermarti nel turno del rivale
tutorial.trucos.stops.body = Per non doverti premere OK mille volte, il gioco ti passa la priorità da solo quando non c'è niente che tu possa fare. Se vuoi aspettare un momento preciso, CLICCA UNA FASE sul binario: così resta impostata una fermata e il gioco ti darà la priorità lì. Cliccane una per provare (e clicca di nuovo per toglierla).
tutorial.trucos.commander.title = La zona di comando
tutorial.trucos.commander.body = A destra della tua mano c'è la zona di comando, dove vive il tuo comandante. Lo lanci da lì, e ogni volta che lo rilanci costa {2} in più: l'imposta si vede accanto. In Commander perdi anche se UN comandante ti infligge 21 danni in totale, e quel contatore è sulla tua barra.
tutorial.trucos.undo.title = Annulla
tutorial.trucos.undo.body = Ctrl+Z annulla l'ultima cosa finché il motore lo permette, cioè tutto ciò che è passato per lo stack. Giocare una terra NON si può annullare, perché non passa mai da lì. Per questo conviene guardare bene prima di posare una terra.
tutorial.trucos.pause.title = Esc e impostazioni
tutorial.trucos.pause.body = Esc apre il menu di pausa: riprendi, impostazioni, ricomincia ed esci. Premilo ed entra in IMPOSTAZIONI: lì dentro c'è parecchia roba che cambia il modo di giocare e che da soli non si scopre mai, perché il gioco funziona lo stesso senza toccarla. Guarda cosa c'è e torna alla partita con Esc quando vuoi.
tutorial.trucos.settings.title = Cosa puoi cambiare lì dentro
tutorial.trucos.settings.body = In Impostazioni decidi: se il mana si paga da solo, se la priorità passa da sola quando non puoi fare nulla, in quali momenti fermarti nel turno del rivale, quanto rallentare l'IA - risolve il suo turno in millisecondi e senza rallentarla ti perdi ciò che fa -, se chiedere prima di lasciare la tua fase principale, la dimensione dell'interfaccia, la lingua e il volume. Le stesse impostazioni ci sono fuori partita, sempre con Esc.
tutorial.trucos.end.title = Ora sai giocare
tutorial.trucos.end.body = Leggere una carta con il clic destro, ingrandire con Ctrl+rotellina, giocare e attaccare cliccando o trascinando, attivare abilità, rispondere con istantanei e fermarti dove vuoi. Questi sono tutti i comandi. Il resto lo raccontano le carte, che portano il loro testo scritto sopra. Divertiti.

