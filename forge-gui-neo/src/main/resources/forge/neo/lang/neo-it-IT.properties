ascent.feat.champion.name = Campione
ascent.feat.champion.opens = La grande forgia si unisce agli incontri del cammino.
ascent.event.beacon.title = Il faro spento
ascent.event.beacon.text = In cima alla rupe c'è un faro mai acceso. Hai provviste a sufficienza per accenderlo, anche se poi ti mancheranno.
ascent.event.beacon.blocked = Servono punti vita massimi da bruciare e una ferita da curare
ascent.event.opt.burnStores = Bruciare le scorte: −{0} punti vita massimi e curarti {1}
ascent.event.res.burnStores = Ti curi {0}. I punti vita massimi calano di {1}: ora reggi {2}.
ascent.event.peddler.title = Il venditore ambulante
ascent.event.peddler.text = Un ometto apre un fagotto enorme in mezzo alla strada. Lo vende intero o non lo vende.
ascent.event.opt.buyBundle = Comprare il fagotto: {0} crediti per una reliquia e 1 carta su 3
ascent.event.res.bundle = Dal fagotto esce {0}.
ascent.event.res.bundleHalf = Non gli restavano reliquie: ti restituisce {0} crediti.
ascent.event.crypt.title = La cripta dei re
ascent.event.crypt.text = Sotto la pietra dormono quelli che sono saliti prima di te. Da molto tempo nessuno li disturba.
ascent.event.opt.takeGoods = Prendere il corredo funebre: +{0} crediti
ascent.event.opt.takeCrown = Prendere la corona: −{0} punti vita per una reliquia da boss
ascent.event.forge.title = La grande forgia
ascent.event.forge.text = Il fuoco arde da più anni di quanti ne abbia il cammino. Il fabbro guarda quello che porti addosso e indica il pezzo più vecchio.
ascent.event.forge.blocked = Servono crediti e una reliquia comune da rifondere
ascent.event.opt.reforge = Rifondere la tua reliquia comune più vecchia: {0} crediti per una rara
ascent.event.res.reforged = {0} entra nel fuoco ed esce trasformata in {1}.
ascent.event.res.noReforge = Il fabbro la rigira e te la restituisce com'era. Oggi no.
