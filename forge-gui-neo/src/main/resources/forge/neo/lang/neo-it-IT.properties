ascent.event.toll.title = IL PONTE A PEDAGGIO
ascent.event.toll.text = Un tipo grosso fa pagare il passaggio. Sotto ci sono cento metri di niente, e non sembra tipo da trattare.
ascent.event.armory.title = L'ARMERIA ABBANDONATA
ascent.event.armory.text = I portoni sono spalancati e non c'è più nessuno. Quel che c'è dentro è di chi passa.
ascent.event.smith.title = IL FABBRO
ascent.event.smith.text = Lavora il metallo delle cose che nessuno vuole più. Vende poco, caro, e sa quanto vale.
ascent.event.nest.title = IL NIDO
ascent.event.nest.text = Uova grosse come la tua testa, e qualcosa di grande che gira là sopra. Nessuno ha detto che sarebbe stato gratis.
ascent.event.crossroads.title = IL CROCEVIA
ascent.event.crossroads.text = Un posto tranquillo per fermarsi, e un mucchio di roba lasciata sul ciglio. Non c'è tempo per entrambe.
ascent.event.mirage.title = IL MIRAGGIO
ascent.event.mirage.text = La strada attraversa qualcosa che c'è e poi non c'è. Andrà bene o non andrà bene, e prima non si sa.
ascent.event.pact.title = IL PATTO
ascent.event.pact.text = Ti offre qualcosa di buono davvero. Il prezzo non è denaro né sangue: è quanto potrai reggere da adesso.
ascent.event.lender.title = L'USURAIO
ascent.event.lender.text = Presta quel che chiedi e incassa subito. Mai in denaro.
ascent.event.statue.title = LA STATUA
ascent.event.statue.text = Qualcuno la eresse qui tanto tempo fa. Ha ancora gli intarsi, e ascolta ancora.
ascent.event.wanderer.title = IL VIANDANTE
ascent.event.wanderer.text = Giorni senza mangiare, settimane a camminare. Non chiede niente, ma guarda la tua bisaccia.
ascent.event.well.title = IL POZZO DEI DESIDERI
ascent.event.well.text = Pieno di monete di chi è passato prima. Ogni tanto qualcuno ne ha tirate fuori più di quante ne aveva buttate.
ascent.event.hermit.title = L'EREMITA
ascent.event.hermit.text = Vive qui da prima della strada. Dice che viaggi carico, e non parla dello zaino.
ascent.event.teacher.title = LA MAESTRA
ascent.event.teacher.text = Le bastano due passi per sapere tutto quello che sbagli. Si offre di sistemartelo. A modo suo.
