# --- Ascenso: salir de un duelo cuesta la run ---
pause.quit.run.ask = Uscire e perdere la run?
pause.quit.run.detail = Questo nodo non conta finché non lo vinci, quindi uscire adesso chiude la run: mazzo, reliquie e tutti i progressi vanno persi. Per smettere senza perdere nulla, finisci questo duello e premi Indietro dalla mappa.
pause.quit.run.yes = Abbandona la run

# --- Ascenso: el menu y montar la run ---
menu.ascent = Ascesa
menu.ascent.desc = Una run contro il destino. Sali per la mappa, migliora il mazzo tra un combattimento e l'altro e non guardare indietro: se perdi, è finita.
menu.ascent.none = una run roguelike, 45-60 minuti
menu.ascent.running = continua — atto {0}, {1} punti vita
menu.ascent.ascension = ascesa {0} sbloccata
ascent.setup.title = UNA NUOVA ASCESA
ascent.setup.subtitle = Una volta iniziata non si torna indietro: se perdi, la run è finita.
ascent.setup.mode = Con quali regole
ascent.setup.mode.standard = Standard
ascent.setup.mode.commander = Commander
ascent.setup.mode.standard.desc = 30 carte, 20 punti vita. Uno o due colori e nessuna rara: il mazzo è debole di proposito, perché tutta la run consiste nel migliorarlo.
ascent.setup.mode.commander.desc = Un comandante e 20 carte, 40 punti vita. I premi seguono la sua identità di colore, quindi sceglierlo definisce l'intera run.
ascent.setup.commander = Il tuo comandante
ascent.setup.search = Cerca per nome
ascent.setup.randomCommander = Che scelga il gioco
ascent.setup.page = pagina {0} di {1} — {2} comandanti
ascent.setup.ascension = Ascesa
ascent.setup.ascension.none = Nessuna
ascent.setup.start = Inizia l'ascesa
ascent.setup.startOver = Inizia una nuova ascesa
ascent.setup.willLose = Hai già una run in corso. Iniziarne un'altra la perde per sempre.
ascent.setup.confirm.ask = Buttare via la run in corso?
ascent.setup.confirm.detail = Mazzo, reliquie e tutto quello che avevi scalato spariscono. C'è sempre una sola run alla volta.
ascent.setup.confirm.yes = Buttala e inizia
