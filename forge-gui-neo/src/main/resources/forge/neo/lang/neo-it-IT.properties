ascent.event.shrine.title = IL SANTUARIO CREPATO
ascent.event.shrine.text = Una pietra spaccata, con qualcosa che luccica dentro. La crepa è larga giusto per un braccio, e i bordi non sembrano gentili.
ascent.event.gambler.title = IL GIOCATORE
ascent.event.gambler.text = Ha messo il tavolo in mezzo alla strada e mescola senza guardare le carte. Dice che il banco perde sempre. E sorride mentre lo dice.
ascent.event.chest.title = IL BAULE CON LA TRAPPOLA
ascent.event.chest.text = Chiuso da un meccanismo che non capirai in tempo. Dentro qualcosa si muove, e il metallo porta i segni di chi ci ha provato prima.
ascent.event.collector.title = IL COLLEZIONISTA
ascent.event.collector.text = Non gli interessano i tuoi soldi né il tuo sangue: vuole una carta, una qualsiasi, e paga bene. Insiste che scelga tu.
ascent.event.campfire.title = IL FALO’ DIMENTICATO
ascent.event.campfire.text = Qualcuno lo ha lasciato acceso ed è andato via. Basta per scaldarsi un po’, o per bruciare qualcosa che non ti serve più.
ascent.event.echo.title = L'ECO DEL PIANO
ascent.event.echo.text = L'aria ripete i tuoi pensieri mezzo secondo dopo. Se glielo lasci fare ti insegna qualcosa — ma se lo fa pagare.
ascent.event.fountain.title = LA FONTANA
ascent.event.fountain.text = Acqua ferma, senza fondo visibile. Il proprietario fa pagare il sorso e non spiega niente.
