name: macOS

# Compila NeoForge para Mac en las maquinas de GitHub, lo prueba ya empaquetado
# y deja los .dmg como artefactos. Con "release" puesto, ademas los sube a un
# BORRADOR de release con esa etiqueta: se publica a mano despues de mirarlo.

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Etiqueta del borrador de release (vacio = solo compilar)"
        required: false
        default: ""

env:
  # El commit de Forge sobre el que se ha probado este codigo. Se sube a la vez
  # que se rebasa el arbol de trabajo.
  FORGE_REF: 2d0711c71a17aaa30f9ce22a84e223b2dce55f6d
  VERSION: "1.0"

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      ARCH: ${{ matrix.arch }}
      WORK: ${{ github.workspace }}/_mac
      OUT: ${{ github.workspace }}/_mac/out
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compilar y empaquetar
        run: bash mac/empaquetar.sh

      - name: Probar el paquete
        run: bash mac/probar.sh

      - name: Subir el .dmg
        uses: actions/upload-artifact@v4
        with:
          name: NeoForge-macOS-${{ matrix.arch }}
          path: _mac/out/*.dmg
          compression-level: 0
          retention-days: 14

      - name: Subir capturas y registros
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pruebas-macOS-${{ matrix.arch }}
          path: |
            _mac/out/*.png
            _mac/out/*.log
          retention-days: 14

  release:
    name: Borrador de release
    needs: build
    if: ${{ inputs.release != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: NeoForge-macOS-*
          merge-multiple: true
          path: dmg

      - name: Crear o actualizar el borrador
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release }}
        run: |
          ls -lh dmg
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dmg/*.dmg --clobber
          else
            gh release create "$TAG" dmg/*.dmg --draft --prerelease \
              --target "$GITHUB_SHA" \
              --title "NeoForge para macOS (beta)" \
              --notes-file mac/NOTAS-RELEASE.md
          fi
